---
# Weekly upstream release report. Sibling to scan.yml, driven the same two ways:
# `make release-check` from the workstation, and homelab-release@svcops.timer on
# svc-infra at 08:30 on Mondays.
#
# It answers a question nothing else here answers: WHAT HAS UPSTREAM SHIPPED.
# `make image-check` answers whether a pin has drifted from the tag it follows,
# which it can only do for the 13 images carrying a recorded `# tag:` — and the
# 35 it cannot see are the ones apps.yml deliberately leaves untracked precisely
# because they are the dangerous ones to bump blind. Those are exactly the
# releases somebody needs to READ about. See docs/plans/release-report.md.
#
# The same two rules that govern scan.yml govern this.
#
#  1. REPORT ONLY. Nothing here pulls, bumps, deploys or restarts, and it never
#     prints a `make image-bump` line for an untracked image — doing that would
#     turn a report into the standing recommendation that the BUMP PROCEDURE
#     block was written to prevent. tests/validate_scan_readonly.py enforces the
#     first half at build time; the second is a judgement, stated here so it can
#     be held to.
#
#  2. NO vault_ REFERENCES. This runs from the nightly runner's checkout at
#     /opt/homelab-iac, which is a `git archive`, and the vault is gitignored —
#     so every vault_ variable is undefined there. b77f27f is the cautionary
#     tale. GITHUB_TOKEN, if it is ever used, comes from the rendered
#     environment file on the host, never from a vault lookup at run time.
- name: Report what upstream has released
  hosts: infra_vms
  gather_facts: true
  become: true
  tasks:
    # Runs on one host by construction: this reads registries and a release
    # feed, and which VM holds the checkout is an implementation detail. Nothing
    # about it is per-host, unlike the security scan.
    # Asking the running service beats reading a build-time label, and for
    # Grafana, Prometheus and node-exporter it is the only source there is —
    # none of the three carries a version label at all. Done here rather than in
    # the script because the URLs are host knowledge (which VM, which port,
    # loopback vs LAN) and the script deliberately knows only about files and
    # registries.
    - name: Ask each service that reports its own version
      ansible.builtin.uri:
        url: "{{ item.value.url }}"
        return_content: true
        timeout: 10
        status_code: [200]
      register: release_probe_results
      loop: "{{ release_version_probes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: false
      # A service that is down must not fail the report — it is one image out of
      # 48, and the fallback is the honest `unknown-version` this replaces.
      failed_when: false

    - name: Build the probed-version map
      ansible.builtin.set_fact:
        release_probed: "{{ release_probed | default({}) | combine(entry) }}"
      loop: "{{ release_probe_results.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      vars:
        captured: >-
          {{ (item.content | default('') | regex_search(item.item.value.pattern, '\1')
              | default([], true) | first | default('')) }}
        entry: >-
          {{ {item.item.key: captured} if (captured is match('^(?=.*\d)(?=.*\.).+$'))
             else {} }}
      when: item.content is defined

    - name: Record the probed versions for the check to read
      ansible.builtin.copy:
        content: "{{ release_probed | default({}) | to_nice_json }}\n"
        dest: "{{ release_report_dir }}/versions-probed.json"
        owner: "{{ svc_uid }}"
        group: "{{ svc_gid }}"
        mode: "0644"
      changed_when: false

    - name: Check every pinned image against its upstream release feed
      ansible.builtin.command:
        # The INSTALLED script, not the one in the checkout. /opt/homelab-iac is
        # a `git archive` of the deployed revision, so scripts/ only exists
        # there after the commit that adds it — a playbook pointing into the
        # checkout works on a workstation and fails on the runner, which is the
        # more important of the two. The role installs the script; only the
        # catalogs are read from the checkout, via --root.
        cmd: >-
          {{ release_check_bin }}
          --json
          --root {{ release_checkout }}
          --probed {{ release_report_dir }}/versions-probed.json
          --previous {{ release_state_file }}
          --state-out {{ release_state_file }}.next
      # WITHOUT THIS BLOCK THE TOKEN NEVER ARRIVES. The wrapper exports
      # GITHUB_TOKEN into the ansible-playbook process, but that is the
      # CONTROLLER; this task executes on svc-infra through the connection
      # plugin, and a controller environment variable does not cross it. So
      # release_check.py read an unset GITHUB_TOKEN however carefully the file
      # beside it was rendered, and the report stayed on the unauthenticated
      # 60/hour budget that a full run of ~45 requests very nearly exhausts —
      # visible only as the weekly DEGRADED alert nobody could act on.
      #
      # lookup('env') reads the CONTROLLER's environment, which is exactly
      # where the wrapper and the systemd EnvironmentFile put it. It is not a
      # vault_ reference, so rule 2 in this file's header still holds and the
      # `git archive` checkout is unaffected.
      environment:
        GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
      register: release_raw
      changed_when: false
      # Never fails the play on a nonzero exit. The script exits 1 when its own
      # positive control trips — no version resolved, or no feed answered — and
      # that is a finding to publish loudly, not a reason to abort before
      # publishing it. The escalation below is what carries the news.
      failed_when: false
      # Was deliberately false while this task had nothing to hide. It now
      # carries a credential in `environment:`, and an -vvv run on the host
      # would otherwise put it in the journal. The cost is that the raw report
      # no longer prints here; the parsed summary, the report files and the
      # ntfy message all still do, and `authenticated` below is what makes the
      # token's arrival checkable without printing it.
      no_log: true

    - name: Establish the report, distinguishing a bad run from a quiet week
      ansible.builtin.set_fact:
        # A parse failure is its own state. Reading an unparseable result as an
        # empty report would publish "nothing new upstream" for a run that never
        # produced a report at all — the exact shape of every failure this repo
        # has written down.
        release: >-
          {{ (release_raw.stdout | from_json)
             if (release_raw.stdout | default('') | trim | length > 0
                 and (release_raw.stdout | trim).startswith('{'))
             else {'images': [], 'new': [], 'still_behind': [], 'seeded': false,
                   'summary': {'ok': false, 'counts': {},
                               'images_examined': 0, 'versions_resolved': 0,
                               'feeds_answered': 0,
                               'detail': 'the release check produced no parseable output (rc='
                                         ~ (release_raw.rc | default('?')) ~ ')'}} }}

    - name: Summarise the run
      ansible.builtin.set_fact:
        release_ok: "{{ release.summary.ok | default(false) | bool }}"
        release_new: "{{ release.new | default([]) }}"
        release_behind: "{{ release.still_behind | default([]) }}"
        release_counts: "{{ release.summary.counts | default({}) }}"
        release_unmeasured: >-
          {{ release.images | default([])
             | selectattr('verdict', 'in', ['error', 'no-feed', 'unknown-version'])
             | list }}

    - name: Decide what is worth publishing to the alert topic
      ansible.builtin.set_fact:
        # Escalation is for the CHECK being broken, never for the estate being
        # behind. This estate deliberately runs behind on versions — that is the
        # whole premise of the BUMP PROCEDURE — so alerting on a number that is
        # expected to be non-zero is how a channel becomes background noise.
        # Only two things here are worth waking somebody: the report could not
        # measure anything, or enough of it errored that the result is a floor
        # rather than a total.
        release_escalate: >-
          {{ (not release_ok)
             or ((release_counts.error | default(0) | int) > 0) }}
        release_escalation_reason: >-
          {{ release.summary.detail
             if (not release_ok)
             else ((release_counts.error | default(0)) ~ ' image(s) could not be '
                   ~ 'checked at all — the release counts below are a floor, not a total') }}
    # Built as a list and joined, rather than as one folded scalar. A folded
    # scalar joins its lines with a space unconditionally, so every clause that
    # renders empty leaves a double space behind — scan.yml carries exactly
    # that artifact, and its neighbouring comment records an earlier round of
    # the same fight where the folding put whole blank lines mid-message.
    # `select` drops the empty clauses before the join, so the spacing is right
    # for any combination of them and no clause has to know about the others.
    - name: Compose the one-line summary
      ansible.builtin.set_fact:
        release_summary_line: "{{ summary_parts | select | join(' ') }}"
      vars:
        summary_parts:
          # DEGRADED leads, and it is not decoration. Read back off ntfy during
          # the first live test, a broken run's routine message said "0 new
          # upstream release(s) ... 0 up to date across 0 pinned images" —
          # which on the muted topic, at a glance, is indistinguishable from a
          # quiet week. The escalation carried the truth, but the two messages
          # disagreed and only one of them gets read casually.
          - "{{ ('DEGRADED — this run measured nothing: ' ~ release.summary.detail ~ '.') if not release_ok else '' }}"
          - "{{ release_new | length }} new upstream release(s) since the last report;"
          - "{{ release_behind | length }} still behind,"
          - "{{ release_counts.current | default(0) }} up to date across"
          - "{{ release.summary.images_examined | default(0) }} pinned images"
          - "({{ release_unmeasured | length }} unmeasured)."
          - "{{ release_new | map(attribute='name') | join(', ') }}"
          - "{{ 'SEEDED — no baseline existed, so nothing is reported as new.' if release.seeded | default(false) else '' }}"
          - "{{ ((release_counts.error | default(0)) ~ ' COULD NOT BE CHECKED — the counts above are a floor.') if (release_counts.error | default(0) | int) > 0 else '' }}"

    # Same reasoning as scan.yml's emitter: read the facts that feed ntfy, so
    # the chart and the message cannot disagree. --success follows release_ok,
    # which is the report's own "this run measured something" verdict.
    #
    # `comparable` is derived, not a fact: images_examined counts every pinned
    # image, release_unmeasured counts the ones with no usable answer, and the
    # difference is what the report can actually compare. Charting it against
    # the total is what makes coverage legible as it accrues — and keeps
    # "unmeasured" a visible quantity instead of folding it into "fine".
    - name: Publish the release check as metrics
      ansible.builtin.command:
        argv: >-
          {{ [infra_metric_write_bin,
              '--dir', infra_textfile_dir,
              '--file', 'release',
              '--prefix', 'homelab_release']
             + (['--success'] if release_ok else []) }}
        # images_total/unmeasured/comparable and the run timestamp publish
        # unconditionally — they are the "did this run measure anything"
        # evidence, and a zero there is meaningful on its own. The FINDINGS
        # (behind/current/new/errors) are gated on release_ok: a run that
        # produced no parseable output has images_examined=0 and every list
        # empty, so without this gate it would still emit four valid lines of
        # zero — "0 behind, 0 current, 0 new, 0 errors" — which is
        # indistinguishable from a genuinely quiet week. Suppressing them lets
        # the series go absent instead of reading as a clean run.
        #
        # homelab_release_authenticated joins the gated group, and it is the
        # TOKEN'S POSITIVE CONTROL — the only way to tell from outside that the
        # token arrived. release_check.py reports whether it actually saw a
        # GITHUB_TOKEN, so this reads 1 when the whole chain held (vault ->
        # rendered env file -> systemd EnvironmentFile -> wrapper -> controller
        # -> this task's environment) and 0 when any link broke. Two of those
        # links were broken independently, and neither was visible: the failure
        # mode is a silent drop back to 60 requests/hour, which looks like a
        # slightly worse week rather than like a break. Charted for that reason
        # rather than alerted on. Gated because a run that produced no parseable
        # output did not measure this either, and a 0 there would report a
        # broken token that may be perfectly fine.
        stdin: |
          homelab_release_images_total {{ release.summary.images_examined | default(0) }}
          homelab_release_images_unmeasured {{ release_unmeasured | length }}
          homelab_release_images_comparable {{ (release.summary.images_examined | default(0) | int) - (release_unmeasured | length) }}
          {% if release_ok %}
          homelab_release_images_behind {{ release_behind | length }}
          homelab_release_images_current {{ release_counts.current | default(0) }}
          homelab_release_new {{ release_new | length }}
          homelab_release_errors {{ release_counts.error | default(0) }}
          homelab_release_authenticated {{ 1 if release.summary.authenticated | default(false) else 0 }}
          {% endif %}
      register: release_metrics
      changed_when: false
      failed_when: false

    - name: Warn if the release metrics could not be published
      ansible.builtin.debug:
        msg: >-
          metric publish FAILED (rc={{ release_metrics.rc | default('none') }}):
          {{ release_metrics.stderr | default('') }} —
          the estate dashboard will show this emitter as stale
      when: (release_metrics.rc | default(0)) != 0

    - name: Write the release report
      ansible.builtin.template:
        # Explicit path, not a bare filename: this play does not apply the
        # svc_infra role, so the role's templates/ is not on the search path.
        # It stays under roles/svc_infra/templates/ anyway, because that is the
        # tree tests/validate_secret_tasks.py globs when deciding which
        # templates are secret-bearing.
        src: roles/svc_infra/templates/release-report.txt.j2
        dest: "{{ release_report_dir }}/releases.txt"
        owner: "{{ svc_uid }}"
        group: "{{ svc_gid }}"
        mode: "0644"

    - name: Write the browsable release report
      ansible.builtin.template:
        src: roles/svc_infra/templates/release-report.html.j2
        dest: "{{ release_report_dir }}/releases.html"
        owner: "{{ svc_uid }}"
        group: "{{ svc_gid }}"
        mode: "0644"

    # THE BASELINE MOVES ONLY AFTER THE REPORT IS WRITTEN, and only if the run
    # measured something. scan.yml learned this from a real false alarm on
    # 2026-07-30, where a run in which everything failed wrote its zeroes as the
    # baseline and made the next healthy run report an increase that had not
    # happened. Here the failure would be quieter and worse: a broken run that
    # recorded its own empty state would make every genuinely-old release
    # resurface as NEW next week, and a report that cries wolf once has spent
    # the only credibility it had.
    - name: Promote this run's state to the baseline for the next
      ansible.builtin.command:
        cmd: mv -f {{ release_state_file }}.next {{ release_state_file }}
      changed_when: true
      when: release_ok

    - name: Discard the state from a run that measured nothing
      ansible.builtin.file:
        path: "{{ release_state_file }}.next"
        state: absent
      when: not release_ok

    # Published on EVERY run, to the muted informational topic. The report is
    # news, not an alarm — a new Jellyfin is not something to be woken for.
    - name: Publish the routine release summary
      ansible.builtin.include_role:
        name: notify
      vars:
        ntfy_title: "homelab releases ({{ release_new | length }} new)"
        ntfy_result: "{{ release_summary_line }}"
        ntfy_tags: package

    # ...and only a broken CHECK reaches the topic that is allowed to wake
    # somebody. See the reasoning on release_escalate above.
    - name: Escalate a release check that could not measure what it claims to
      ansible.builtin.include_role:
        name: notify
      vars:
        ntfy_topic_override: "{{ ntfy_alert_topic }}"
        ntfy_title: "homelab release check DEGRADED"
        ntfy_priority: high
        ntfy_tags: warning
        ntfy_result: >-
          {{ release_escalation_reason }}. A release report that could not look
          is not a week with no new releases. Full report at
          https://scan.{{ service_domain }}/releases.txt
      when: release_escalate

    - name: Show the report in the play output
      ansible.builtin.debug:
        msg: "{{ release_summary_line }}"
