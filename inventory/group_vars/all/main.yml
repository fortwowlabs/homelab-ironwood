---
# ============================================================================
# Environment facts (audited 2026-05-31; image pin refreshed 2026-07-15).
# Non-secret — safe in git. Secrets live in group_vars/all_vault.yml
# (ansible-vault encrypted).
# ============================================================================

# --- Network / identity ---
lan_gateway:     192.168.1.1
lan_dns:         192.168.1.1
lan_cidr:        192.168.1.0/24     # admin scope (deliberate: whole flat LAN)
admin_user:      straderb
svc_uid:         10001
svc_gid:         10001
timezone:        America/New_York

# --- Unmanaged storage host ---
# Managed host addresses live only in inventory/hosts.yml (`ansible_host` for
# service VMs and `pve_api_host` for thurgadin).
truenas_ip: 192.168.1.20

# --- Service VM identity (v6) ---
# `download_host`/`media_host`/`infra_host` resolve to whichever
# inventory_hostname is a member of the download_vms/media_vms/infra_vms
# child groups (inventory/hosts.yml) — use these (or
# `hostvars[download_host]`/`hostvars[media_host]`/`hostvars[infra_host]`)
# instead of a literal "svc-download"/"svc-media"/"svc-infra" so renaming a
# host in inventory is a single edit. See docs/operations.md.
download_host: "{{ groups['download_vms'] | first }}"
media_host:    "{{ groups['media_vms'] | first }}"
infra_host:    "{{ groups['infra_vms'] | first }}"

# --- Windows 11 / RTX 4090 GPU host (NOT managed by Ansible) ---
# A workstation, not a VM: it runs Ollama and ComfyUI natively so Open WebUI
# has somewhere to do inference and image generation, and so Continue for
# VSCode can talk straight to it. There is no Ansible connection to it and
# there never will be — see docs/gpu-host.md for the manual setup.
#
# The address is reserved ahead of the hardware. Make the matching DHCP
# reservation when the PC arrives; nothing here reaches out to it until
# gpu_host_online is flipped.
gpu_host_ip: "192.168.1.40"
# While false, Open WebUI is deployed with its Ollama and image-generation
# backends switched OFF, so the UI shows no dead-backend errors for a machine
# that does not exist yet. Flipping this to true and running `make infra` is
# the entire go-live step.
gpu_host_online: false

# --- TrueNAS NFS (created by hand in Phase 1 — NOT automated) ---
# These live INSIDE the exported `tank` dataset (exports are tank + rust;
# verify with `showmount -e 192.168.1.20`).
nfs_media_export:   "/mnt/sata_wd_14tb/tank/media"
nfs_backups_export: "/mnt/sata_wd_14tb/tank/backups"
nfs_opts: "hard,nofail,x-systemd.automount,x-systemd.mount-timeout=30"
service_nfs_mounts:
  - { path: /srv/media, export: "{{ nfs_media_export }}" }
  - { path: /srv/backups, export: "{{ nfs_backups_export }}" }

# --- Proxmox storage (from /etc/pve/storage.cfg) ---
pve_storage:         nvme0pool           # VM disks
pve_snippet_storage: local
pve_snippet_dir:     /var/lib/vz/snippets
pve_image_dir:       /var/lib/vz/template/cache
pve_bridge:          vmbr0
# EL10 userspace is x86-64-v3; PVE default (v2-AES) won't boot it. 'host' on
# the 3700X (Zen 2) qualifies. Use x86-64-v3 instead only for live migration.
pve_cpu_type:        host

# --- Rocky 10 GenericCloud image — PINNED (v5) --------------------------
# Pin a DATED build, never the mutable `.latest` symlink. The SHA-256 below is
# committed with the filename and the PVE role hashes the actual image bytes
# on every run; no stamp file is trusted.
#
# BUMP PROCEDURE (deliberate, not automatic):
#   1. Browse https://dl.rockylinux.org/pub/rocky/10/images/x86_64/
#   2. Verify the signed Rocky CHECKSUM and update all three values below.
#   3. Preserve or remove the old cached image only during planned maintenance.
#   4. Note: Rocky prunes dated images of the PREVIOUS minor when a new one
#      lands, so a stale pin eventually 404s — that is your cue to bump.
rocky_image_name: "Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2"
rocky_image_url:  "https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2"
rocky_image_sha256: "9fc9e9ff16888bb68ac39b0392e25c9c92684d50c85f1cce6ab549363bbc4b48"

# --- Admin SSH key injected into both VMs (public key CONTENT, not a path) ---
# Paste your MBP ed25519 public key here (safe — it's a public key):
admin_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMjZAEI+FfdW74JRrWjUbSK9HmF7AVHaa8qlYsN9YSLB straderb@Mac.fort.wow"

# --- Mullvad in-tunnel DNS (public constant, not a secret) ---
mullvad_dns: "10.64.0.1"

# --- Beszel monitoring agent (v6) -----------------------------------------
# One agent per VM (svc-download, svc-media, svc-infra), all reporting to
# the beszel-hub catalog entry on svc-infra. Bespoke per-role quadlets, not
# an infra_apps entry, since agents need no published port and svc-download's
# needs to run rootful in the init ns (not the download_apps VPN jail).
# vault_beszel_token/vault_beszel_key can only be generated by visiting the
# hub's UI once after it first deploys — see docs/services.md "Beszel
# monitoring setup". Until filled in, every agent skips itself with a
# WARNING instead of failing the deploy (matching the ntfy_url pattern).
beszel_agent_image: "docker.io/henrygd/beszel-agent@sha256:8874e2c53f9de5e063a6a80d6b617e20fa593ac5dc4eb4c6ce1f912f510f38f8"
beszel_agent_enabled: >-
  {{ (vault_beszel_token | default('')) | length > 0
     and (vault_beszel_key | default('')) | length > 0 }}

# --- node_exporter (v6, monitoring stack) ----------------------------------
# Prometheus host-metrics exporter, one per VM (svc-download/svc-media/
# svc-infra), each a bespoke per-role Quadlet (rootless on media/infra,
# rootful init-ns on download) like the Beszel agents — NOT a catalog entry,
# since it needs Network=host + read-only /proc,/sys,rootfs mounts and custom
# Exec args. Scraped by the Prometheus infra_apps entry on svc-infra; the
# scrape targets are all three hostvars[...].ansible_host:9100 (see
# prometheus.yml.j2). Each exporter is reachable ONLY from svc-infra's IP
# (firewalld single-source rule on media/infra, an nftables input rule on
# download's host backstop).
node_exporter_image: "docker.io/prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0"

# --- Recyclarr (v6, download jail) -----------------------------------------
# TRaSH-Guides sync for Sonarr/Radarr. Bespoke, not a download_apps entry:
# the official image doesn't support PUID/PGID (needs Podman User= instead)
# and its config embeds API keys read live off Sonarr/Radarr's own
# config.xml, so its Quadlet render must be no_log-wrapped (see
# roles/svc_download/tasks/files.yml). Self-disables (WARNs instead of
# failing) until Sonarr and Radarr have both started at least once and
# generated a config.xml — same "skip cleanly until the prerequisite
# exists" shape as beszel_agent_enabled above.
recyclarr_image: "ghcr.io/recyclarr/recyclarr@sha256:2d6107f758d882a59fe9d646aa54fa8a5a4fb7a40995125fade575652a3f7871"

# --- ntfy: where deploy results are pushed. ------------------------------
# Default is the LAN-internal ntfy you'll stand up on svc-media (Phase 9).
# FIRST RUN: that ntfy does not exist yet. Either point this at
# https://ntfy.sh with a long random topic for bootstrap, or accept that
# the push fails — v5 prints a loud WARNING in the play output instead of
# swallowing it (v4 was silent). The svc-download leak canary alerts to
# this same target; the host backstop opens egress to it automatically
# when the ntfy host is the canonical svc-media inventory address.
ntfy_url:   "http://{{ hostvars[media_host].ansible_host }}:8080"
ntfy_topic: "homelab-deploy"

# Two topics, because a phone that pings for every green deploy gets muted,
# and a muted phone is the same as no alerting at all. Subscribe to both;
# mute homelab-deploy and leave homelab-alerts loud.
#   homelab-deploy — informational: deploy/verify succeeded, scrub finished.
#   homelab-alerts — actionable ONLY: a unit failed, a disk is filling, the
#                    certificate is expiring, the canary tripped.
# Scripts read NTFY_ALERT_TOPIC from /etc/homelab-notify.env.
ntfy_alert_topic: "homelab-alerts"

# --- unattended-operation watchers ---------------------------------------
# Sized for "nobody looks at this for six months". The governing idea is that
# every silent failure mode gets a loud owner, and that no alert repeats often
# enough to train you to swipe it away.
#
# onfailure_units_base/_extra: systemd units that get an
# OnFailure=notify-failure@%n.service drop-in (roles/service_vm/tasks/
# onfailure.yml). _base applies everywhere; _extra is per-host in host_vars.
# tests/validate_onfailure.py fails the build if a timer-triggered unit in
# this repo is in neither the union nor the test's documented allowlist —
# so a future timer cannot ship without a failure path.
onfailure_units_base:
  - homelab-diskalert.service
  - homelab-failedunits.service

# Local filesystems alert at 85%. NFS gets its own, higher threshold: the NAS
# is an order of magnitude bigger, so 85% there is neither urgent nor rare,
# but 90% still deserves a look before it wedges a download.
disk_alert_threshold: 85
disk_alert_nfs_threshold: 90
# How long a still-unresolved disk or failed-unit condition waits before it
# re-alerts. The old behaviour was every 15 minutes, forever, which is how an
# alert channel becomes background noise.
alert_realert_hours: 6

# healthchecks.io is the one piece of this that deliberately lives outside
# the house. Everything else alerts by pushing to ntfy on the LAN, which is
# silent in exactly the scenario that matters most while away: the whole
# environment, the network, or the power being gone. These jobs ping OUT on
# success; healthchecks.io alerts on the ping that never arrives. See the
# vault_hc_ping_* block in inventory/group_vars/all_vault.yml.example for the
# one-time account setup. Empty UUIDs are safe — the ping is skipped.
healthchecks_base_url: "https://hc-ping.com"
# How stale the newest backup artifact may be before homelab-backups-fresh
# treats a host as failed. The three backup timers run 03:09–03:40 and the
# checker runs at 04:40, so 26h tolerates one missed night's window without
# tolerating a silently-stopped backup.
backup_max_age_hours: 26

# Days of remaining certificate life below which homelab-certwatch fails (and
# therefore alerts). The wildcard renews at 30 days left, so 21 means "two
# renewal attempts have already failed" — a real problem, not a blip.
cert_expiry_days: 21

# --- svc-media access layer -----------------------------------------------
# caddy  = deploy the Caddy reverse proxy for *.{{ service_domain }} (publicly trusted TLS).
# manual = role stops at "containers healthy on the LAN"; you run Caddy by hand.
# (v6: Tailscale removed from svc-media — remote access is via the subnet router.)
media_access_layer: caddy

# --- Service naming (v6) --------------------------------------------------
# Every service is reachable at https://<key>.{{ service_domain }} instead of
# an IP:port. Caddy on svc-media is the single reverse proxy (Let's Encrypt TLS);
# dnsmasq on svc-media answers *.{{ service_domain }} -> its ansible_host. pfSense
# forwards the domain to it and Tailscale split-DNS does the same for the
# tailnet — both one-time; see docs/services.md and docs/deployment.md.
#
# This catalog is the source of truth for media and infrastructure endpoints.
# Download endpoints are derived from download_apps, so their ports and
# dashboard metadata are never duplicated here.
#   backend         host:port Caddy proxies to (127.0.0.1 = on svc-media)
#   scheme          optional, default http (set to https for TLS backends)
#   tls_skip_verify optional bool, for self-signed https backends
service_domain: fortwow.dev
acme_email: brandon.strader@gmail.com

# cloud-init's guest FQDN/resolv search domain. A distinct knob (pve_vm
# consumes it, not Caddy/dnsmasq) but follows service_domain by default since
# in practice they're the same split-horizon domain — override only if you deliberately
# want the guest OS's search domain to differ from the service naming domain.
search_domain: "{{ service_domain }}"

# group/icon are used by the Homepage dashboard; Caddy/dnsmasq ignore them.
caddy_services:
  # Jellyfin publishes only on svc-media's LAN address, not loopback.
  jellyfin:   { backend: "{{ hostvars[media_host].ansible_host }}:8096", group: Media, icon: jellyfin }
  abs:        { backend: "127.0.0.1:13378",            group: Media,     icon: audiobookshelf }
  romm:       { backend: "127.0.0.1:8081",             group: Media,     icon: romm }
  seerr:      { backend: "127.0.0.1:5055",             group: Media,     icon: overseerr }
  calibre-web: { backend: "127.0.0.1:8083",            group: Media,     icon: calibre-web }
  # monitoring (feat/monitoring): Cockpit serves its own self-signed TLS
  home:          { backend: "127.0.0.1:3000",          group: Infra, icon: homepage }
  ntfy:          { backend: "{{ hostvars[media_host].ansible_host }}:8080", group: Infra, icon: ntfy }
  cockpit-media: { backend: "127.0.0.1:9090",          group: Infra, icon: cockpit, scheme: https, tls_skip_verify: true }
  cockpit-dl:    { backend: "{{ hostvars[download_host].ansible_host }}:9090", group: Infra, icon: cockpit, scheme: https, tls_skip_verify: true }
  cockpit-infra: { backend: "{{ hostvars[infra_host].ansible_host }}:9090", group: Infra, icon: cockpit, scheme: https, tls_skip_verify: true }
  # infra_apps catalog services (svc-infra) — the backend is always
  # hostvars[infra_host].ansible_host, never 127.0.0.1: Caddy runs on
  # svc-media, a different host, so the generic infra Quadlet template
  # publishes each app on svc-infra's LAN IP (not loopback) for Caddy to
  # reach; the catalog's ui_port must match here.
  uptime-kuma: { backend: "{{ hostvars[infra_host].ansible_host }}:3001", group: Infra, icon: uptime-kuma }
  syncthing:   { backend: "{{ hostvars[infra_host].ansible_host }}:8384", group: Infra, icon: syncthing }
  beszel:      { backend: "{{ hostvars[infra_host].ansible_host }}:8090", group: Infra, icon: beszel }
  paperless:   { backend: "{{ hostvars[infra_host].ansible_host }}:8000", group: Infra, icon: paperless-ngx }
  bambuddy:    { backend: "{{ hostvars[infra_host].ansible_host }}:8001", group: Infra, icon: bambu-lab }
  netbox:      { backend: "{{ hostvars[infra_host].ansible_host }}:8080", group: Infra, icon: netbox }
  home-assistant: { backend: "{{ hostvars[infra_host].ansible_host }}:8123", group: Infra, icon: home-assistant }
  immich:      { backend: "{{ hostvars[infra_host].ansible_host }}:2283", group: Media, icon: immich }
  # Nextcloud reads the ORIGINAL Host header (to match TRUSTED_PROXIES /
  # OVERWRITEHOST on its own side) — no host_header rewrite here, unlike
  # glances above.
  nextcloud:   { backend: "{{ hostvars[infra_host].ansible_host }}:8081", group: Infra, icon: nextcloud }
  it-tools:    { backend: "{{ hostvars[infra_host].ansible_host }}:8082", group: Infra, icon: it-tools }
  # host_header: glances' MCP transport (/mcp/sse) enforces a localhost-only
  # Host header as DNS-rebinding protection (no config flag to widen it) —
  # its plain REST API has no such check. Caddy rewrites the outbound Host
  # header so https://glances.{{ service_domain }}/mcp/sse works externally too.
  glances:     { backend: "{{ hostvars[infra_host].ansible_host }}:61208", group: Infra, icon: glances, host_header: "localhost:61208" }
  code-server: { backend: "{{ hostvars[infra_host].ansible_host }}:8443", group: Infra, icon: code-server }
  semaphore:   { backend: "{{ hostvars[infra_host].ansible_host }}:3000", group: Infra, icon: semaphore }
  webtop:      { backend: "{{ hostvars[infra_host].ansible_host }}:3003", group: Infra, icon: webtop }
  prometheus:  { backend: "{{ hostvars[infra_host].ansible_host }}:9091", group: Infra, icon: prometheus }
  grafana:     { backend: "{{ hostvars[infra_host].ansible_host }}:3005", group: Infra, icon: grafana }
  mealie:      { backend: "{{ hostvars[infra_host].ansible_host }}:9925", group: Infra, icon: mealie }
  # Open WebUI. Deliberately NOT in sso_protected_services: it has its own
  # account system and its own first-visit admin setup, and fronting that with
  # Authelia would mean two logins for one service. Its native apps and the
  # /api/ surface Continue-style clients use would not survive a redirect to
  # the portal either.
  chat:        { backend: "{{ hostvars[infra_host].ansible_host }}:3007", group: Infra, icon: open-webui }
  # WebSocket live-sync (/notifications/hub) rides the same port as the web
  # UI (see the vaultwarden catalog comment in infra-apps.yml) and Caddy's
  # reverse_proxy passes Upgrade/Connection through automatically — no
  # host_header or extra directive needed here.
  vaultwarden: { backend: "{{ hostvars[infra_host].ansible_host }}:8222", group: Infra, icon: vaultwarden }
  # Authelia's login portal. Session cookies are issued for the whole
  # {{ service_domain }} parent domain, which is what will make this single
  # sign-on across sibling subdomains once forward_auth lands — so this
  # hostname must stay under the same domain as the services it fronts.
  #
  # When the forward-auth phase adds sso_protected_services, `auth` must
  # NEVER appear in that list: protecting the portal with itself is an
  # infinite redirect. See docs/plans/authelia-sso.md.
  auth:        { backend: "{{ hostvars[infra_host].ansible_host }}:9092", group: Infra, icon: authelia }

# Services placed behind the Authelia login. ONE list, consumed by both of the
# vhost loops in roles/svc_media/templates/Caddyfile.j2 — the download catalog
# and caddy_services render separately, and putting an `sso: true` field on
# each catalog instead would mean two schemas and two validators for one
# decision.
#
# Adding a name here is the only step needed to protect a service. Emptying
# the list and re-running `make access` is the rollback, and it takes seconds:
# Caddy is validated at render time, so a malformed directive fails the deploy
# rather than taking the proxy down.
#
# `auth` must NEVER appear here — Authelia cannot be the thing standing in
# front of Authelia, and the result is an infinite redirect rather than an
# error. tests/validate_infra_catalog.py fails the build if it does, and every
# name here is also checked to actually exist in one of the two catalogs: a
# typo would otherwise leave a service unprotected while looking configured,
# which is the dangerous direction to fail in.
#
# Deliberately NOT protected — a native or mobile client cannot follow a
# browser redirect to a login form, so proxy auth breaks them outright:
# jellyfin, immich, nextcloud, abs, ntfy, vaultwarden. Also left open: home
# (the landing page), it-tools, glances (its /mcp/sse endpoint has no cookie
# jar), bambuddy, the cockpit-* vhosts (own PAM auth), and shelfmark.
#
# calibre-web is excluded for a different reason and it is not a good one: it
# is loopback-only on svc-media, so unlike every name below it has no direct
# IP:port escape hatch if forward-auth misbehaves. Its default admin/admin123
# is still live and still a manual first-login fix — see
# docs/automation-opportunities.md.
#
# Machine-to-machine traffic is unaffected: every such path in this estate
# already bypasses Caddy entirely (ntfy publishers, Beszel agents, Prometheus
# scraping, Grafana's datasource, Recyclarr, and the arr apps talking to each
# other all use IP:port or jail-localhost).
sso_protected_services:
  # svc-download catalog — these seven set
  # AuthenticationRequired=DisabledForLocalAddresses, and Caddy proxies from a
  # LAN address, so they never prompt underneath. One login, not two.
  - sonarr
  - radarr
  - prowlarr
  - sabnzbd
  - bazarr
  - lazylibrarian
  - jdownloader
  # Effectively remote shells. Both keep their own password underneath, so
  # these are the two services that will ask twice — that is the correct trade
  # in front of a shell, and their local login is also what protects them if
  # Caddy is bypassed. Do not remove it to smooth out the double prompt.
  - code-server
  - webtop
  # Unauthenticated today, which is the whole reason this exists. Syncthing's
  # GUI has been an open item for exactly this; Prometheus has no auth at all.
  - syncthing
  - prometheus
