---
# Inference model roster, by host tier.
#
# This file is the catalog; docs/gpu-capacity.md is the measurement report
# generated by scripts/vram_survey.py + scripts/vram_report.py. Do not hand-edit
# measured_mib — take it from a survey run and record the date it was taken.
#
# measured_mib is WHOLE-CARD nvidia-smi usage at that model's num_ctx, so it
# includes the idle baseline (~2.0-2.3 GiB). It is the figure an operator sees
# on the card, not the model's own footprint. gpu-capacity.md carries each
# pass's baseline and is the place the baseline-adjusted comparison lives.
#
# All figures below are from the q8_0 pass of 2026-08-12, because q8_0 is what
# the host now runs — see the KV cache section of docs/gpu-host.md. Numbers
# taken under f16 do not describe this host any more.
#
# `abliterated: false` REQUIRES `alignment_exception` saying why, because every
# chat model here is abliterated on purpose and an un-abliterated one is either
# a decision or a mistake. tests/validate_model_roster.py enforces that, and
# also cross-checks that every abliterated terra model appears in
# scripts/abliteration_control.py's ROSTER.
#
# tier: terra = the RTX 4090 desktop, on-demand, one model at a time.
#       mbp   = the M1 Pro laptop, always-on, small models. NOT YET PROVISIONED.
model_roster:
  - name: huihui_ai/gemma-4-abliterated:26b
    tier: terra
    role: chat
    default: true
    abliterated: true
    measured_mib: 20716
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Warmest prose in the roster, which is why it carries the Thera and
      Unfiltered personas.

  - name: huihui_ai/Qwen3.6-abliterated:27b
    tier: terra
    role: chat
    abliterated: true
    measured_mib: 20222
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Technical and agentic work.

  - name: davidau-fable-fusion:27b-q4km
    tier: terra
    role: chat
    abliterated: true
    measured_mib: 20678
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Creative writing and roleplay. Registered from a local blob because the
      upstream pull fails on a 30s deadline - see docs/gpu-host.md.

  - name: huihui_ai/gemma-4-abliterated:31b
    tier: terra
    role: chat
    abliterated: true
    measured_mib: 23763
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Dense variant, stronger reasoning. It was capped at 16384 for months
      because the KV cache - not the weights - pushed it to CPU spill at 32768.
      The 2026-08-12 survey lifted that: under q8_0 it measures 100% GPU at the
      full 32768. Re-cap it to 16384 if the host ever goes back to f16.

  - name: muse-glimmer:30b
    tier: terra
    role: vision
    abliterated: false
    alignment_exception: >-
      Stock Meta weights, deliberately aligned - and unlike the other
      exceptions here that is a measured fact, not an assumption. It REFUSED
      scripts/abliteration_control.py's control prompt on 2026-08-12, which
      makes it a second aligned baseline alongside qwen3:30b rather than a
      single point of failure for that control.
    measured_mib: 20233
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      The only model on this host that can see. Meta Muse Glimmer, 27.9B at
      Q4_K_M, Apache-2.0, with a 1.8B perception encoder giving native image
      understanding - verified by reading known text off
      tests/fixtures/vision-probe.png, not by trusting the model card. Also
      the agentic/tool-calling pick, and the lightest of the large models at
      32768. NEEDS OLLAMA >= 0.32.9; 0.32.6 refuses the pull outright. It is a
      reasoning model, so a small num_predict spends the whole budget in the
      `thinking` field and returns an empty `response` - budget ~1200.

  - name: qwen3-coder:30b
    tier: terra
    role: code
    abliterated: false
    alignment_exception: >-
      Coding models rarely refuse, so abliteration buys almost nothing while
      costing measurable quality. Deliberately stock weights.
    measured_mib: 21575
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Continue's chat/edit/apply model.

  - name: qwen3:30b
    tier: terra
    role: baseline
    abliterated: false
    alignment_exception: >-
      Deliberately aligned. It is the only aligned model left on the host and
      therefore the only thing that can calibrate the abliteration control -
      every other chat model answers everything by design.
    measured_mib: 21585
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Positive control baseline for scripts/abliteration_control.py.

  - name: qwen2.5-coder:1.5b-base
    tier: terra
    role: autocomplete
    abliterated: false
    alignment_exception: >-
      A base completion model, not an instruct model. Refusal behaviour does not
      apply to it.
    measured_mib: 3893
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Continue's autocomplete.

  - name: nomic-embed-text
    tier: terra
    role: embed
    measured_mib: 2603
    measured_on: "2026-08-12"
    abliterated: false
    alignment_exception: >-
      An embedding model. It does not generate text, so there is nothing to
      abliterate.
    why: >-
      Continue's embeddings. Moves to the mbp tier once that host exists, since
      RAG embedding must not depend on a desktop that gets gamed on. Its
      measured_mib is almost entirely idle baseline - the model itself is
      ~0.3 GB - which is why gpu-capacity.md marks its quantized readings
      UNKNOWN rather than claiming a saving.
