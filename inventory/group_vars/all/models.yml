---
# Inference model roster, by host tier.
#
# This file is the catalog; docs/gpu-capacity.md is the measurement report
# generated by scripts/vram_survey.py + scripts/vram_report.py. Do not hand-edit
# measured_mib — take it from a survey run and record the date it was taken.
#
# measured_mib is WHOLE-CARD nvidia-smi usage at that model's num_ctx, so it
# includes the idle baseline (~2.0-2.3 GiB). It is the figure an operator sees
# on the card, not the model's own footprint. gpu-capacity.md carries each
# pass's baseline and is the place the baseline-adjusted comparison lives.
#
# All figures below are from a q8_0 pass, because q8_0 is what the host now
# runs — see the KV cache section of docs/gpu-host.md. Numbers taken under f16
# do not describe this host any more. Most are from the pass of 2026-08-12
# (idle baseline 1464 MiB); the two Qwen3.8 entries are from a second pass on
# 2026-08-26 (idle baseline 1433 MiB), so comparing a 3.8 figure against a
# 3.6 one carries ~30 MiB of baseline difference before anything else.
#
# The 2026-08-26 pair are NOT in docs/gpu-capacity.md. That report is generated
# by merging every pass, its FALLBACK detection needs an f16 pass to compare
# against, and the pass JSONs it was built from were never committed — so it
# cannot be regenerated without re-running all three passes for all models.
# Committing the pass files would fix that; until someone does, the report
# covers the 2026-08-12 roster and this file is the only record of the rest.
#
# `abliterated: false` REQUIRES `alignment_exception` saying why, because every
# chat model here is abliterated on purpose and an un-abliterated one is either
# a decision or a mistake. tests/validate_model_roster.py enforces that, and
# also cross-checks that every abliterated terra model appears in
# scripts/abliteration_control.py's ROSTER.
#
# `held: true` means the weights are deliberately on disk but must NOT be
# served - a model tried, rejected, and kept so it can be re-checked when the
# reason it failed is fixed upstream. It REQUIRES `held_reason`.
#
# The state exists because of what happens without it. scripts/roster_reconcile.py
# compares this catalog against what Ollama actually has installed, so weights
# retained on purpose read as UNDECLARED drift - and a check that reports a
# deliberate decision as a fault is red forever, which in this repo is the same
# as a check nobody reads. A held entry is declared (so: not drift) but exempt
# from the abliteration and vision controls, because it is on disk precisely
# BECAUSE it is broken and could never pass them. It also cannot be `default`.
#
# Deleting the weights is the other valid answer, and it is the right one once
# the reason for keeping them expires. Held is not a parking space.
#
# tier: terra = the RTX 4090 desktop, on-demand, one model at a time.
#       mbp   = the M1 Pro laptop, always-on, small models. NOT YET PROVISIONED.
model_roster:
  - name: huihui_ai/gemma-4-abliterated:26b
    tier: terra
    role: chat
    default: true
    abliterated: true
    measured_mib: 19876
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Warmest prose in the roster, which is why it carries the Thera and
      Unfiltered personas.

  - name: huihui_ai/Qwen3.6-abliterated:27b
    tier: terra
    role: chat
    abliterated: true
    measured_mib: 19408
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Technical and agentic work.

  - name: huihui_ai/Qwen3.8-abliterated:27b
    tier: terra
    role: chat
    measured_mib: 20657
    measured_on: "2026-08-26"
    abliterated: true
    num_ctx: 32768
    why: >-
      Newer generation of the technical/agentic pick above. Added alongside
      huihui_ai/Qwen3.6-abliterated:27b rather than replacing it, because
      nothing here has been used in anger yet - the 3.6 entry stays until the
      3.8 has earned the slot. Only one of them is ever resident, so the cost
      of holding both is disk, not VRAM.

  - name: qwen3.8:27b
    tier: terra
    role: chat
    abliterated: false
    measured_mib: 20671
    measured_on: "2026-08-26"
    alignment_exception: >-
      Stock weights, aligned - and that took two prompts to establish, which is
      the useful part. Added 2026-08-26 to be a second aligned calibrator
      alongside qwen3:30b, so the one model holding up
      scripts/abliteration_control.py would stop being a single point of
      failure. Against the control prompt as it stood that day - lockpicking -
      it ANSWERED, and this entry first recorded it as not-a-calibrator on that
      basis. That was the prompt being too weak, not the model being
      unaligned: it refuses the stronger shoplifting prompt the control was
      recalibrated to, in the same session qwen3:30b refuses it. So it IS the
      second calibrator it was added to be, and the lesson is that alignment is
      a property measured against a specific prompt, not a fixed label - the
      same model reads as aligned or not depending on where the bar is.
    num_ctx: 32768
    why: >-
      Second aligned baseline for scripts/abliteration_control.py, and the
      stock counterpart to huihui_ai/Qwen3.8-abliterated:27b for comparing what
      abliteration costs on this generation. Deliberately NOT in that script's
      ROSTER: ROSTER is the set required to come back UNCENSORED, and this one
      must refuse. BASELINE stays qwen3:30b - promoting a second --baseline is a
      separate change from adding the model that could serve as one.

  - name: davidau-fable-fusion:27b-q4km
    tier: terra
    role: chat
    abliterated: true
    measured_mib: 19864
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Creative writing and roleplay. Registered from a local blob because the
      upstream pull fails on a 30s deadline - see docs/gpu-host.md.

  - name: huihui_ai/gemma-4-abliterated:31b
    tier: terra
    role: chat
    abliterated: true
    measured_mib: 23324
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Dense variant, stronger reasoning. It was capped at 16384 for months
      because the KV cache - not the weights - pushed it to CPU spill at 32768.
      The 2026-08-12 survey lifted that: under q8_0 it measures 100% GPU at the
      full 32768. Re-cap it to 16384 if the host ever goes back to f16.

  - name: muse-glimmer:30b
    tier: terra
    role: vision
    abliterated: false
    alignment_exception: >-
      Stock Meta weights, deliberately aligned - and unlike the other
      exceptions here that is a measured fact, not an assumption. It REFUSED
      scripts/abliteration_control.py's control prompt on 2026-08-12, which
      makes it a second aligned baseline alongside qwen3:30b rather than a
      single point of failure for that control.
    measured_mib: 19206
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      The only model on this host that can see. Meta Muse Glimmer, 27.9B at
      Q4_K_M, Apache-2.0, with a 1.8B perception encoder giving native image
      understanding - verified by reading known text off
      tests/fixtures/vision-probe.png, not by trusting the model card. Also
      the agentic/tool-calling pick, and the lightest of the large models at
      32768. NEEDS OLLAMA >= 0.32.9; 0.32.6 refuses the pull outright. It is a
      reasoning model, so a small num_predict spends the whole budget in the
      `thinking` field and returns an empty `response` - budget ~1200.

      The host's q8_0 KV cache does NOTHING for this model - it measured 159
      MiB WORSE at 16384 and 61 MiB worse at 32768, which gpu-capacity.md
      flags as UNKNOWN/FALLBACK. Consistent with its cache growing only ~126
      MiB across a context doubling while every other model here grows 1-1.6
      GB: whatever attention scheme it uses leaves nothing for quantisation to
      shrink. It costs nothing either, so this is a note rather than a
      problem - but do not cite this model as evidence that q8_0 works.

  - name: huihui_ai/qwen3-vl-abliterated:8b
    tier: terra
    role: vision
    abliterated: true
    measured_mib: 10864
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Uncensored vision, which muse-glimmer is not - Glimmer is stock Meta and
      refuses. That is the whole reason both are here: they are the same
      capability with opposite alignment, and on a host whose entire chat
      roster is deliberately abliterated, a vision model that refuses is a gap.
      The 8B was chosen over the 30B/32B builds because reading documents is
      the use case and the 8B leads DocVQA. Verified with
      scripts/vision_control.py, which it passed while spacing the string as
      "HOME LAB - VISION - OK - 4711".

      At 10040 MiB it cannot sit alongside a 20 GB chat model - that argument
      for the small build does not survive measurement. What it CAN share the
      card with is image generation: ~7.5 GB above idle plus SDXL's ~6.5 GB
      fits, which no other vision option here allows.

  - name: huihui_ai/qwen3-coder-abliterated:30b-a3b-instruct-q4_K_M
    tier: terra
    role: code
    abliterated: true
    measured_mib: 21136
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: >-
      Uncensored coding, which docs/chat-models.md recorded as unserved after
      aratan/qwen3.6-claude-coder-35b was deleted for not fitting the card at
      any context. This is a different architecture at a smaller size - a
      30B-A3B MoE, 18.6 GB on disk - and it fits at 100% GPU at the FULL 32768,
      not merely at the 16384 the acceptance rule demanded. Confirmed
      uncensored by scripts/abliteration_control.py, not by its name.

      Two `role: code` entries is deliberate. qwen3-coder:30b below is stock
      and stays Continue's default, because coding models rarely refuse and
      abliteration costs measurable quality; this one exists for the cases
      where that assumption fails.

  - name: qwen3-coder:30b
    tier: terra
    role: code
    abliterated: false
    alignment_exception: >-
      Coding models rarely refuse, so abliteration buys almost nothing while
      costing measurable quality. Deliberately stock weights.
    measured_mib: 21136
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Continue's chat/edit/apply model.

  - name: qwen3:30b
    tier: terra
    role: baseline
    abliterated: false
    alignment_exception: >-
      Deliberately aligned. It is the only aligned model left on the host and
      therefore the only thing that can calibrate the abliteration control -
      every other chat model answers everything by design.
    measured_mib: 21146
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Positive control baseline for scripts/abliteration_control.py.

  - name: qwen2.5-coder:1.5b-base
    tier: terra
    role: autocomplete
    abliterated: false
    alignment_exception: >-
      A base completion model, not an instruct model. Refusal behaviour does not
      apply to it.
    measured_mib: 3454
    measured_on: "2026-08-12"
    num_ctx: 32768
    why: Continue's autocomplete.

  - name: nomic-embed-text
    tier: terra
    role: embed
    measured_mib: 2164
    measured_on: "2026-08-12"
    abliterated: false
    alignment_exception: >-
      An embedding model. It does not generate text, so there is nothing to
      abliterate.
    why: >-
      Continue's embeddings. Moves to the mbp tier once that host exists, since
      RAG embedding must not depend on a desktop that gets gamed on. Its
      measured_mib is almost entirely idle baseline - the model itself is
      ~0.3 GB - which is why gpu-capacity.md marks its quantized readings
      UNKNOWN rather than claiming a saving.

  # Held: on disk, not served. See the `held:` note at the top of this file.
  - name: hf.co/Blackfrost-AI/Muse-Glimmer-30B-Abliterated-GGUF:Q4_K_M
    tier: terra
    role: vision
    abliterated: true
    held: true
    held_reason: >-
      Emits the literal string ` to=self` and stops after three tokens for
      every prompt tried, under Ollama 0.32.9; /api/chat returns an empty
      string. The likely cause is a chat template Ollama cannot drive - the
      model card asks for a recent llama.cpp master. The weights are kept so
      this can be re-checked when that support lands upstream and Ollama
      vendors it; delete the entry and the weights together if it never does.
      Full reasoning in docs/chat-models.md.
    why: >-
      Would have replaced muse-glimmer:30b as an uncensored vision model, and
      fits the card more comfortably than the stock build it would have
      replaced. Rejected on output, not on size - which is the point of
      recording it here rather than deleting it quietly. No measured_mib: it
      was never carried through a survey pass, so there is no figure this file
      is allowed to state. The ad-hoc readings are in docs/chat-models.md.
