---
# Bumping any digest in this file follows the BUMP PROCEDURE at the top of
# inventory/group_vars/all/apps.yml — resolve with `make image-digest`, record
# the replaced digest in a `# was` comment, deploy one VM at a time.
# Infra-stack source of truth (v6, svc-infra). Mirrors download_apps
# (inventory/group_vars/all/apps.yml): every generic-quadlet consumer
# (Quadlet render, service start/verify, nightly backup) derives from this
# catalog — a new single-container service is a catalog entry, not new role
# code. Multi-container services (a database or cache sidecar) get a bespoke
# per-service quadlet template instead (see roles/svc_media/templates/
# romm.container.j2 + romm-db.container.j2 for that pattern) and are NOT
# listed here — only genuinely single-container apps use the generic
# infra-app.container.j2 template driven by this dict.
#
# Per-entry fields consumed by roles/svc_infra:
#   image         immutable pinned reference (tag or @sha256 digest — never
#                 :latest, matching download_apps/media_images convention)
#   ui_port       host-side TCP port; the generic quadlet publishes it on
#                 svc-infra's LAN IP, not loopback — Caddy runs on
#                 {{ media_host }}, a different host (added to
#                 caddy_services per service to reach it)
#   container_port  optional; the image's internal port if it differs from
#                 ui_port (defaults to ui_port; ignored when network_mode: host)
#   network_mode  optional; set to "host" for a service that needs the real
#                 host network namespace (e.g. Syncthing's LAN peer
#                 discovery breaks inside container-NAT'd networking) —
#                 skips PublishPort entirely, every port just IS a host
#                 port. Otherwise omit for normal per-port publishing.
#   extra_ports   optional list of {port, protocol} opened via firewalld
#                 (and, unless network_mode: host, also published)
#                 alongside ui_port — for services with a non-HTTP protocol
#                 port (e.g. Syncthing's sync/discovery ports). NOT reached
#                 through Caddy, only opened to lan_cidr directly.
#   volumes       list of Quadlet Volume= lines (bind mounts under
#                 /opt/homelab/appdata/<name>, owned by svc_uid/svc_gid)
#   env           optional dict of Environment= key/value pairs
#   backup_paths  appdata subdirectory names (relative to
#                 /opt/homelab/appdata) included in the nightly backup tar
infra_apps:
  uptime-kuma:
    # tag: 1
    # was 2026-08-03: sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
    image: "docker.io/louislam/uptime-kuma@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9"
    ui_port: 3001
    volumes:
      - /opt/homelab/appdata/uptime-kuma/data:/app/data:Z
    backup_paths: [uptime-kuma]

  syncthing:
    image: "docker.io/syncthing/syncthing@sha256:4464f4161dd0251e20d46bb3aec83363db75d80cef1abdd5d5fd4054b04a004d"
    ui_port: 8384
    network_mode: host
    volumes:
      - /opt/homelab/appdata/syncthing:/var/syncthing:Z
    env:
      # Rootless podman maps container-internal UID 0 directly to the
      # invoking host user (homelab) — the same trick as seerr.container.j2's
      # User=0 fix. Any NON-zero PUID/PGID (e.g. svc_uid) instead goes through
      # the subuid range, so files land owned by an opaque high host UID that
      # svc_uid/svc_gid-based backup/read tasks can't touch. Force root.
      PUID: "0"
      PGID: "0"
    extra_ports:
      - { port: 22000, protocol: tcp }
      - { port: 22000, protocol: udp }
      - { port: 21027, protocol: udp }
    backup_paths: [syncthing]

  # Beszel monitoring hub. Agents (one per VM, including this one) are
  # bespoke quadlets, not catalog entries — see roles/*/templates/
  # beszel-agent.container.j2 in svc_infra/svc_media/svc_download. The hub
  # itself needs no manual setup to deploy; the *agents* need a one-time
  # universal token + public key from the hub's own UI (see
  # docs/services.md "Beszel monitoring setup") before they'll start.
  beszel-hub:
    image: "docker.io/henrygd/beszel@sha256:a849ad80814b6a1a3be665304dcace5d4854b3bed7bde4dd1227e8ce1b82d477"
    ui_port: 8090
    volumes:
      - /opt/homelab/appdata/beszel-hub/data:/beszel_data:Z
    env:
      APP_URL: "https://beszel.{{ service_domain }}"
    backup_paths: [beszel-hub]

  # Bambu Lab printer management. Host networking is required by its
  # "virtual printer" SSDP/MQTT/RTSP emulation feature (a wide, non-HTTP
  # port set); THIS deploy only opens the web UI (ui_port) — the virtual
  # printer feature's extra ports (3000/3002/8883/990/6000/322/2024-2026/
  # 50000-50029) are deliberately NOT wired up (a large firewalld surface
  # for a feature most setups won't use for real printers on the LAN;
  # revisit if you actually want SSDP-discoverable virtual printers).
  bambuddy:
    image: "ghcr.io/maziggy/bambuddy@sha256:d68ab4746f18c51a6e22f5cd536533a4ae3c1eb48f4eecccbb68c2be23d0ef52"
    # 8000 is already Paperless-ngx's port on this host; with host networking
    # every catalog app on svc-infra shares one port namespace, so Bambuddy's
    # own PORT env var is moved to 8001 to avoid the collision.
    ui_port: 8001
    network_mode: host
    volumes:
      - /opt/homelab/appdata/bambuddy/data:/app/data:Z
      - /opt/homelab/appdata/bambuddy/logs:/app/logs:Z
    env:
      # See the Syncthing entry above for why PUID/PGID must be 0, not
      # svc_uid, under rootless podman.
      PUID: "0"
      PGID: "0"
      PORT: "8001"
    backup_paths: [bambuddy]

  # Home Assistant. Host networking, because auto-discovery of LAN devices is
  # the whole point of the thing and container-NAT'd networking cannot do it —
  # same reason as Syncthing above. Integrations added by IP worked without
  # this; zeroconf ones did not.
  #
  # Confirmed, not assumed: after this landed HA discovered ten Google Cast
  # devices and Thread with source=zeroconf in .storage/core.config_entries.
  # SSDP is still UNTESTED — no UPnP device has appeared on this LAN — so 1900
  # is opened on the same reasoning as 5353, not on evidence.
  #
  # To re-test discovery later, COUNT source=zeroconf/dhcp entries in
  # .storage/core.config_entries. Do not hand-roll an mDNS probe: one written
  # here queried _services._dns-sd._udp.local (the optional meta-query Google
  # hardware ignores) from an ephemeral port, so it missed every responder that
  # answers to the 224.0.0.251:5353 group HA itself holds. It reported one
  # responder on a LAN of twenty and nearly bought a needless bridge-mcsnoop
  # change on the hypervisor. HA's own record is the positive control; a
  # hand-rolled probe returns "none found" when it means "could not look".
  #
  # extra_ports is NOT optional here, and this is the part that is easy to get
  # wrong: host networking alone does not make discovery work. firewalld's
  # conntrack lets the unicast reply to an outbound query back in, but mDNS
  # responses and SSDP NOTIFY announcements arrive as *multicast* (to
  # 224.0.0.251:5353 and 239.255.255.250:1900) and are dropped without a rule
  # of their own. files.yml turns extra_ports into lan_cidr-scoped rich rules.
  #
  # Host networking also means every catalog app on svc-infra shares ONE port
  # namespace (see Bambuddy above, which had to move off 8000 for Paperless).
  # 8123 is claimed by nothing else here; validate_infra_catalog's claim_port
  # keeps it that way.
  #
  # Two errors are logged at every start. Both are expected, neither is a
  # regression to chase, and the second one does NOT mean what it says:
  #   habluetooth     "Missing NET_ADMIN/NET_RAW capabilities"
  #   aiodhcpwatcher  "Cannot watch for dhcp packets: Operation not permitted"
  # Both want raw-socket capabilities a ROOTLESS container sharing the host
  # netns cannot hold, and the only fix would be running this one rootful.
  #
  # But DHCP discovery still WORKS. Only the passive packet sniffer is dead;
  # HA's dhcp integration falls back to ARP scanning (aiodiscover), which needs
  # no capability, and that fallback is what found the TP-Link KP115. So do not
  # read the aiodhcpwatcher line as "DHCP discovery is unavailable" — it is one
  # of two mechanisms, and the surviving one is sufficient.
  #
  # Bluetooth genuinely is unavailable, and there is no adapter on a VM anyway.
  #
  # The image runs as container-root by default, which under rootless podman
  # maps to the host homelab user, so /config stays writable and
  # backup-readable without a PUID/PGID override.
  home-assistant:
    image: "ghcr.io/home-assistant/home-assistant@sha256:6937c6c51d2f5d6aa66d97e4a68f845bcccd5f9b62cd91992bd6d79b20fe2b3c"
    ui_port: 8123
    network_mode: host
    extra_ports:
      - { port: 5353, protocol: udp }
      - { port: 1900, protocol: udp }
    volumes:
      - /opt/homelab/appdata/home-assistant:/config:Z
    backup_paths: [home-assistant]

  # IT Tools (https://it-tools.tech/) — a static/stateless collection of
  # developer utilities (JSON/base64/regex/hash tools etc). No volumes, no
  # env, no backup: nothing it renders is ever persisted server-side.
  it-tools:
    # tag: latest
    image: "ghcr.io/corentinth/it-tools@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f"
    ui_port: 8082
    container_port: 80
    volumes: []
    backup_paths: []

  # Prometheus — scrapes the node_exporter on all three VMs (+ itself) and
  # is Grafana's datasource. No secret, so a plain catalog entry; its scrape
  # config is rendered separately (prometheus.yml.j2 → the /etc/prometheus
  # bind) by a supplementary task in files.yml, since the generic template
  # only handles env, not a config file. Published on host 9091 (→ container
  # 9090) because 9090 is Cockpit on this host. user: "0" so the TSDB under
  # /prometheus lands homelab-owned (the image runs as uid 65534/nobody,
  # which rootless podman maps to an unwritable subuid). The TSDB is
  # regenerable scrape data, so it is NOT in the backup set.
  prometheus:
    image: "docker.io/prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893"
    ui_port: 9091
    container_port: 9090
    user: "0"
    volumes:
      - /opt/homelab/appdata/prometheus/etc:/etc/prometheus:Z
      - /opt/homelab/appdata/prometheus/data:/prometheus:Z
    backup_paths: []

  # Glances — host monitoring, web UI/REST API, and (per the LLM-TODO-LIST
  # ask "configured such that tools like yourself can connect to it") its
  # built-in MCP server: http://<svc-infra-ip>:61208/mcp/sse (see
  # caddy_services.glances in main.yml for why that needs a Caddy
  # host_header rewrite).
  #
  # Deliberately NOT pid_mode: host: CPU/memory/disk come from /proc/stat and
  # /proc/meminfo, which are already host-wide inside any container (they
  # aren't PID-namespace-scoped) — confirmed live. What pid_mode: host would
  # ADD is the full host process list, at a real cost: every rootless
  # container on this VM runs as the same UID (homelab/svc_uid), so sharing
  # the host PID namespace lets ANY process in this container read
  # /proc/<pid>/environ for every sibling container — confirmed live (read
  # NetBox's live DB_PASSWORD from inside glances this way during review).
  # Not worth trading real, standing secret exposure for a process list.
  #
  # Deliberately NOT wired to the Podman API socket either (no container-
  # level stats): tried bind-mounting /run/user/<uid>/podman(.sock) with
  # DOCKER_HOST pointed at it, but the container's mapped UID (confirmed via
  # /proc/<pid>/uid_map: container 0 -> host svc_uid, matching the socket's
  # real owner) still gets a plain EACCES connecting to it — no SELinux
  # denial either (checked with dontaudit disabled) — root cause not
  # resolved. Not worth chasing further: the security review had already
  # flagged that a `:ro` bind mount doesn't limit what RPCs a live socket
  # connection can issue (blast radius on a Glances compromise = control of
  # every container on this host), so dropping it entirely is the right
  # outcome anyway, not just a workaround for the permission issue.
  glances:
    image: "docker.io/nicolargo/glances@sha256:58651aabedf62db8bfc1d252f8d3889675dfcdb5d0ad1c177ae5879c21626f3a"
    ui_port: 61208
    volumes: []
    env:
      GLANCES_OPT: "-w --enable-mcp"
    backup_paths: []

  # Browsable output of the nightly security scan (scan.yml). A static file
  # server and nothing else: no database, no config file, no write path into
  # the mount — the reports are produced by the scan and this only hands them
  # out. Digest resolved 2026-07-30 from the `2` tag:
  #   curl -sI -H "Authorization: Bearer $(ghcr token)" \
  #     https://ghcr.io/v2/static-web-server/static-web-server/manifests/2
  #
  # READ THE EXPOSURE NOTE. This is in sso_protected_services, but that gates
  # the Caddy hostname, NOT the service: firewalld opens every catalog ui_port
  # to lan_cidr, so http://<svc-infra>:8085/ serves these reports to anything
  # on the LAN or the tailnet with no authentication at all. That trade is
  # accepted here for the same reason as the other protected services — the
  # direct path is the way back in when Authelia breaks — but it lands
  # differently for this one, because the content is a complete map of every
  # unpatched CVE and open port in the estate. Recorded as an accepted risk in
  # docs/automation-opportunities.md; the fix, if it is ever revisited, is to
  # scope this port to svc-media's address rather than lan_cidr.
  #
  # user "0": the image runs as a non-root user, which rootless podman maps to
  # an unwritable subuid — and more to the point an unREADABLE one, since the
  # reports are written homelab-owned under a 0700 /opt/homelab.
  # The mount is :ro because nothing here should ever write to it.
  scan-reports:
    # tag: latest
    # was 2026-08-03: sha256:6acea6260b14e08dda986361e42640082fbfaab8d88c327de532bb13a3b22994
    image: "ghcr.io/static-web-server/static-web-server@sha256:2c1a7c3e0feaea5859307403b74e1c575f3ec1499094fc077344173d11abaae2"
    ui_port: 8085
    container_port: 8080
    user: "0"
    volumes:
      - /opt/homelab/appdata/scan-reports:/public:ro
    env:
      SERVER_ROOT: /public
      SERVER_PORT: "8080"
      # Directory listing on: the reports are a handful of files and being able
      # to see state.json beside index.html is the point. There is nothing here
      # that is not already in the report itself.
      SERVER_DIRECTORY_LISTING: "true"
    # Nothing to back up: every file under the mount is regenerated by the next
    # scan, and the run-to-run baseline is deliberately disposable.
    backup_paths: []

# Secret-bearing single-container services. Structurally identical to
# infra_apps (same fields, same infra-app.container.j2 template, same
# firewalld/service-name/backup wiring) with two differences handled in
# roles/svc_infra: (1) their Quadlet is rendered by a no_log/diff:false
# task and written mode 0600, because an `env` value here is a real secret
# (a vault var) and the shared infra_apps render loop is deliberately NOT
# no_log-wrapped (it would blank the diff for every ordinary service too);
# (2) each entry lists the vault var(s) it needs in `require_vault`, which a
# single generic assert checks are non-empty before rendering — the generic
# form of paperless/netbox's per-service "Require the secret key" assert.
# Use this (not a new bespoke template) for any single-container service
# whose only reason for not being a plain infra_apps entry is an embedded
# secret. Multi-container secret services (db/cache sidecar) still get a
# bespoke template — see paperless/netbox/immich.
infra_secret_apps:
  # code-server — VS Code in the browser (Open VSX extension marketplace
  # works out of the box, satisfying the "must support plugins/extensions"
  # requirement). PASSWORD gates the web UI. PUID/PGID=0 so /config lands
  # homelab-owned under rootless podman (same reason as Syncthing/Bambuddy).
  code-server:
    image: "lscr.io/linuxserver/code-server@sha256:691c8e0560a807a4affefbcf7e729716b372d1df7c57e18ed3a263044cf45908"
    ui_port: 8443
    volumes:
      - /opt/homelab/appdata/code-server:/config:Z
    env:
      PUID: "0"
      PGID: "0"
      PASSWORD: "{{ vault_codeserver_password }}"
      DEFAULT_WORKSPACE: /config/workspace
    require_vault: [vault_codeserver_password]
    backup_paths: [code-server]

  # Semaphore UI — web frontend for running Ansible/Terraform/etc (could even
  # drive this very repo; wiring that up is a manual follow-up, not automated
  # here). Embedded SQLite (SEMAPHORE_DB_DIALECT=sqlite — bolt is deprecated
  # and now returns "not supported" upstream), so no database sidecar. The
  # official image bakes USER=1001, which under rootless podman can't write
  # the homelab-owned /var/lib/semaphore + /etc/semaphore binds; it exposes
  # no PUID knob, so force User=0 (→ homelab) via the quadlet instead.
  # SEMAPHORE_ACCESS_KEY_ENCRYPTION (base64 32 bytes) encrypts the secrets
  # Semaphore stores (SSH keys, vault passwords) — must stay stable across
  # restarts or those become unreadable, hence a vault var, not autogenerated
  # per-boot by the image.
  semaphore:
    image: "docker.io/semaphoreui/semaphore@sha256:6454b2e58a6616de82240f7b4f271663fe0ec3430e10a9cc7e763ff6df12baa0"
    ui_port: 3000
    user: "0"
    volumes:
      - /opt/homelab/appdata/semaphore/lib:/var/lib/semaphore:Z
      - /opt/homelab/appdata/semaphore/etc:/etc/semaphore:Z
    env:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: "admin@{{ service_domain }}"
      SEMAPHORE_ADMIN_PASSWORD: "{{ vault_semaphore_admin_password }}"
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: "{{ vault_semaphore_access_key_encryption }}"
    require_vault:
      - vault_semaphore_admin_password
      - vault_semaphore_access_key_encryption
    backup_paths: [semaphore]

  # Webtop — a full XFCE Linux desktop in the browser (LinuxServer/KasmVNC).
  # CUSTOM_USER + PASSWORD gate the web UI with HTTP basic auth. Published on
  # its HTTP port 3000 (container) → host 3003 (3000 is Semaphore, 3001 is
  # Uptime Kuma); Caddy terminates TLS in front, so the browser still gets
  # HTTPS (KasmVNC needs a secure context for clipboard etc). PUID/PGID=0 →
  # /config lands homelab-owned (Syncthing/Bambuddy pattern). shm_size: 1g
  # per LSIO's desktop guidance (the 64M default crashes GUI apps).
  #
  # LSIO's "privileged access to the host / passwordless sudo in the terminal"
  # warning is written for ROOTFUL docker, where container-root == host-root.
  # Here it's rootless podman: container-root maps to the unprivileged homelab
  # uid, no --privileged, no seccomp=unconfined — the desktop's "root" is
  # contained to homelab exactly like code-server's terminal already is, and
  # it's LAN-only + password-gated. Same accepted trust model, no host escape.
  webtop:
    image: "lscr.io/linuxserver/webtop@sha256:2caa5d4e469994bcc1fe969587a7016d837bc4c0c5ebf559699c9cabb4cbc5ee"
    ui_port: 3003
    container_port: 3000
    shm_size: 1g
    volumes:
      - /opt/homelab/appdata/webtop:/config:Z
    env:
      PUID: "0"
      PGID: "0"
      CUSTOM_USER: admin
      PASSWORD: "{{ vault_webtop_password }}"
    require_vault: [vault_webtop_password]
    backup_paths: [webtop]

  # Grafana — dashboards over the Prometheus datasource (wired automatically
  # via a provisioning YAML rendered into /etc/grafana/provisioning by a
  # supplementary task in files.yml, so Prometheus is a datasource on first
  # boot, not a manual click). GF_SECURITY_ADMIN_PASSWORD gates the admin
  # login. Published on host 3005 (→ container 3000; 3000 is Semaphore).
  # user: "0" so /var/lib/grafana lands homelab-owned (the image runs as
  # uid 472). GF_SERVER_ROOT_URL points at the Caddy hostname so Grafana's
  # generated links/redirects use it.
  grafana:
    image: "docker.io/grafana/grafana@sha256:1c1bd67c54c5fcf6e759897852b5a584191bd6796e8d328a5ace457799801261"
    ui_port: 3005
    container_port: 3000
    user: "0"
    volumes:
      - /opt/homelab/appdata/grafana/data:/var/lib/grafana:Z
      - /opt/homelab/appdata/grafana/provisioning:/etc/grafana/provisioning:Z
    env:
      GF_SECURITY_ADMIN_PASSWORD: "{{ vault_grafana_admin_password }}"
      GF_SERVER_ROOT_URL: "https://grafana.{{ service_domain }}"
    require_vault: [vault_grafana_admin_password]
    backup_paths: [grafana]

  # Vaultwarden — self-hosted Bitwarden-compatible password manager. The
  # upstream alpine image sets no USER (runs as container-root), which
  # rootless podman maps straight to the host homelab user — same reason
  # home-assistant needs no `user:` override, unlike code-server/webtop's
  # PUID/PGID dance. DOMAIN is required: WebAuthn/2FA challenges and
  # password-reset/invite email links are bound to it and silently break
  # without it. WebSocket live-sync (/notifications/hub) has shipped on the
  # SAME port as the web UI since v1.29 (the old WEBSOCKET_PORT 3012 was
  # removed in v1.31) and Caddy's reverse_proxy passes Upgrade/Connection
  # through automatically — no extra Caddyfile.j2 handling needed, unlike
  # nginx.
  #
  # ADMIN_TOKEN is an Argon2id PHC hash, not a plaintext token: Vaultwarden
  # accepts either, but the hash form works fine set non-interactively via
  # Environment= (no TTY needed), and it means the rendered Quadlet — 0600,
  # but unencrypted on disk, unlike vault.yml itself — only ever exposes a
  # salted hash instead of the real admin password. Generate it with
  # `podman run --rm -it docker.io/vaultwarden/server@sha256:88b74551f5d79fd
  # 43f897c23bd74d5295a6e1fafb5d1ec23a1da92e7a0f06767 /vaultwarden hash` (or
  # the `argon2` CLI) — vault_vaultwarden_admin_token holds that PHC STRING,
  # not the plaintext; record the plaintext you typed in separately (it
  # cannot be recovered from the hash) to log in to /admin.
  #
  # SIGNUPS_ALLOWED is false permanently — it never needs flipping. This is
  # reachable to the whole LAN, and unlike the other infra_secret_apps there
  # is no bootstrap-admin-via-env-var, but admin INVITES bypass this setting:
  # per upstream, "the vaultwarden admin can invite anyone via the admin
  # page, regardless of any of the restrictions above."
  #
  # FIRST RUN (one deploy, no config round-trip, no window where the LAN can
  # self-register on a password manager):
  #   1. https://vaultwarden.{{ service_domain }}/admin — log in with the
  #      PLAINTEXT admin token (the vault holds only its Argon2 hash).
  #   2. Invite your own email address there.
  #   3. SMTP is not configured, so no mail is sent and no link is shown;
  #      instead browse to https://vaultwarden.{{ service_domain }}/#/signup
  #      and register using that exact invited address. Upstream documents
  #      this as the mail-disabled path, and it works with signups off.
  vaultwarden:
    image: "docker.io/vaultwarden/server@sha256:88b74551f5d79fd43f897c23bd74d5295a6e1fafb5d1ec23a1da92e7a0f06767"
    ui_port: 8222
    container_port: 80
    volumes:
      - /opt/homelab/appdata/vaultwarden/data:/data:Z
    env:
      DOMAIN: "https://vaultwarden.{{ service_domain }}"
      ADMIN_TOKEN: "{{ vault_vaultwarden_admin_token }}"
      SIGNUPS_ALLOWED: "false"
    require_vault: [vault_vaultwarden_admin_token]
    backup_paths: [vaultwarden]

  # Mealie — recipe manager. Lives here rather than in infra_apps purely
  # because it now carries a vault value; tests/validate_infra_catalog.py
  # enforces that split, since the plain catalog's render task is not no_log.
  #
  # _DEFAULT_EMAIL/_DEFAULT_PASSWORD seed the FIRST user and are ignored once
  # any user exists. Left unset, Mealie seeds a well-known public default
  # (changeme@example.com / MyPassword) — verified live on 2026-07-25 to be
  # accepting logins on this LAN, which is why these are now set. The
  # underscore prefix is upstream's own naming for internal settings; it is
  # what the app reads, not a typo.
  #
  # Because they only apply when the user table is empty, changing them later
  # does NOT rotate an existing password — do that in the UI.
  #
  # PUID/PGID: Mealie's docker/entry.sh starts as container-root and always
  # gosu-execs down to a PUID/PGID-owned user, defaulting to 911:911 rather
  # than 0 (read from entry.sh in the v3.21.0 image source). Left alone,
  # /app/data lands owned by a subuid the homelab backup tasks cannot read.
  # Forcing 0 is the same fix as Syncthing/Bambuddy/Webtop/code-server.
  #
  # BASE_URL builds absolute links (password-reset, OIDC callback) — point it
  # at the real external hostname, not the image's http://localhost:8080.
  mealie:
    image: "ghcr.io/mealie-recipes/mealie@sha256:4e1e8d98b883009cb849851857e277109c21db1c2d857ae61e14de894f2169ff"
    ui_port: 9925
    container_port: 9000
    volumes:
      - /opt/homelab/appdata/mealie/data:/app/data:Z
    env:
      PUID: "0"
      PGID: "0"
      BASE_URL: "https://mealie.{{ service_domain }}"
      _DEFAULT_EMAIL: "admin@{{ service_domain }}"
      _DEFAULT_PASSWORD: "{{ vault_mealie_admin_password }}"
    require_vault: [vault_mealie_admin_password]
    backup_paths: [mealie]

  # Authelia — the SSO identity provider. Phase 1 deploys the portal ONLY;
  # no Caddy vhost carries forward_auth yet (that is a second branch, so the
  # provider can be proven working before eleven services depend on it).
  # See docs/plans/authelia-sso.md for the full design.
  #
  # Its two config files are NOT rendered by this catalog entry — the generic
  # infra-app.container.j2 only handles env — but by supplementary template
  # tasks in roles/svc_infra/tasks/files.yml, the same split Prometheus and
  # Grafana already use. The container reads /config/configuration.yml (the
  # image bakes X_AUTHELIA_CONFIG to exactly that path, so the filename is
  # not ours to choose) and, per that config, /config/users.yml.
  #
  # ui_port 9092 → container 9091: Authelia's own default 9091 is already
  # Prometheus on this host.
  #
  # No PUID/PGID or user: override, unlike most entries here. The image sets
  # no USER and already defaults PUID=0/PGID=0 (confirmed from the image
  # config), so it runs as container-root, which rootless podman maps to the
  # host homelab user — /config lands writable and backup-readable with no
  # intervention. Authelia rewrites users.yml itself on a password change,
  # which is precisely why that ownership has to be right.
  #
  # All three secrets go through env DELIBERATELY, rather than into the
  # config file. That keeps authelia-configuration.yml.j2 free of any vault_
  # reference, so it renders as an ordinary readable 0644 template with a
  # real diff; only the users file, which carries the password hash, needs
  # the 0600 + no_log treatment. Rotating the storage encryption key or the
  # session secret invalidates the SQLite store / every live session
  # respectively — set them once and leave them.
  authelia:
    image: "ghcr.io/authelia/authelia@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b"
    ui_port: 9092
    container_port: 9091
    volumes:
      - /opt/homelab/appdata/authelia:/config:Z
    env:
      AUTHELIA_SESSION_SECRET: "{{ vault_authelia_session_secret }}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "{{ vault_authelia_storage_encryption_key }}"
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "{{ vault_authelia_jwt_secret }}"
    require_vault:
      - vault_authelia_session_secret
      - vault_authelia_storage_encryption_key
      - vault_authelia_jwt_secret
    backup_paths: [authelia]

  # Open WebUI — the chat and image-generation front end. It holds no models
  # itself; all inference happens on the Windows 11 / RTX 4090 box at
  # gpu_host_ip (see docs/gpu-host.md), which is why this is a plain
  # single-container entry with no GPU plumbing on svc-infra at all.
  #
  # The image sets USER 0:0 and never drops privileges, so it lands on the
  # host homelab user under rootless podman with no PUID/user override — the
  # comfortable case for once.
  #
  # ENABLE_PERSISTENT_CONFIG is the important line, and since 2026-08-10 it is
  # `true` — see the note on the value itself below, and docs/services.md.
  # Read that before editing anything in `env:`, because the consequence is
  # not the one this comment used to claim: Open WebUI copies each setting
  # into its SQLite database, and from then on the DB row wins and the
  # environment is IGNORED. So the values below are FIRST-BOOT SEEDS, not
  # enforced state, and a later edit here can render, restart and silently do
  # nothing for any key that has been touched in the admin UI. The trade runs
  # the other way round from every other service in this repo: admin-UI
  # changes stick across restarts, and this catalog is not the source of
  # truth. `ENABLE_SIGNUP` is where that bites hardest (see its WARNING).
  #
  # Web search points at SearXNG inside svc-download's VPN jail, reached
  # through its generated socket proxy on the LAN. That indirection is the
  # whole point — it puts every search query behind Mullvad without svc-infra
  # needing any VPN of its own.
  #
  # The Ollama and image-generation backends are gated on gpu_host_online so
  # that, while the PC does not exist, the UI simply offers no model rather
  # than surfacing connection errors. ENABLE_OPENAI_API is false because
  # nothing here should ever talk to a paid external endpoint by default.
  open-webui:
    image: "ghcr.io/open-webui/open-webui@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d"
    ui_port: 3007
    container_port: 8080
    volumes:
      - /opt/homelab/appdata/open-webui:/app/backend/data:Z
    env:
      WEBUI_URL: "https://chat.{{ service_domain }}"
      # Signs session JWTs. Must stay stable: rotating it logs everyone out.
      WEBUI_SECRET_KEY: "{{ vault_openwebui_secret_key }}"
      # Deliberately TRUE as of 2026-08-10, reversing the earlier default.
      #
      # The agreed model for this app is: seeded from git, modified in the UI,
      # captured by the backup. That requires UI changes to survive a restart,
      # which is exactly what this flag controls.
      #
      # Understand the resolution order before changing anything below, because
      # it is not "environment wins" any more (models/config.py):
      #
      #     no DB row for the key  -> the environment value is used
      #     a DB row exists        -> the DB wins and the environment is IGNORED
      #
      # A row appears the moment a setting is touched in the admin UI. So
      # editing a value here and running `make infra` silently does nothing for
      # any key that has ever been changed in the UI — no error, and `changed=0`
      # still reports success because the Quadlet really is up to date.
      #
      # That is a real hole in this repo's central guarantee, and closing it is
      # tracked as the settings-as-code exporter (see the working TODO list).
      # Until that exists, treat the values below as first-boot seeds rather
      # than as enforced state.
      ENABLE_PERSISTENT_CONFIG: "true"
      # Open WebUI keeps its own accounts rather than sitting behind Authelia
      # (see the `chat` entry in main.yml), so these two are the whole of its
      # front door. Upstream defaults ENABLE_SIGNUP to true, so omitting it
      # opens public registration on a host wired to the GPU box.
      #
      # WARNING — these are no longer enforced. Since ENABLE_PERSISTENT_CONFIG
      # became true above, these two are first-boot seeds like everything else:
      # once a row exists in the DB the environment is ignored, so a signup
      # toggle flipped in the admin UI now SURVIVES restarts instead of being
      # discarded, and re-running `make infra` will not turn it back off.
      #
      # This is the sharpest edge of the seed-then-drift model, because it is
      # the one setting where drift is a security change rather than a
      # preference. Until the settings-as-code exporter exists (working TODO
      # list), the only check is looking: confirm `ui.enable_signup` is false
      # in `GET /api/v1/configs/export` after any admin-settings session.
      ENABLE_SIGNUP: "false"
      # Belt and braces: if signup is ever turned back on deliberately, a new
      # account lands inert instead of usable until an admin promotes it.
      DEFAULT_USER_ROLE: pending
      # Personas (Workspace → Models) are per-user private by default, which is
      # why models created by the first account are invisible to everyone else.
      # These two open that up: every user may create and manage their own
      # personas, and may share one publicly so it appears in other users'
      # model dropdowns. Both default to false upstream.
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "true"
      USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_SHARING: "true"
      USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_PUBLIC_SHARING: "true"
      ENABLE_OPENAI_API: "false"
      ENABLE_OLLAMA_API: "{{ 'true' if gpu_host_online | bool else 'false' }}"
      OLLAMA_BASE_URL: "http://{{ gpu_host_ip }}:11434"
      ENABLE_IMAGE_GENERATION: "{{ 'true' if gpu_host_online | bool else 'false' }}"
      IMAGE_GENERATION_ENGINE: comfyui
      COMFYUI_BASE_URL: "http://{{ gpu_host_ip }}:8188"
      # Both of these are upstream defaults that were wrong here, and neither
      # announced itself: the container is green, the request succeeds, the
      # image is just bad.
      #
      # IMAGE_SIZE defaults to 512x512 (config.py). The deployed checkpoint is
      # SDXL, which is trained at 1024 and degrades badly below it — so every
      # in-chat image since this feature was enabled has been quietly poor.
      # IMAGE_STEPS defaults to 50, roughly double what SDXL needs, so each
      # one also cost about twice the time it should.
      #
      # Set here rather than in the admin UI so that a rebuild from a clean
      # clone gets them. Note that with ENABLE_PERSISTENT_CONFIG now "true"
      # above, these seed the config table on first start and the stored row
      # wins afterwards — editing them here does NOT change a running
      # instance that has already seeded. Same trap as the ENABLE_SIGNUP
      # comment, in the opposite direction.
      #
      # ⚠️ Neither of these reaches ComfyUI today. Open WebUI injects size,
      # steps, prompt and checkpoint into a ComfyUI workflow only through
      # COMFYUI_WORKFLOW_NODES, which is unset, so it parses to [] and
      # _apply_workflow_nodes iterates nothing. The default workflow is
      # submitted verbatim: 512x512, 20 steps, the literal prompt "Prompt",
      # and ckpt_name "model.safetensors" — which is not the checkpoint on
      # the GPU host (sd_xl_base_1.0.safetensors). See docs/plans/
      # uncensored-image-generation.md.
      IMAGE_SIZE: "1024x1024"
      IMAGE_STEPS: "28"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://{{ hostvars[download_host].ansible_host }}:{{ download_apps.searxng.ui_port }}/search?q=<query>"
      # Chat's own page fetches — the second half of a web search, and the
      # half that used to leave the house directly. SearXNG returns URLs;
      # Open WebUI reads them itself, from here. See
      # docs/superpowers/specs/2026-08-13-chat-egress-through-vpn-design.md.
      #
      # This is a request, not a guarantee. A library that ignores these vars
      # would still leak, which is why svc-infra also drops non-LAN traffic
      # from this container's cgroup (roles/svc_infra/templates/
      # chat-egress.nft.j2). Env says should; the firewall says must.
      http_proxy: "http://{{ hostvars[download_host].ansible_host }}:{{ chat_proxy_port }}"
      https_proxy: "http://{{ hostvars[download_host].ansible_host }}:{{ chat_proxy_port }}"
      HTTP_PROXY: "http://{{ hostvars[download_host].ansible_host }}:{{ chat_proxy_port }}"
      HTTPS_PROXY: "http://{{ hostvars[download_host].ansible_host }}:{{ chat_proxy_port }}"
      # Everything on the LAN stays direct: Ollama and ComfyUI on the GPU host,
      # SearXNG's own IP:port, and loopback. Routing inference through Sweden
      # would be slow and pointless. Note this includes svc-download, so the
      # SEARXNG_QUERY_URL above is unaffected by the lines above it.
      no_proxy: "localhost,127.0.0.1,{{ lan_cidr }},{{ gpu_host_ip }},{{ hostvars[download_host].ansible_host }}"
      NO_PROXY: "localhost,127.0.0.1,{{ lan_cidr }},{{ gpu_host_ip }},{{ hostvars[download_host].ansible_host }}"
    require_vault: [vault_openwebui_secret_key]
    backup_paths: [open-webui]
