---
# svc-infra — rootless infra/self-hosted stack (v6). Catalog-driven like
# svc-download's download_apps (see inventory/group_vars/all/infra-apps.yml).
# This filename must match the inventory_hostname in inventory/hosts.yml's
# infra_vms group — renaming that host means renaming this file too. See
# "Renaming a service VM" in docs/operations.md.
#
# RAM note: bumped 8G->16G, 4c->6c, 80G->120G disk (2026-07-23) to fit a
# second wave of infra services (Prometheus/Grafana/node_exporter, Glances,
# code-server, Semaphore, Webtop, IT Tools) on top of the 14 containers
# already running here. thurgadin had ~20G free at resize time. Bump further
# (and reconcile) if a later service needs more headroom — see docs/operations.md.
vm_id:      132
vm_cores:   6
vm_memory:  16384
vm_disk_gb: 120
# `down=300`: stopping ~28 rootless containers took 6m20s in the 2026-08-04
# cold start, past the 180s `qm shutdown` default. See svc-media.yml and
# docs/plans/cold-start-resilience.md.
vm_startup: "order=4,up=60,down=300"
service_guarded_egress: false
service_requires_subids: true
service_repo_packages: [epel-release]
service_packages:
  - podman
  - nfs-utils
  - policycoreutils-python-utils
  - firewalld
  - python3-firewall
  - curl
  - bind-utils
  - cockpit
  - cockpit-podman
  - cockpit-storaged
  # Exposure scanning (scan.yml). nmap rather than a hand-rolled socket sweep:
  # a naive full-range scan at high concurrency exhausts ephemeral source ports
  # and conntrack, and the dropped connections read as "closed". Measured
  # 2026-07-30 — such a sweep reported svc-download as having only port 22 open
  # while nine service ports were in fact reachable. A port scanner that
  # under-reports is worse than none: it says "all closed, all good".
  - nmap
  # Report-only benchmark scanning (scan.yml). openscap-scanner is the engine,
  # scap-security-guide the policy content. Neither runs on its own: nothing
  # here ever applies a remediation, which on these hosts would fight the
  # SELinux policy module, rootless podman's subuid mappings and the NFS
  # automounts. tests/validate_scan_readonly.py enforces that at build time.
  - openscap-scanner
  - scap-security-guide
# No caddy/dnsmasq here — the access layer (reverse proxy + private DNS)
# stays on svc-media; infra services are reached the same way svc-download's
# proxied apps are: Caddy on svc-media proxies to hostvars[infra_host].ansible_host.

# --- monitoring (mon role) ---
cockpit_origin:     cockpit-infra   # https://cockpit-infra.<domain>
mon_open_firewalld: true            # svc-infra uses firewalld, like svc-media

# Units that get an OnFailure alert, on top of onfailure_units_base.
onfailure_units_extra:
  # The chat egress refresh. It is the only thing that re-arms the nft rule
  # after an open-webui restart recreates its cgroup, and a rule bound to a
  # freed inode fails green: unit active, table listed, drop counter 0. If
  # this stops running, enforcement quietly stops with it.
  - chat-egress-reload.service
  - backup-infra-appdata.service
  - homelab-backups-fresh.service
  # Template unit: the drop-in covers every instance. verify.yml's own
  # rescue already alerts when a GATE fails; this covers the wrapper
  # failing before Ansible ever starts (no vault password, no venv).
  - homelab-verify@.service
  # Same shape for the nightly scan. scan.yml publishes its own findings, so
  # this drop-in is specifically for the scan failing to RUN — which is the
  # failure that would otherwise look exactly like a clean estate.
  - homelab-scan@.service
  # The weekly canary on ntfy_alert_topic. The drop-in is a best-effort second
  # try, not the primary report: if the canary failed because the alert path is
  # down, notify-failure@ publishes into the same broken path. What actually
  # carries the news is the unit sitting in `failed`, which
  # homelab-failedunits.service and `make verify` both see without ntfy.
  - homelab-alert-canary.service
  # The weekly release report. Like the scan drop-in above, this covers the run
  # FAILING TO HAPPEN — release.yml publishes its own findings to ntfy and
  # escalates its own degraded runs, so the only failure left uncovered is the
  # wrapper dying before Ansible starts. Without it a report that stopped
  # arriving would look exactly like a quiet week upstream.
  - homelab-release@.service
