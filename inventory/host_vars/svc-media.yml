---
# svc-media — rootless media stack (Jellyfin/ABS/RomM/Seerr) and LAN access
# This filename must match the inventory_hostname in inventory/hosts.yml's
# media_vms group — renaming that host means renaming this file too. See
# "Renaming a service VM" in docs/operations.md.
vm_id:      130
vm_cores:   6
vm_memory:  10240
vm_disk_gb: 100
# vm_cores bumped 4->6 (2026-07-23) to match svc-infra/svc-download after
# thurgadin RAM/CPU headroom was freed up.
# TrueNAS (convoker, VM 100) is order=1. That comment used to live here and was
# FALSE — the VM had no `startup` line at all, so Proxmox started it *after*
# every ordered VM and stopped it *first*. The 2026-08-04 cold start cost five
# download services on boot and nine SIGKILLed postgres processes on shutdown
# because of it. It is now genuinely set, and verify.yml asserts it against the
# PVE API rather than against this comment. See docs/plans/cold-start-resilience.md.
#
# `down=` is the shutdown allowance. Stopping ~11 rootless containers took
# 7m10s during that test — far past the 180s `qm shutdown` default — so a
# host-initiated (or UPS-initiated) shutdown would have hard-killed this VM.
vm_startup: "order=2,up=90,down=300"
service_guarded_egress: false
service_requires_subids: true
service_repo_packages: [epel-release]
service_packages:
  - podman
  - nfs-utils
  - policycoreutils-python-utils
  - firewalld
  - python3-firewall
  - curl
  - bind-utils
  - dnsmasq
  - caddy
  - certbot
  - python3-certbot-dns-cloudflare
  - cockpit
  - cockpit-podman
  - cockpit-storaged
  # Exposure scanning (scan.yml). nmap rather than a hand-rolled socket sweep:
  # a naive full-range scan at high concurrency exhausts ephemeral source ports
  # and conntrack, and the dropped connections read as "closed". Measured
  # 2026-07-30 — such a sweep reported svc-download as having only port 22 open
  # while nine service ports were in fact reachable. A port scanner that
  # under-reports is worse than none: it says "all closed, all good".
  - nmap
  # Report-only benchmark scanning (scan.yml). openscap-scanner is the engine,
  # scap-security-guide the policy content. Neither runs on its own: nothing
  # here ever applies a remediation, which on these hosts would fight the
  # SELinux policy module, rootless podman's subuid mappings and the NFS
  # automounts. tests/validate_scan_readonly.py enforces that at build time.
  - openscap-scanner
  - scap-security-guide
# Remote access is handled by the dedicated subnet-router VM, not this role.

# --- monitoring (mon role) ---
cockpit_origin:     cockpit-media   # https://cockpit-media.<domain>
mon_open_firewalld: true            # svc-media uses firewalld

# Units that get an OnFailure alert, on top of onfailure_units_base.
# certbot-renew is the important one: it is a distro unit nothing in this repo
# writes, and its failure is otherwise invisible until HTTPS breaks.
onfailure_units_extra:
  - backup-media.service
  - certbot-renew.service
  - homelab-certwatch.service
  - homelab-heartbeat.service
