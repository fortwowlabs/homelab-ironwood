---
# svc-download — netns VPN jail + SAB/arr stack (flat LAN, no VLAN)
# This filename must match the inventory_hostname in inventory/hosts.yml's
# download_vms group — renaming that host means renaming this file too. See
# "Renaming a service VM" in docs/operations.md.
vm_id:      131
vm_cores:   6
vm_memory:  8192
vm_disk_gb: 160
# RAM bumped 6G->8G (2026-07-23) ahead of adding jdownloader to the jail —
# archive extraction is memory-spiky. Cores bumped 4->6 to match
# svc-infra/svc-media. thurgadin had ~20G free at resize time.
vm_startup: "order=3,up=30"
service_guarded_egress: true
service_repo_packages: [epel-release]
service_packages:
  - wireguard-tools
  - podman
  - curl
  - nfs-utils
  - nftables
  - policycoreutils-python-utils
  - checkpolicy
  - cockpit
  - cockpit-podman
  - cockpit-storaged
  # Report-only benchmark scanning (scan.yml). openscap-scanner is the engine,
  # scap-security-guide the policy content. Neither runs on its own: nothing
  # here ever applies a remediation, which on these hosts would fight the
  # SELinux policy module, rootless podman's subuid mappings and the NFS
  # automounts. tests/validate_scan_readonly.py enforces that at build time.
  - openscap-scanner
  - scap-security-guide

# --- monitoring (mon role) ---
cockpit_origin:     cockpit-dl      # https://cockpit-dl.<domain>
mon_open_firewalld: false           # svc-download uses the nftables backstop (:9090 opened there)

# Units that get an OnFailure alert, on top of onfailure_units_base.
# vpn-netns is the jail itself: if it fails, every download container is
# either stopped or — the case worth paging for — not where it should be.
# leak-canary is deliberately absent: it alerts natively with far better
# context than a generic "unit failed" could, and it runs every 15 minutes,
# so a drop-in would just double the noise. tests/validate_onfailure.py
# records that exemption so it stays a decision rather than an oversight.
onfailure_units_extra:
  - backup-dl-appdata.service
  - vpn-netns.service
