---
- name: Verify Cockpit is listening
  ansible.builtin.command: systemctl is-active cockpit.socket
  changed_when: false

# is-enabled as well as is-active. `systemctl --failed` never reports a unit
# that is merely not enabled — it is inactive (dead), not failed — so a timer
# started by hand during troubleshooting passes every liveness check, keeps
# working until the next reboot, and is then gone with nothing complaining.
# For watchers that exist to notice problems while nobody is home, "will it
# come back" is the property that matters.
- name: Verify the monitoring timers are active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item.1 }}"
      - "{{ item.0 }}"
  loop: >-
    {{ ['homelab-diskalert.timer', 'homelab-failedunits.timer']
       | product(['is-active', 'is-enabled']) | list }}
  loop_control:
    label: "{{ item.1 }} {{ item.0 }}"
  changed_when: false

# The alerting path is itself unattended infrastructure: if the OnFailure
# template unit or its script goes missing, every drop-in silently points at
# nothing and the whole scheme degrades to the pre-existing silence.
- name: Verify the unit-failure alerter is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  register: mon_alerter_files
  loop:
    - /usr/local/sbin/notify-failure.sh
    - /etc/systemd/system/notify-failure@.service

- name: Assert the unit-failure alerter is installed
  ansible.builtin.assert:
    that:
      - mon_alerter_files.results | map(attribute='stat.exists') | select | list | length == 2
    fail_msg: "notify-failure alerting is incomplete; OnFailure drop-ins would do nothing."

- name: Verify notification credentials are not executable or group-readable
  ansible.builtin.stat:
    path: /etc/homelab-notify.env
  register: mon_notify_environment

- name: Assert notification credential permissions
  ansible.builtin.assert:
    that:
      - mon_notify_environment.stat.exists
      - mon_notify_environment.stat.mode == '0600'
      - mon_notify_environment.stat.pw_name == 'root'

- name: Mark monitoring verification complete
  ansible.builtin.set_fact:
    mon_verified: true
