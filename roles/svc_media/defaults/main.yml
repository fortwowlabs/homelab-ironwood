---
# The media service catalog is a role default, not a runtime fact, because
# standalone verify.yml enters tasks_from: verify without running files.yml.
# Keep deployment, startup, and verification on this one list.
media_quadlet_catalog:
  - { name: jellyfin, src: jellyfin.container.j2 }
  - { name: audiobookshelf, src: audiobookshelf.container.j2 }
  - { name: romm-db, src: romm-db.container.j2 }
  - { name: romm, src: romm.container.j2 }
  - { name: seerr, src: seerr.container.j2 }
  - { name: calibre-web-automated, src: calibre-web-automated.container.j2 }
  - { name: ntfy, src: ntfy.container.j2 }
  - { name: homepage, src: homepage.container.j2 }
  # Prometheus host-metrics exporter (scraped by svc-infra). No appdata
  # directory: it only mounts /proc, /sys, and rootfs read-only.
  - { name: node-exporter, src: node-exporter.container.j2 }

# A single manifest drives initial-backup gating and safe artifact validation.
media_backup_artifacts:
  - name: jellyfin
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: jellyfin-config-*.tar.gz
    format: tar
  - name: seerr
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: seerr-*.tar.gz
    format: tar
  - name: calibre-web-automated
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: calibre-web-automated-*.tar.gz
    format: tar
  - name: romm-appdata
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: romm-appdata-*.tar.gz
    format: tar
  - name: romm-database
    directory: "/srv/backups/{{ inventory_hostname }}/romm-db"
    pattern: romm-*.sql.gz
    format: gzip
  # Minecraft world tars — one entry per minecraft_servers key (inventory/
  # group_vars/all/minecraft.yml). Unlike the Quadlet render, appdata dirs,
  # and the tar/RCON commands themselves (all fully catalog-driven — see
  # backup-media.sh.j2 and svc_media/tasks/files.yml), this freshness-gate
  # list is hand-maintained, matching every other entry above: a third
  # server needs one more entry here too.
  - name: minecraft-minecraft
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: minecraft-minecraft-*.tar.gz
    format: tar
  - name: minecraft-minecraft2
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: minecraft-minecraft2-*.tar.gz
    format: tar
