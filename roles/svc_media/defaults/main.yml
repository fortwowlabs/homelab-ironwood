---
# The media service catalog is a role default, not a runtime fact, because
# standalone verify.yml enters tasks_from: verify without running files.yml.
# Keep deployment, startup, and verification on this one list.
media_quadlet_catalog:
  - { name: jellyfin, src: jellyfin.container.j2 }
  - { name: audiobookshelf, src: audiobookshelf.container.j2 }
  - { name: romm-db, src: romm-db.container.j2 }
  - { name: romm, src: romm.container.j2 }
  - { name: seerr, src: seerr.container.j2 }
  - { name: calibre-web-automated, src: calibre-web-automated.container.j2 }
  - { name: ntfy, src: ntfy.container.j2 }
  - { name: homepage, src: homepage.container.j2 }
  # Prometheus host-metrics exporter (scraped by svc-infra). No appdata
  # directory: it only mounts /proc, /sys, and rootfs read-only.
  - { name: node-exporter, src: node-exporter.container.j2 }

# The pinned MariaDB image runs its server as mysql (999:999). Keep this
# explicit because rootless Podman maps that identity to host subuids; using
# the homelab account's host UID on this bind mount makes MariaDB unable to
# create or remove files in /var/lib/mysql during shutdown.
romm_db_container_uid: 999
romm_db_container_gid: 999

# A single manifest drives initial-backup gating and safe artifact validation.
media_backup_artifacts:
  - name: jellyfin
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: jellyfin-config-*.tar.gz
    format: tar
  - name: seerr
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: seerr-*.tar.gz
    format: tar
  - name: calibre-web-automated
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: calibre-web-automated-*.tar.gz
    format: tar
  - name: romm-appdata
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: romm-appdata-*.tar.gz
    format: tar
  - name: romm-database
    directory: "/srv/backups/{{ inventory_hostname }}/romm-db"
    pattern: romm-*.sql.gz
    format: gzip
  # Minecraft world tars — one entry per minecraft_servers key (inventory/
  # group_vars/all/minecraft.yml). Unlike the Quadlet render, appdata dirs,
  # and the tar/RCON commands themselves (all fully catalog-driven — see
  # backup-media.sh.j2 and svc_media/tasks/files.yml), this freshness-gate
  # list is hand-maintained, matching every other entry above: a third
  # server needs one more entry here too. Parked servers are filtered out
  # by media_backup_artifacts_active below, so leave their entries here.
  - name: minecraft-minecraft
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: minecraft-minecraft-*.tar.gz
    format: tar
  - name: minecraft-minecraft2
    directory: "/srv/backups/{{ inventory_hostname }}/appdata"
    pattern: minecraft-minecraft2-*.tar.gz
    format: tar

# media_backup_artifacts minus the world tars of parked Minecraft servers
# (enabled: false in minecraft.yml). backup-media.sh.j2 skips those servers,
# so their tars stop being written; gating on them would turn a deliberate
# park into a nightly "backup is stale" alarm. Both the backup and verify
# freshness checks loop this, never the raw list.
media_backup_artifacts_active: >-
  {{ media_backup_artifacts
     | rejectattr('name', 'in',
         minecraft_servers.keys() | difference(minecraft_enabled_servers.keys())
         | map('regex_replace', '^', 'minecraft-') | list)
     | list }}

# Jellyfin transcode segments live on their own disk (pve_vm's scsi1 scratch
# disk), not on tmpfs and not on root. tmpfs was 6G of a 10G VM and filled in
# about a minute on a 4K remux; after that ffmpeg wrote every further segment
# as 0 bytes without logging an error, and playback died at exactly the last
# non-empty segment (2026-10-14). The by-id path is stable across reboots and
# controller reordering, unlike /dev/sdb.
#
# Deliberately NOT under /srv: on these hosts /srv/* means NFS, and
# service_vm's node-exporter gate fails on any /srv/ filesystem metric because
# a statted NFS mount wedges the collector during a storage outage. Outside
# /srv, node_exporter charts this disk's fill like any local filesystem.
media_transcode_dir: /var/lib/jellyfin-transcodes
media_transcode_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1

# Jellyfin's encoding.xml values this repo owns. Throttling pauses ffmpeg once
# it is ThrottleDelaySeconds ahead of the client; segment deletion removes
# segments SegmentKeepSeconds behind it. Both were off, so ffmpeg ran at 9x
# realtime and kept every segment. 300s rather than Jellyfin's 720s default:
# 720s of an 80 Mbps remux is ~7G on its own.
jellyfin_encoding_settings:
  EnableThrottling: "true"
  ThrottleDelaySeconds: "180"
  EnableSegmentDeletion: "true"
  SegmentKeepSeconds: "300"
