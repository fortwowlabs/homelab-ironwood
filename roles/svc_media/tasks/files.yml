---
- name: Enable lingering for the rootless service account
  ansible.builtin.command: loginctl enable-linger homelab
  changed_when: false

- name: Create rootless Quadlet and application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop:
    - /opt/homelab/.config/containers/systemd
    - /opt/homelab/appdata/jellyfin/config
    - /opt/homelab/appdata/jellyfin/cache
    - /opt/homelab/appdata/audiobookshelf/config
    - /opt/homelab/appdata/audiobookshelf/metadata
    - /opt/homelab/appdata/seerr
    - /opt/homelab/appdata/calibre-web-automated
    - /opt/homelab/appdata/romm/resources
    - /opt/homelab/appdata/romm/assets
    - /opt/homelab/appdata/romm/config
    - /opt/homelab/appdata/romm/redis-data
    - /opt/homelab/appdata/homepage
    - /opt/homelab/appdata/ntfy/cache
    - /opt/homelab/appdata/ntfy/etc

# Stale-unit reconciliation, mirroring roles/svc_infra/tasks/files.yml and
# roles/svc_download/tasks/files.yml. svc-media was the one service VM without
# it, and roles/svc_media/tasks/migrations.yml is what that cost: 44 lines of
# hand-written Jellyseerr teardown doing by name what this does generically.
#
# Every expected list below is a single bare `{{ }}` expression (never
# {% set %}/{% for %}), so difference() operates on a real list rather than a
# string repr of one — the exact gotcha documented in
# roles/svc_download/tasks/files.yml.
- name: Calculate the rootless media unit files that should exist
  ansible.builtin.set_fact:
    # beszel-agent is force-included even when disabled so a previously
    # rendered agent is never treated as stale by a token/key being cleared —
    # its own `when: beszel_agent_enabled` render + WARN already handle that.
    media_expected_container_paths: >-
      {{ ((media_quadlet_catalog | map(attribute='name') | list)
          + (minecraft_servers.keys() | list))
         | union(['beszel-agent'])
         | map('regex_replace', '^(.*)$',
                '/opt/homelab/.config/containers/systemd/\1.container') | list }}
    media_expected_network_paths: >-
      {{ ['romm']
         | map('regex_replace', '^(.*)$',
                '/opt/homelab/.config/containers/systemd/\1.network') | list }}
  changed_when: false

- name: Discover Ansible-managed rootless media container Quadlets
  ansible.builtin.find:
    paths: /opt/homelab/.config/containers/systemd
    patterns: "*.container"
    file_type: file
    # `contains` matches with re.match — the BEGINNING of each line — unless
    # read_whole_file is set, when it uses re.search instead. The marker lands
    # on a line reading "# Ansible managed", so the bare string could never
    # match: the line starts with '#'. This find returned zero files on every
    # run, which made the sweep below inert while looking correct, and an inert
    # sweep is indistinguishable from an estate with nothing stale on it.
    # Measured 2026-09-03: 0 of 30 managed quadlets matched on svc-infra.
    # (roles/svc_download/tasks/files.yml escaped this by anchoring its own
    # pattern at '^#'.)
    contains: '(?m)^#\s*Ansible managed\s*$'
    read_whole_file: true
  register: media_managed_containers
  check_mode: false

# The `contains:` filter matters more here than on the container find above,
# because this list feeds `state: absent` while that one only feeds a `stop`.
# Without it the sweep would delete every .network file it did not expect,
# including one placed by hand — a destructive action against files it had
# never established it owned. romm.network is `copy:`d verbatim rather than
# templated, so it carries the marker as a literal comment line; deleting that
# line makes this find skip it and the next converge delete the deployed copy.
- name: Discover Ansible-managed rootless media network Quadlets
  ansible.builtin.find:
    paths: /opt/homelab/.config/containers/systemd
    patterns: "*.network"
    file_type: file
    # Same regex and read_whole_file as the container find above; see the
    # comment there for why the bare string could never match.
    contains: '(?m)^#\s*Ansible managed\s*$'
    read_whole_file: true
  register: media_managed_networks
  check_mode: false

- name: Calculate stale rootless media unit paths
  ansible.builtin.set_fact:
    media_stale_container_paths: >-
      {{ media_managed_containers.files | map(attribute='path') | list
         | difference(media_expected_container_paths) }}
    media_stale_network_paths: >-
      {{ media_managed_networks.files | map(attribute='path') | list
         | difference(media_expected_network_paths) }}
  changed_when: false

# Tolerating a failure here is the correct behaviour, not laziness. A stale
# .container file whose generated unit systemd never loaded — the file was
# added and the daemon never reloaded, or the unit was already stopped and
# reset — makes `systemctl stop` exit non-zero, which without this would abort
# the deploy inside the very block whose job is to reconcile units that should
# not exist. Nothing downstream depends on the stop succeeding: the
# `state: absent` task below removes the file, and the reload is what actually
# retires the unit. Failing to stop something that is not running is not a
# failure.
- name: Stop stale rootless media services
  ansible.builtin.command: >-
    systemctl --user -M homelab@ stop
    {{ item | basename | regex_replace('\.container$', '.service') }}
  loop: "{{ media_stale_container_paths }}"
  changed_when: true
  failed_when: false

- name: Remove stale rootless media unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ media_stale_container_paths + media_stale_network_paths }}"
  notify: media configuration changed

# Do not enforce host ownership after initial creation. MariaDB owns this mount
# as uid/gid 999 inside the container namespace, which maps to subuids on the
# host. Resetting it to homelab on every converge leaves the running server able
# to read its files but unable to create or remove files in the mount root on
# shutdown.
- name: Check whether the RomM database directory exists
  ansible.builtin.stat:
    path: /opt/homelab/appdata/romm/mysql
  register: media_romm_db_directory

- name: Create the RomM database directory as the rootless service account
  ansible.builtin.file:
    path: /opt/homelab/appdata/romm/mysql
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  when: not media_romm_db_directory.stat.exists

- name: Read the namespaced owner of the RomM database directory
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - stat
      - -c
      - "%u:%g"
      - /opt/homelab/appdata/romm/mysql
  register: media_romm_db_owner
  changed_when: false

- name: Give MariaDB ownership of its data directory
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - chown
      - -R
      - "{{ romm_db_container_uid }}:{{ romm_db_container_gid }}"
      - /opt/homelab/appdata/romm/mysql
  when: >-
    media_romm_db_owner.stdout | trim
    != (romm_db_container_uid | string) ~ ':' ~ (romm_db_container_gid | string)
  changed_when: true
  notify: media configuration changed

- name: Render rootless media Quadlets
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/opt/homelab/.config/containers/systemd/{{ item.name }}.container"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  loop: "{{ media_quadlet_catalog }}"
  loop_control:
    label: "{{ item.name }}"
  register: media_quadlet_templates

- name: Install the RomM private network Quadlet
  ansible.builtin.copy:
    src: quadlets/romm.network
    dest: /opt/homelab/.config/containers/systemd/romm.network
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: media_romm_network

- name: Require RomM database and authentication secrets
  ansible.builtin.assert:
    that:
      - (vault_romm_db_password | default('')) | length > 0
      - (vault_romm_db_root_password | default('')) | length > 0
      - (vault_romm_auth_secret_key | default('')) | length >= 32
      # Length is not a guard: "REPLACE_db_root_password" is non-empty, so
      # without these three a partly-filled vault would hand MariaDB a root
      # password that is printed in a committed file — and once the data
      # directory is initialised, changing it means an ALTER USER inside the
      # running database, never a redeploy. vault_romm_auth_secret_key is only
      # caught by the >= 32 check because the placeholder happens to be 27
      # characters; that is luck, so it is guarded explicitly as well.
      - not ((vault_romm_db_password | default('')) | string is match('REPLACE_'))
      - not ((vault_romm_db_root_password | default('')) | string is match('REPLACE_'))
      - not ((vault_romm_auth_secret_key | default('')) | string is match('REPLACE_'))
    fail_msg: >-
      Configure the RomM database passwords and an authentication secret of
      at least 32 characters in the encrypted inventory — none of the three
      may still be its REPLACE_* example placeholder.
  no_log: true
  diff: false

- name: Render service-account-owned RomM secret files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/opt/homelab/appdata/romm/{{ item }}"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0600"
  loop: [romm.env, romm-db.env]
  register: media_romm_secret_templates
  no_log: true
  diff: false

- name: Ensure the Beszel agent appdata directory exists
  ansible.builtin.file:
    path: /opt/homelab/appdata/beszel-agent
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  when: beszel_agent_enabled | bool

- name: Render the Beszel agent Quadlet
  ansible.builtin.template:
    src: beszel-agent.container.j2
    dest: /opt/homelab/.config/containers/systemd/beszel-agent.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds the Beszel TOKEN/KEY on Environment= lines.
    mode: "0600"
  register: media_beszel_agent_template
  when: beszel_agent_enabled | bool
  no_log: true
  diff: false

- name: WARN that the Beszel agent is not yet configured
  ansible.builtin.debug:
    msg: >-
      *** WARNING: the Beszel token and key are empty — the
      Beszel agent on {{ inventory_hostname }} is NOT deployed. Visit
      https://beszel.{{ service_domain }}, create a universal token under
      Settings > Tokens, fill both vault vars, and re-run the deploy. See
      docs/services.md "Beszel monitoring setup". ***
  when: not (beszel_agent_enabled | bool)

# --- Minecraft (v6): LAN-only game servers, driven by minecraft_servers
# (inventory/group_vars/all/minecraft.yml) through a single shared template.
- name: Create Minecraft appdata directories
  ansible.builtin.file:
    path: "/opt/homelab/appdata/minecraft/{{ item.key }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop: "{{ minecraft_servers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Require the Minecraft RCON password
  ansible.builtin.assert:
    that:
      - (vault_minecraft_rcon_password | default('')) | string | length > 0
      - not ((vault_minecraft_rcon_password | default('')) | string is match('REPLACE_'))
    fail_msg: >-
      Configure vault_minecraft_rcon_password in the encrypted inventory.
      RCON is never published to the LAN, but backup-media.sh.j2 uses it
      (via `podman exec <name> rcon-cli`) to flush each world before its
      nightly tar, so every Minecraft Quadlet needs it to start.
  no_log: true
  diff: false
  when: minecraft_servers | length > 0

- name: Render Minecraft Quadlets
  ansible.builtin.template:
    src: minecraft.container.j2
    dest: "/opt/homelab/.config/containers/systemd/{{ item.key }}.container"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds RCON_PASSWORD on an Environment= line.
    mode: "0600"
  loop: "{{ minecraft_servers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: media_minecraft_templates
  no_log: true
  diff: false

- name: Render the media backup program
  ansible.builtin.template:
    src: backup-media.sh.j2
    dest: /usr/local/sbin/backup-media.sh
    owner: root
    group: root
    mode: "0755"

- name: Render the media backup service
  ansible.builtin.template:
    src: backup-media.service.j2
    dest: /etc/systemd/system/backup-media.service
    mode: "0644"
  notify: reload systemd

- name: Install the media backup timer
  ansible.builtin.copy:
    src: backup-media.timer
    dest: /etc/systemd/system/backup-media.timer
    mode: "0644"
  notify: reload systemd

- name: Calculate media services whose rendered configuration changed
  ansible.builtin.set_fact:
    media_services_to_restart: >-
      {{
        (
          (
            media_quadlet_templates.results
            | selectattr('changed')
            | map(attribute='item.name')
            | list
          )
          + (['romm-db', 'romm'] if media_romm_network.changed else [])
          + (['romm-db', 'romm'] if (media_romm_secret_templates.changed | default(false)) else [])
          + (['beszel-agent'] if (media_beszel_agent_template.changed | default(false)) else [])
          + (
              media_minecraft_templates.results
              | selectattr('changed')
              | map(attribute='item.key')
              | list
            )
        ) | unique | list
      }}
  changed_when: media_services_to_restart | length > 0
  notify: media configuration changed
