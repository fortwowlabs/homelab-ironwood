---
# What is still here, and what is not.
#
# Four tasks used to precede these two: stop the legacy jellyseerr unit, and
# remove its Quadlet. The stale-unit sweep in files.yml now does both for
# anything media_quadlet_catalog no longer names, so they were doing by name
# what the sweep does generically.
#
# The two below stay because a unit-file sweep does not remove a leftover
# CONTAINER — that is outside its scope. On svc-media all three are already
# absent (quadlet, unit and container, confirmed 2026-09-03), so these are
# no-ops there; they remain only to cover a host that has not yet converged.
# Delete them, and this file with its import in main.yml, once no host that
# ever ran Jellyseerr is left unconverged.
- name: Check for a legacy Jellyseerr container
  ansible.builtin.command: >-
    runuser -u homelab -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}
    podman container exists jellyseerr
  args:
    chdir: /tmp
  register: media_legacy_container
  failed_when: false
  changed_when: false
  check_mode: false

- name: Remove the legacy Jellyseerr container only when present
  ansible.builtin.command: >-
    runuser -u homelab -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}
    podman rm -f jellyseerr
  args:
    chdir: /tmp
  when: media_legacy_container.rc == 0
  changed_when: true
