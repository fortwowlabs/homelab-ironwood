---
- name: Verify all rootless media services are active
  ansible.builtin.command: "systemctl --user -M homelab@ is-active {{ item }}.service"
  loop: >-
    {{
      (media_quadlet_catalog | map(attribute='name') | list)
      + (['beszel-agent'] if beszel_agent_enabled | bool else [])
      + (minecraft_servers.keys() | list)
    }}
  changed_when: false

- name: Verify MariaDB owns its data directory in the container namespace
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - stat
      - -c
      - "%u:%g"
      - /opt/homelab/appdata/romm/mysql
  register: media_romm_db_owner_gate
  changed_when: false
  failed_when: >-
    media_romm_db_owner_gate.stdout | trim
    != (romm_db_container_uid | string) ~ ':' ~ (romm_db_container_gid | string)

- name: Verify Jellyfin answers on its LAN-bound address
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8096/System/Info/Public"
    status_code: 200
    timeout: 20
  register: media_jellyfin_gate
  retries: 6
  delay: 10
  until: media_jellyfin_gate.status == 200

# Minecraft speaks a raw TCP protocol, not HTTP, so a URI probe like
# Jellyfin's doesn't apply — confirm each server's LAN-published port
# actually accepts connections instead.
- name: Verify Minecraft servers accept TCP connections
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ item.value.port }}"
    timeout: 30
  loop: "{{ minecraft_servers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Verify containers see NFS data and remove every write probe
  ansible.builtin.command:
    cmd: >-
      runuser -u homelab -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}
      podman exec {{ item.container }} sh -c {{ item.probe | quote }}
    chdir: /tmp
  loop:
    - container: jellyfin
      probe: "test -r /media/movies"
    - container: audiobookshelf
      probe: "p=/audiobooks/.homelab-verify; trap 'rm -f $p' EXIT; touch $p"
    - container: romm
      probe: "p=/romm/library/.homelab-verify; trap 'rm -f $p' EXIT; touch $p"
    - container: calibre-web-automated
      probe: "p=/calibre-library/.homelab-verify; trap 'rm -f $p' EXIT; touch $p"
  loop_control:
    label: "{{ item.container }}"
  register: media_nfs_probe
  changed_when: false
  retries: 6
  delay: 10
  until: media_nfs_probe is not failed

- name: Find fresh nonempty media backup artifacts
  ansible.builtin.command:
    argv:
      - find
      - "{{ item.directory }}"
      - -maxdepth
      - "1"
      - -type
      - f
      - -size
      - +0c
      - -mtime
      - "-2"
      - -name
      - "{{ item.pattern }}"
      - -print
      - -quit
  loop: "{{ media_backup_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
  register: media_backup_artifact_gates
  changed_when: false

- name: Assert every required media backup artifact is fresh and nonempty
  ansible.builtin.assert:
    that:
      - >-
        media_backup_artifact_gates.results
        | selectattr('stdout', 'equalto', '') | list | length == 0
    fail_msg: >-
      A fresh nonempty Jellyfin, Seerr, RomM appdata, or RomM database backup
      is missing. Inspect backup-media.service and the NFS backup mount.

- name: Validate media tar archive structure
  ansible.builtin.command:
    argv: [tar, -tzf, "{{ item.stdout }}"]
  loop: >-
    {{ media_backup_artifact_gates.results
       | selectattr('item.format', 'equalto', 'tar') | list }}
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false

- name: Validate compressed RomM database backup
  ansible.builtin.command:
    argv: [gzip, -t, "{{ item.stdout }}"]
  loop: >-
    {{ media_backup_artifact_gates.results
       | selectattr('item.format', 'equalto', 'gzip') | list }}
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: false

- name: Verify the private DNS service is active
  ansible.builtin.command: systemctl is-active dnsmasq.service
  changed_when: false

- name: Verify the private DNS service answers from its LAN address
  ansible.builtin.command: >-
    dig +short +time=2 +tries=2 @{{ ansible_host }}
    jellyfin.{{ service_domain }}
  register: media_verify_dns_gate
  changed_when: false
  failed_when: ansible_host not in media_verify_dns_gate.stdout

# The permissive rule below (fail only on a connection failure or a 5xx) is
# deliberately weak for most services, because a healthy backend can legally
# answer with almost any status. It is NOT weak enough for the SSO ones: an
# unauthenticated request to a protected service must be challenged, and a
# plain 200 there means forward-auth is not being applied — the service is
# wide open while the inventory says it is protected. That is the fail-open
# case, so it is asserted rather than assumed.
#
# Checking only the STATUS would be too weak to catch that: Jellyfin, which is
# deliberately unprotected, answers / with its own 302 to web/, so "a
# protected service returned 302" proves nothing on its own. The redirect
# TARGET is what distinguishes an Authelia challenge from an application's own
# redirect, so that is what is asserted. Observed live: Authelia answers a
# browser-ish request with 302 to the portal (carrying ?rd=<original url>) and
# an API-ish one with 401, keyed off the Accept header.
#
# The request therefore pins `Accept: text/html` and only the 302-to-portal
# shape is accepted. Both shapes used to be allowed, and the bare 401 arm was
# the weak one: it asserted a status code without checking who produced it, so
# any backend that natively answers / with 401 satisfied "is it protected?"
# whether or not forward_auth was still in front of it. webtop and code-server
# both keep their own auth underneath and are one config change from being
# exactly that. Pinning Accept removes the ambiguous branch rather than trying
# to tell two 401s apart after the fact.
#
# Note the coupling this creates: if Authelia is down, Caddy's forward_auth
# emits 502 and the existing 5xx rule fails every protected service at once.
# That is correct — they really are broken — but it does make the identity
# provider a single point of failure for `make verify`.
- name: Smoke-test every configured Caddy backend
  ansible.builtin.command: >-
    curl -s --max-time 15 -o /dev/null -w '%{http_code} %{redirect_url}'
    -H 'Accept: text/html'
    --resolve {{ item }}.{{ service_domain }}:443:{{ ansible_host }}
    https://{{ item }}.{{ service_domain }}
  loop: >-
    {{
      (caddy_services.keys() | list)
      + (
        download_apps | dict2items | selectattr('value.proxy')
        | map(attribute='key') | list
      )
    }}
  register: media_caddy_gates
  changed_when: false
  vars:
    # "<code> <redirect_url>"; redirect_url is empty for a non-redirect.
    media_gate_code: "{{ media_caddy_gates.stdout.split(' ')[0] }}"
    media_gate_portal: "https://auth.{{ service_domain }}"
  failed_when: >-
    media_gate_code == '000'
    or media_gate_code is match('^5[0-9]{2}$')
    or (
      item in (sso_protected_services | default([]))
      and not (
        media_gate_code == '302'
        and media_gate_portal in media_caddy_gates.stdout
      )
    )
    or (
      item == 'auth'
      and media_gate_code != '200'
    )
  retries: 3
  delay: 5
  until: media_caddy_gates is not failed
  when: media_access_layer | default('manual') == 'caddy'

- name: Verify the generated Caddyfile is canonically formatted
  ansible.builtin.command:
    argv:
      - caddy
      - fmt
      - --diff
      - /etc/caddy/Caddyfile
  changed_when: false
  when: media_access_layer | default('manual') == 'caddy'

- name: Verify the Caddy certificate issuer and wildcard SAN
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl s_client -connect {{ ansible_host }}:443
      -servername home.{{ service_domain }} </dev/null 2>/dev/null
      | openssl x509 -noout -issuer -ext subjectAltName
    executable: /bin/bash
  register: media_caddy_certificate_gate
  changed_when: false
  failed_when: >-
    "Let's Encrypt" not in media_caddy_certificate_gate.stdout
    or ('DNS:*.' ~ service_domain) not in media_caddy_certificate_gate.stdout
  when: media_access_layer | default('manual') == 'caddy'

- name: Verify automatic certificate renewal is active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - certbot-renew.timer
  loop:
    - is-active
    - is-enabled
  changed_when: false
  when: media_access_layer | default('manual') == 'caddy'

- name: Verify the certificate expiry watcher is active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - homelab-certwatch.timer
  loop:
    - is-active
    - is-enabled
  changed_when: false
  when: media_access_layer | default('manual') == 'caddy'

# The healthchecks heartbeat is the only signal that leaves the house on a
# schedule from this host, so a timer that stopped firing is indistinguishable
# from the house losing power — which is precisely the thing it exists to
# report. It had no gate at all.
- name: Verify the healthchecks heartbeat timer is active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - homelab-heartbeat.timer
  loop:
    - is-active
    - is-enabled
  changed_when: false

# Run the watcher itself rather than trusting that its timer exists: this is
# the check that would actually have caught an expiring certificate, and a
# timer being active says nothing about whether the script works.
#
# The failure is deferred rather than raised here. This play carries
# any_errors_fatal, so a cert inside the warning window used to abort the entire
# run at this point — taking with it node_exporter, the failed-unit sweep and
# the whole hypervisor play that follows. A certificate with three weeks left is
# a real problem but not a reason to stop checking the disks, so the result is
# carried to the final play and asserted there, which still ends the run red.
- name: Check whether the certificate is near expiry
  ansible.builtin.command: /usr/local/sbin/homelab-certwatch.sh
  register: media_certwatch_gate
  changed_when: false
  failed_when: false
  when: media_access_layer | default('manual') == 'caddy'

- name: Record the certificate expiry result for the final gate
  ansible.builtin.set_fact:
    media_cert_ok: "{{ media_certwatch_gate.rc | default(0) == 0 }}"
    media_cert_detail: "{{ media_certwatch_gate.stderr | default('') | trim }}"

- name: Verify node_exporter metrics
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: node-exporter

- name: Verify the system has no failed services
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: failed-units

- name: Mark svc-media verification complete
  ansible.builtin.set_fact:
    svc_media_verified: true
