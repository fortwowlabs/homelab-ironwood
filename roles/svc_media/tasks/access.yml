---
# tests/validate_sso.py checks this offline in `make validate`, which is where
# a typo should be caught. Repeated here because access.yml is also reachable
# directly via `make access` — the fast path used to roll SSO back — and the
# portal locking itself out is not a failure worth discovering by hand.
- name: Assert the Authelia portal is not behind its own forward-auth
  ansible.builtin.assert:
    that:
      - "'auth' not in (sso_protected_services | default([]))"
    fail_msg: >-
      sso_protected_services lists 'auth', the Authelia portal itself.
      Rendering that produces an infinite redirect: the login form would be
      gated behind a login. Remove it from
      inventory/group_vars/all/main.yml.

- name: Start firewalld before applying service rules
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Open LAN-scoped media and notification ports
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port={{ item }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: [8080, 8096]

# Minecraft: one rule per catalog entry's LAN-facing game port. RCON
# (25575, see minecraft.container.j2) is deliberately NEVER opened here —
# it isn't published on the host at all, only reachable via `podman exec`.
- name: Open LAN-scoped Minecraft server ports
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port={{ item }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ minecraft_servers.values() | map(attribute='port') | list }}"

# node_exporter is a scrape target, not a user-facing UI: open :9100 ONLY to
# Prometheus's host (svc-infra), a single source address, not the whole LAN.
- name: Open node_exporter to Prometheus only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ hostvars[infra_host].ansible_host }}/32
      port port=9100 protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

- name: Remove the legacy unscoped Jellyfin port opening
  ansible.posix.firewalld:
    port: 8096/tcp
    permanent: true
    immediate: true
    state: disabled

- name: Ensure dnsmasq loads managed configuration snippets
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    line: "conf-dir=/etc/dnsmasq.d/,*.conf"
    regexp: '^\s*#?\s*conf-dir=/etc/dnsmasq\.d'
    create: true
    mode: "0644"
  notify: restart dnsmasq

- name: Render the private service DNS zone
  ansible.builtin.template:
    src: dnsmasq-services.conf.j2
    dest: /etc/dnsmasq.d/services.conf
    mode: "0644"
    validate: "dnsmasq --test --conf-file=%s"
  notify: restart dnsmasq

# v6: this snippet was named after the hardcoded "fort.wow" domain before
# service_domain became fully configurable. Clean up the old filename so a
# renamed/re-domained deploy never loads two copies of the same zone.
- name: Remove the legacy fort-wow.conf dnsmasq snippet
  ansible.builtin.file:
    path: /etc/dnsmasq.d/fort-wow.conf
    state: absent
  notify: restart dnsmasq

- name: Open DNS to the LAN source range
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port port=53
      protocol={{ item }} accept
    permanent: true
    immediate: true
    state: enabled
  loop: [udp, tcp]

- name: Enable the private DNS service
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started

- name: Apply DNS configuration before validation
  ansible.builtin.meta: flush_handlers

- name: Verify private DNS resolves through the canonical service address
  ansible.builtin.command: >-
    dig +short +time=2 +tries=2 @{{ ansible_host }}
    jellyfin.{{ service_domain }}
  register: media_dns_gate
  changed_when: false
  failed_when: ansible_host not in media_dns_gate.stdout
  check_mode: false

- name: Configure Caddy access layer
  when: media_access_layer | default('manual') == 'caddy'
  block:
    - name: Allow Caddy to connect to proxied backends under SELinux
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Open Caddy HTTPS to the LAN source range
      ansible.posix.firewalld:
        rich_rule: >-
          rule family=ipv4 source address={{ lan_cidr }} port port=443
          protocol=tcp accept
        permanent: true
        immediate: true
        state: enabled

    - name: Ensure Let's Encrypt hook directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/letsencrypt, mode: "0755" }
        - { path: /etc/letsencrypt/renewal-hooks, mode: "0755" }
        - { path: /etc/letsencrypt/renewal-hooks/deploy, mode: "0755" }

    - name: Render Cloudflare DNS credentials for Certbot
      ansible.builtin.template:
        src: cloudflare.ini.j2
        dest: /etc/letsencrypt/cloudflare.ini
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Install the Certbot Caddy deploy hook
      ansible.builtin.template:
        src: certbot-deploy-caddy.sh.j2
        dest: /etc/letsencrypt/renewal-hooks/deploy/caddy.sh
        owner: root
        group: root
        mode: "0755"

    - name: Obtain the Let's Encrypt wildcard certificate
      ansible.builtin.command:
        cmd: >-
          certbot certonly --non-interactive --agree-tos
          -m {{ acme_email }}
          --dns-cloudflare
          --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
          --dns-cloudflare-propagation-seconds 30
          -d "*.{{ service_domain }}"
        creates: /etc/letsencrypt/live/{{ service_domain }}/fullchain.pem
      when: not ansible_check_mode

    - name: Ensure the Caddy certificate directory exists
      ansible.builtin.file:
        path: /etc/caddy/certs
        state: directory
        owner: root
        group: caddy
        mode: "0750"

    - name: Install the Let's Encrypt full chain for Caddy
      ansible.builtin.copy:
        src: /etc/letsencrypt/live/{{ service_domain }}/fullchain.pem
        dest: /etc/caddy/certs/fullchain.pem
        remote_src: true
        owner: root
        group: caddy
        mode: "0640"
      notify: restart caddy
      when: not ansible_check_mode

    - name: Install the Let's Encrypt private key for Caddy
      ansible.builtin.copy:
        src: /etc/letsencrypt/live/{{ service_domain }}/privkey.pem
        dest: /etc/caddy/certs/privkey.pem
        remote_src: true
        owner: root
        group: caddy
        mode: "0640"
      notify: restart caddy
      when: not ansible_check_mode

    - name: Enable automatic Let's Encrypt renewal
      ansible.builtin.systemd:
        name: certbot-renew.timer
        enabled: true
        state: started
      when: not ansible_check_mode

    # Renewal is automatic; noticing that it stopped working is not. The
    # watcher reads the certificate on disk, so it catches a renewal that
    # errored, one that silently wrote nothing, and a certbot timer that was
    # disabled by hand — all of which look identical until HTTPS breaks.
    - name: Install the certificate expiry watcher
      ansible.builtin.template:
        src: certwatch.sh.j2
        dest: /usr/local/sbin/homelab-certwatch.sh
        owner: root
        group: root
        mode: "0750"

    - name: Install the certificate expiry watcher units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - homelab-certwatch.service
        - homelab-certwatch.timer
      register: media_certwatch_units

    - name: Enable the certificate expiry watcher
      ansible.builtin.systemd:
        name: homelab-certwatch.timer
        enabled: true
        state: started
        daemon_reload: "{{ media_certwatch_units is changed }}"
      when: not ansible_check_mode

    - name: Render Caddy configuration from service catalogs
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
        validate: "caddy validate --adapter caddyfile --config %s"
      notify: restart caddy

    - name: Enable Caddy
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started

    - name: Apply Caddy configuration before validation
      ansible.builtin.meta: flush_handlers

- name: Note a deliberately disabled Caddy layer
  ansible.builtin.debug:
    msg: "Caddy skipped (media_access_layer={{ media_access_layer | default('manual') }})."
  when: media_access_layer | default('manual') != 'caddy'
