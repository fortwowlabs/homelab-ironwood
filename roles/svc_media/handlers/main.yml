---
- name: Reload root systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: reload systemd

- name: Reload homelab user systemd
  ansible.builtin.command: systemctl --user -M homelab@ daemon-reload
  changed_when: true
  listen: media configuration changed

- name: Restart only changed media services
  ansible.builtin.command: "systemctl --user -M homelab@ restart {{ item }}.service"
  loop: "{{ media_services_to_restart | default([]) }}"
  changed_when: true
  listen: media configuration changed

- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
  listen: restart dnsmasq

- name: Restart caddy
  ansible.builtin.systemd:
    name: caddy
    state: restarted
  listen: restart caddy

- name: Restart Homepage after catalog changes
  ansible.builtin.command: systemctl --user -M homelab@ restart homepage.service
  changed_when: true
  when: not ansible_check_mode
  listen: restart homepage
