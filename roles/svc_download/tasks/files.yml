---
- name: Ensure download configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containers/systemd
    - /etc/nftables
    - /etc/wireguard
    - /etc/netns/vpn

- name: Calculate the catalog-managed unit paths that should exist
  vars:
    proxy_app_names: >-
      {{ download_apps | dict2items | selectattr('value.proxy') | map(attribute='key') | list }}
  ansible.builtin.set_fact:
    # A single bare `{{ expr }}` template (no {% %} statements) is evaluated
    # as one native expression and returns a real list. The equivalent
    # {% set %}/{% for %}/append idiom instead renders the WHOLE block as
    # text, so set_fact stores a *string* repr of a list (leading whitespace
    # and all) — list.difference() against that string then iterates its
    # characters instead of paths, so nothing is ever excluded and every
    # catalog-managed unit is (mis)treated as stale on every run.
    download_expected_quadlet_paths: >-
      {{ download_apps.keys() | map('regex_replace', '^(.*)$', '/etc/containers/systemd/dl-\1.container') | list }}
    download_expected_proxy_socket_paths: >-
      {{ proxy_app_names | map('regex_replace', '^(.*)$', '/etc/systemd/system/\1-proxy.socket') | list }}
    download_expected_proxy_service_paths: >-
      {{ proxy_app_names | map('regex_replace', '^(.*)$', '/etc/systemd/system/\1-proxy.service') | list }}
  changed_when: false

- name: Discover catalog-managed download Quadlets
  ansible.builtin.find:
    paths: /etc/containers/systemd
    patterns: "dl-*.container"
    file_type: file
    contains: '^# homelab-iac catalog-managed$'
  register: download_managed_quadlets
  check_mode: false

- name: Discover catalog-managed proxy sockets
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "*-proxy.socket"
    file_type: file
    contains: '^# homelab-iac catalog-managed$'
  register: download_managed_proxy_sockets
  check_mode: false

- name: Discover catalog-managed proxy services
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "*-proxy.service"
    file_type: file
    contains: '^# homelab-iac catalog-managed$'
  register: download_managed_proxy_services
  check_mode: false

- name: Calculate stale catalog-managed unit paths
  ansible.builtin.set_fact:
    download_stale_quadlet_paths: >-
      {{
        download_managed_quadlets.files | map(attribute='path') | list
        | difference(download_expected_quadlet_paths)
      }}
    download_stale_proxy_socket_paths: >-
      {{
        download_managed_proxy_sockets.files | map(attribute='path') | list
        | difference(download_expected_proxy_socket_paths)
      }}
    download_stale_proxy_service_paths: >-
      {{
        download_managed_proxy_services.files | map(attribute='path') | list
        | difference(download_expected_proxy_service_paths)
      }}
  changed_when: false

- name: Stop stale catalog-managed applications
  ansible.builtin.systemd:
    name: "{{ item | basename | regex_replace('\\.container$', '.service') }}"
    state: stopped
  loop: "{{ download_stale_quadlet_paths }}"

- name: Stop and disable stale catalog-managed proxy sockets
  ansible.builtin.systemd:
    name: "{{ item | basename }}"
    state: stopped
    enabled: false
  loop: "{{ download_stale_proxy_socket_paths }}"

- name: Stop stale catalog-managed proxy services
  ansible.builtin.systemd:
    name: "{{ item | basename }}"
    state: stopped
  loop: "{{ download_stale_proxy_service_paths }}"

- name: Remove stale catalog-managed unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      download_stale_quadlet_paths
      + download_stale_proxy_socket_paths
      + download_stale_proxy_service_paths
    }}
  notify: reload systemd

- name: Install VPN namespace lifecycle scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0750"
  loop:
    - vpn-netns-up.sh
    - vpn-netns-down.sh
  notify: restart vpn-netns when active

- name: Install the Mullvad endpoint refresh helper
  ansible.builtin.copy:
    src: refresh-mullvad-endpoints.sh
    dest: /usr/local/sbin/refresh-mullvad-endpoints.sh
    mode: "0750"

- name: Render operational scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - leak-canary.sh
    - backup-dl-appdata.sh

- name: Ensure persistent canary state directory exists
  ansible.builtin.file:
    path: /var/lib/leak-canary
    state: directory
    mode: "0750"

- name: Install the VPN namespace unit
  ansible.builtin.copy:
    src: vpn-netns.service
    dest: /etc/systemd/system/vpn-netns.service
    mode: "0644"
  notify:
    - reload systemd
    - restart vpn-netns when active

- name: Install download timers and oneshot units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - leak-canary.service
    - leak-canary.timer
    - backup-dl-appdata.service
    - backup-dl-appdata.timer
  notify: reload systemd

- name: Render application proxy sockets
  ansible.builtin.template:
    src: proxy.socket.j2
    dest: "/etc/systemd/system/{{ item.key }}-proxy.socket"
    mode: "0644"
  loop: "{{ download_apps | dict2items | selectattr('value.proxy') | list }}"
  loop_control:
    label: "{{ item.key }}-proxy.socket"
  register: download_proxy_socket_templates
  notify: reload systemd

- name: Render application proxy services
  ansible.builtin.template:
    src: proxy.service.j2
    dest: "/etc/systemd/system/{{ item.key }}-proxy.service"
    mode: "0644"
  loop: "{{ download_apps | dict2items | selectattr('value.proxy') | list }}"
  loop_control:
    label: "{{ item.key }}-proxy.service"
  register: download_proxy_service_templates
  notify: reload systemd

- name: Render download Quadlets from the application catalog
  ansible.builtin.template:
    src: download.container.j2
    dest: "/etc/containers/systemd/dl-{{ item.key }}.container"
    mode: "0644"
  loop: "{{ download_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: download_quadlet_templates
  notify: reload systemd

- name: Render strict nftables backstop
  ansible.builtin.template:
    src: host-backstop.nft.j2
    dest: /etc/nftables/host-backstop.nft
    mode: "0644"
  notify: reload host-backstop

- name: Seed dynamic Mullvad endpoint file
  ansible.builtin.copy:
    src: mullvad-endpoints.nft.seed
    dest: /etc/nftables/mullvad-endpoints.nft
    mode: "0644"
    force: false

- name: Configure network-namespace DNS
  ansible.builtin.copy:
    dest: /etc/netns/vpn/resolv.conf
    content: "nameserver {{ mullvad_dns }}\n"
    mode: "0644"

- name: Create catalog application data directories
  ansible.builtin.file:
    path: "/srv/appdata/{{ item.key }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop: "{{ download_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create SABnzbd local incomplete-download directory
  ansible.builtin.file:
    path: /var/lib/sabnzbd-incomplete
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

# SABnzbd has its own anti-DNS-rebinding allowlist and returns
# "403 Access denied - Hostname verification failed" for any Host header it does
# not recognise. Left alone it whitelists only the container's own hostname —
# a random hex string that CHANGES every time the container is recreated — so
# https://sabnzbd.<domain> is permanently broken even though the service is
# published, DNS-named and tiled on the dashboard. Not a one-off: an image
# update silently re-breaks it.
#
# lineinfile on exactly this key, never a template: sabnzbd.ini also holds the
# Usenet provider credentials, and regenerating the file would destroy them.
- name: Read SABnzbd's configuration if it exists
  ansible.builtin.slurp:
    src: /srv/appdata/sabnzbd/sabnzbd.ini
  register: download_sabnzbd_ini
  failed_when: false

- name: Determine whether SABnzbd already trusts its proxied hostname
  ansible.builtin.set_fact:
    download_sabnzbd_whitelist_ok: >-
      {{ download_sabnzbd_ini.content is defined
         and (download_sabnzbd_ini.content | b64decode)
             is search('(?m)^host_whitelist\s*=.*sabnzbd\.' ~ (service_domain | regex_escape)) }}

# Set it through SABnzbd's own API rather than editing the file underneath it.
# Two reasons: SABnzbd rewrites sabnzbd.ini from memory on shutdown, so a
# file edit made while it runs is silently discarded; and stopping the unit is
# not actually possible here — the jail's dependency chain cancels the job
# ("Job for dl-sabnzbd.service canceled"). The API writes through to the ini
# immediately and needs no restart.
#
# SABnzbd listens inside the VPN network namespace, so the call has to be made
# from inside it. The API key is read from the ini the same way Recyclarr reads
# Sonarr/Radarr's — no_log throughout so it never reaches the log.
- name: Read SABnzbd's API key
  ansible.builtin.set_fact:
    download_sabnzbd_api_key: >-
      {{ (download_sabnzbd_ini.content | b64decode)
         | regex_search('(?m)^api_key\s*=\s*([a-f0-9]+)', '\1') | first | default('') }}
  when: download_sabnzbd_ini.content is defined
  no_log: true

- name: Trust the proxied hostname in SABnzbd's host allowlist
  ansible.builtin.command:
    argv:
      - ip
      - netns
      - exec
      - vpn
      - curl
      - --fail
      - --silent
      - --max-time
      - "15"
      - --get
      - --data-urlencode
      - "apikey={{ download_sabnzbd_api_key }}"
      - --data-urlencode
      - mode=set_config
      - --data-urlencode
      - section=misc
      - --data-urlencode
      - keyword=host_whitelist
      - --data-urlencode
      - "value=sabnzbd.{{ service_domain }}"
      - --data-urlencode
      - output=json
      - http://10.77.0.2:8080/api
  when:
    - download_sabnzbd_ini.content is defined
    - not download_sabnzbd_whitelist_ok
    - (download_sabnzbd_api_key | default('')) | length > 0
  changed_when: true
  no_log: true

- name: Ensure the Beszel agent appdata directory exists
  ansible.builtin.file:
    path: /srv/appdata/beszel-agent
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: beszel_agent_enabled | bool

- name: Render the Beszel agent Quadlet
  ansible.builtin.template:
    src: beszel-agent.container.j2
    dest: /etc/containers/systemd/beszel-agent.container
    # 0600: this quadlet embeds the Beszel TOKEN/KEY on Environment= lines.
    mode: "0600"
  register: download_beszel_agent_template
  when: beszel_agent_enabled | bool
  no_log: true
  diff: false
  notify: reload systemd

- name: WARN that the Beszel agent is not yet configured
  ansible.builtin.debug:
    msg: >-
      *** WARNING: the Beszel token and key are empty — the
      Beszel agent on {{ inventory_hostname }} is NOT deployed. Visit
      https://beszel.{{ service_domain }}, create a universal token under
      Settings > Tokens, fill both vault vars, and re-run the deploy. See
      docs/services.md "Beszel monitoring setup". ***
  when: not (beszel_agent_enabled | bool)

- name: Render the node_exporter Quadlet
  # Rootful, init ns (not the VPN jail), like beszel-agent here. Scraped by
  # Prometheus on svc-infra; the host-backstop nftables input chain opens
  # :9100 to that single source address (see host-backstop.nft.j2).
  ansible.builtin.template:
    src: node-exporter.container.j2
    dest: /etc/containers/systemd/node-exporter.container
    mode: "0644"
  register: download_node_exporter_template
  notify: reload systemd

- name: Ensure the SearXNG appdata directory exists
  ansible.builtin.file:
    path: /srv/appdata/searxng
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

# roles/svc_infra has this guard driven by each catalog entry's require_vault
# list (see the assert in its files.yml); download_apps has no such field, so
# the one secret in this role gets the bespoke form the repo already uses for
# the Minecraft RCON password in roles/svc_media/tasks/files.yml.
#
# The REPLACE_ half is the part that matters. A var still holding its
# all_vault.yml.example placeholder is non-empty, so a length test alone lets it
# through and deploys a secret_key that is published in this repository. That is
# a rebuild-from-bare-clone failure: the vault is gitignored, so anyone
# reconstructing the estate fills in the vars the deploy complains about, and
# silently keeps the placeholder for every var it does not.
- name: Require the SearXNG secret key
  ansible.builtin.assert:
    that:
      - (vault_searxng_secret | default('')) | string | length > 0
      - not ((vault_searxng_secret | default('')) | string is match('REPLACE_'))
    fail_msg: >-
      vault_searxng_secret is empty or still set to its all_vault.yml.example
      REPLACE_* placeholder. Generate one with `openssl rand -hex 32` and put it
      in the vault; a known secret_key lets anyone forge SearXNG session state.
  no_log: true
  diff: false

- name: Render SearXNG's settings
  # Owned by svc_uid, not root, even though the container runs as root (this
  # image sets no USER and its entrypoint does not drop privileges). The
  # nightly appdata backup tars /srv/appdata as the homelab user, so a
  # root-owned 0600 file fails the whole archive; root reads it either way.
  ansible.builtin.template:
    src: searxng-settings.yml.j2
    dest: /srv/appdata/searxng/settings.yml
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this file carries server.secret_key.
    mode: "0600"
  register: download_searxng_settings
  no_log: true
  diff: false

- name: Ensure the Recyclarr appdata directory exists
  ansible.builtin.file:
    path: /srv/appdata/recyclarr
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

- name: Check for Sonarr/Radarr config.xml (source of Recyclarr's API keys)
  ansible.builtin.stat:
    path: "/srv/appdata/{{ item }}/config.xml"
  loop: [sonarr, radarr]
  register: download_recyclarr_config_stats

- name: Read Sonarr/Radarr config.xml for Recyclarr's API keys
  ansible.builtin.slurp:
    src: "/srv/appdata/{{ item.item }}/config.xml"
  loop: "{{ download_recyclarr_config_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  register: download_recyclarr_config_raw
  no_log: true

- name: Determine whether Recyclarr's prerequisites are met
  ansible.builtin.set_fact:
    download_recyclarr_enabled: >-
      {{ (download_recyclarr_config_stats.results | map(attribute='stat.exists') | select | list | length)
         == (download_recyclarr_config_stats.results | length) }}

- name: Extract Sonarr/Radarr API keys for Recyclarr
  ansible.builtin.set_fact:
    download_recyclarr_sonarr_api_key: >-
      {{ (download_recyclarr_config_raw.results
          | selectattr('item.item', 'equalto', 'sonarr') | first).content
         | b64decode | regex_search('(?<=<ApiKey>)[a-f0-9]+(?=</ApiKey>)') }}
    download_recyclarr_radarr_api_key: >-
      {{ (download_recyclarr_config_raw.results
          | selectattr('item.item', 'equalto', 'radarr') | first).content
         | b64decode | regex_search('(?<=<ApiKey>)[a-f0-9]+(?=</ApiKey>)') }}
  when: download_recyclarr_enabled | bool
  no_log: true

- name: Assert both Recyclarr API keys were actually extracted
  ansible.builtin.assert:
    that:
      - download_recyclarr_sonarr_api_key is regex('^[a-f0-9]+$')
      - download_recyclarr_radarr_api_key is regex('^[a-f0-9]+$')
    fail_msg: >-
      Sonarr or Radarr's config.xml did not contain a readable <ApiKey> (empty
      or mid-write) — refusing to render Recyclarr with a blank/None key.
      Re-run the deploy.
  when: download_recyclarr_enabled | bool
  no_log: true

- name: Render Recyclarr's sync configuration
  ansible.builtin.template:
    src: recyclarr.yml.j2
    dest: /srv/appdata/recyclarr/recyclarr.yml
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  when: download_recyclarr_enabled | bool

- name: Render the Recyclarr Quadlet
  ansible.builtin.template:
    src: recyclarr.container.j2
    dest: /etc/containers/systemd/recyclarr.container
    # 0600: this quadlet embeds the Sonarr/Radarr API keys on Environment= lines.
    mode: "0600"
  register: download_recyclarr_template
  when: download_recyclarr_enabled | bool
  no_log: true
  diff: false
  notify: reload systemd

- name: WARN that Recyclarr is not yet configured
  ansible.builtin.debug:
    msg: >-
      *** WARNING: Sonarr and/or Radarr have not generated a config.xml yet
      (they must have started at least once) — Recyclarr on
      {{ inventory_hostname }} is NOT deployed. Re-run the deploy after
      Sonarr/Radarr are up. ***
  when: not (download_recyclarr_enabled | bool)

- name: Render WireGuard peer configuration
  ansible.builtin.template:
    src: peer.conf.j2
    dest: /etc/wireguard/peer.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: restart vpn-netns when active

- name: Render VPN namespace environment
  ansible.builtin.template:
    src: vpn-netns.env.j2
    dest: /etc/vpn-netns.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: restart vpn-netns when active

- name: Calculate catalog services whose generated units changed
  ansible.builtin.set_fact:
    download_apps_to_restart: >-
      {{
        download_quadlet_templates.results | selectattr('changed')
        | map(attribute='item.key') | list
      }}
    download_proxy_sockets_to_restart: >-
      {{
        download_proxy_socket_templates.results | selectattr('changed')
        | map(attribute='item.key') | list
      }}
    download_proxy_services_to_restart: >-
      {{
        download_proxy_service_templates.results | selectattr('changed')
        | map(attribute='item.key') | list
      }}
  changed_when: >-
    (download_apps_to_restart + download_proxy_sockets_to_restart
     + download_proxy_services_to_restart) | length > 0
