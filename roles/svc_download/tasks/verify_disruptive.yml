---
- name: Capture catalog service state before the fail-closed drill
  ansible.builtin.command: "systemctl is-active dl-{{ item.key }}.service"
  loop: "{{ download_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: download_pre_drill_state
  failed_when: false
  changed_when: false

- name: Capture catalog proxy socket state before the fail-closed drill
  ansible.builtin.command: "systemctl is-active {{ item.key }}-proxy.socket"
  loop: "{{ download_apps | dict2items | selectattr('value.proxy', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: download_pre_drill_proxy_socket_state
  failed_when: false
  changed_when: false

- name: Capture Recyclarr state before the fail-closed drill
  ansible.builtin.command: systemctl is-active recyclarr.service
  register: download_pre_drill_recyclarr_state
  failed_when: false
  changed_when: false

- name: Capture leak-canary timer state before the drill
  ansible.builtin.command: systemctl is-active leak-canary.timer
  register: download_pre_drill_canary_state
  failed_when: false
  changed_when: false

- name: Capture VPN namespace state before the drill
  ansible.builtin.command: systemctl is-active vpn-netns.service
  register: download_pre_drill_vpn_state
  failed_when: false
  changed_when: false

- name: Exercise fail-closed propagation with guaranteed recovery
  block:
    - name: Pause the canary during the intentional outage
      ansible.builtin.systemd:
        name: leak-canary.timer
        state: stopped

    - name: Wait for any in-flight canary check before the intentional outage
      ansible.builtin.command: systemctl is-active leak-canary.service
      register: download_pre_drill_canary_service_state
      changed_when: false
      failed_when: download_pre_drill_canary_service_state.rc not in [0, 3]
      retries: 6
      delay: 5
      until: download_pre_drill_canary_service_state.rc == 3

    - name: Check that no leak flag exists before the drill
      ansible.builtin.stat:
        path: /var/lib/leak-canary/tripped
      register: download_pre_drill_trip_flag

    - name: Refuse to drill while a real leak flag is unresolved
      ansible.builtin.assert:
        that: not download_pre_drill_trip_flag.stat.exists
        fail_msg: >-
          Clear and investigate /var/lib/leak-canary/tripped before running
          an intentional fail-closed drill.

    - name: Pause active catalog proxy sockets during the intentional outage
      ansible.builtin.systemd:
        name: "{{ item.item.key }}-proxy.socket"
        state: stopped
      loop: >-
        {{
          download_pre_drill_proxy_socket_state.results
          | selectattr('stdout', 'equalto', 'active')
          | list
        }}
      loop_control:
        label: "{{ item.item.key }}"

    # THE POSITIVE CONTROL for the fail-closed assertion further down.
    #
    # That assertion is "every dl-* unit is not active after the namespace
    # stops", and on its own it is satisfied by a stack that was already down,
    # or by unit names that do not exist — systemd reports an unknown unit as
    # inactive, so a renamed catalog entry would pass the drill while proving
    # nothing propagated. The claim only means something for units that were
    # demonstrably running a moment ago.
    #
    # Checked here rather than after the fact so a meaningless drill does not
    # get to disrupt anything first.
    - name: Require the drill to have workloads to take down
      ansible.builtin.assert:
        that:
          - >-
            download_pre_drill_state.results
            | selectattr('stdout', 'equalto', 'active') | list | length > 0
        fail_msg: >-
          No catalog dl-* unit was active before the drill, so stopping the VPN
          namespace cannot demonstrate fail-closed propagation — the assertion
          would pass over an empty set. Start the download stack and re-run, or
          find out why it is down.
        quiet: true

    - name: Stop the VPN namespace
      ansible.builtin.systemd:
        name: vpn-netns.service
        state: stopped

    - name: Assert every catalog workload stopped with the namespace
      ansible.builtin.command: "systemctl is-active dl-{{ item.key }}.service"
      loop: "{{ download_apps | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: download_stopped_state
      # Empty stdout as well as rc 0: `systemctl is-active` always names a state
      # when it ran at all, so nothing on stdout means the command itself never
      # ran (missing binary, broken argv) and its nonzero exit says nothing about
      # whether the workload stopped. Same fail-open shape as bare `rc != 0`.
      failed_when: >-
        download_stopped_state.rc == 0
        or (download_stopped_state.stdout | trim) == ''
      changed_when: false

    - name: Inject a drill failure for recovery testing
      ansible.builtin.fail:
        msg: "Injected disruptive-verification failure"
      when: verify_disruptive_inject_failure | default(false) | bool
  always:
    - name: Attempt to restore the VPN namespace when it was previously active
      ansible.builtin.systemd:
        name: vpn-netns.service
        state: started
      when: download_pre_drill_vpn_state.stdout == 'active'
      register: download_restore_vpn_attempt
      failed_when: false

    - name: Attempt to restore workloads that were previously active
      ansible.builtin.systemd:
        name: "dl-{{ item.item.key }}.service"
        state: started
      loop: "{{ download_pre_drill_state.results | selectattr('stdout', 'equalto', 'active') | list }}"
      loop_control:
        label: "{{ item.item.key }}"
      register: download_restore_app_attempts
      failed_when: false

    - name: Attempt to restore Recyclarr when it was previously active
      ansible.builtin.systemd:
        name: recyclarr.service
        state: started
      when: download_pre_drill_recyclarr_state.stdout == 'active'
      register: download_restore_recyclarr_attempt
      failed_when: false

    - name: Attempt to restore proxy sockets that were previously active
      ansible.builtin.systemd:
        name: "{{ item.item.key }}-proxy.socket"
        state: started
      loop: >-
        {{
          download_pre_drill_proxy_socket_state.results
          | selectattr('stdout', 'equalto', 'active')
          | list
        }}
      loop_control:
        label: "{{ item.item.key }}"
      register: download_restore_proxy_socket_attempts
      failed_when: false

    - name: Attempt to restore the leak-canary timer when it was previously active
      ansible.builtin.systemd:
        name: leak-canary.timer
        state: started
      when: download_pre_drill_canary_state.stdout == 'active'
      register: download_restore_timer_attempt
      failed_when: false

    - name: Read restored VPN namespace state
      ansible.builtin.command: systemctl is-active vpn-netns.service
      when: download_pre_drill_vpn_state.stdout == 'active'
      register: download_post_drill_vpn_state
      failed_when: false
      changed_when: false

    - name: Read restored workload states
      ansible.builtin.command: "systemctl is-active dl-{{ item.item.key }}.service"
      loop: "{{ download_pre_drill_state.results | selectattr('stdout', 'equalto', 'active') | list }}"
      loop_control:
        label: "{{ item.item.key }}"
      register: download_post_drill_app_states
      failed_when: false
      changed_when: false

    - name: Read restored Recyclarr state
      ansible.builtin.command: systemctl is-active recyclarr.service
      when: download_pre_drill_recyclarr_state.stdout == 'active'
      register: download_post_drill_recyclarr_state
      failed_when: false
      changed_when: false

    - name: Read restored proxy socket states
      ansible.builtin.command: "systemctl is-active {{ item.item.key }}-proxy.socket"
      loop: >-
        {{
          download_pre_drill_proxy_socket_state.results
          | selectattr('stdout', 'equalto', 'active')
          | list
        }}
      loop_control:
        label: "{{ item.item.key }}"
      register: download_post_drill_proxy_socket_states
      failed_when: false
      changed_when: false

    - name: Read restored leak-canary timer state
      ansible.builtin.command: systemctl is-active leak-canary.timer
      when: download_pre_drill_canary_state.stdout == 'active'
      register: download_post_drill_timer_state
      failed_when: false
      changed_when: false

    - name: Check that the drill introduced no persistent leak flag
      ansible.builtin.stat:
        path: /var/lib/leak-canary/tripped
      register: download_post_drill_trip_flag

    - name: Assert every previously active service was restored
      ansible.builtin.assert:
        that:
          - >-
            download_pre_drill_vpn_state.stdout != 'active'
            or (download_post_drill_vpn_state.rc | default(1)) == 0
          - >-
            download_post_drill_app_states.results | default([])
            | rejectattr('rc', 'equalto', 0) | list | length == 0
          - >-
            download_pre_drill_recyclarr_state.stdout != 'active'
            or (download_post_drill_recyclarr_state.rc | default(1)) == 0
          - >-
            download_post_drill_proxy_socket_states.results | default([])
            | rejectattr('rc', 'equalto', 0) | list | length == 0
          - >-
            download_pre_drill_canary_state.stdout != 'active'
            or (download_post_drill_timer_state.rc | default(1)) == 0
          - not download_post_drill_trip_flag.stat.exists
        fail_msg: >-
          The recovery path attempted every prior service, but at least one
          service is still inactive or the drill introduced a canary trip.
