---
- name: Assert the download application catalog is populated
  ansible.builtin.assert:
    that:
      - download_apps is mapping
      - download_apps | length > 0
      - download_apps.sabnzbd is defined

- name: Verify systemd-socket-proxyd is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/systemd-socket-proxyd
  register: download_proxyd
  failed_when: not download_proxyd.stat.exists

# The host backstop intentionally blocks routine repository egress. Letting
# dnf-makecache.timer run outside the guarded maintenance window guarantees a
# failed unit after boot even though package state is healthy. Operators still
# get explicit, fail-closed package installation through service_vm/packages.
- name: Disable automatic DNF metadata refresh outside maintenance windows
  ansible.builtin.systemd:
    name: dnf-makecache.timer
    enabled: false
    state: stopped
    masked: true

- name: Clear stale automatic DNF metadata refresh failures
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - dnf-makecache.service
      - dnf-makecache.timer
  changed_when: false
  failed_when: false
