---
- name: Verify VPN namespace egress identity
  ansible.builtin.command: ip netns exec vpn curl -4 --max-time 15 https://am.i.mullvad.net/connected
  register: download_mullvad_jail
  changed_when: false
  failed_when: "'You are connected to Mullvad' not in download_mullvad_jail.stdout"

- name: Verify the strict host output policy is loaded
  ansible.builtin.command: nft list chain inet host_backstop output
  register: download_host_output_policy
  changed_when: false
  failed_when: >-
    'policy drop' not in
    (download_host_output_policy.stdout | regex_replace('\\s+', ' '))

- name: Verify firewalld remains inactive beside the nftables owner
  ansible.builtin.command: systemctl is-active firewalld.service
  register: download_verify_firewalld_state
  changed_when: false
  failed_when: download_verify_firewalld_state.rc not in [3, 4]

- name: Verify automatic DNF metadata refresh remains masked
  ansible.builtin.command: systemctl is-enabled dnf-makecache.timer
  register: download_dnf_makecache_timer
  changed_when: false
  failed_when: download_dnf_makecache_timer.stdout != "masked"

# THE POSITIVE CONTROL for the egress fence below, and the reason it needs one.
#
# The fence asserts `rc != 0` on a curl to 1.1.1.1, and reads that as proof the
# nftables backstop dropped it. But EVERY nonzero exit satisfies that: curl not
# installed (127), a flag this curl build does not know (2), the argv wrong, the
# module erroring before it ever ran. "curl is missing" would read as "the
# firewall works" — the same shape as the port sweep that reported one open port
# where eleven were open, and it fails in the safe-looking direction.
#
# The control is the LAN ntfy on the media host. host-backstop.nft opens exactly
# that host and port in the output chain, deliberately, so the leak canary's
# alert can leave the init namespace — it is the one destination the init ns is
# SUPPOSED to reach, and ntfy answers /v1/health unauthenticated. Same binary,
# same flags, same namespace as the fence; only the URL differs. If this cannot
# get out, the fence's silence means nothing.
#
# The fence's own 1.1.1.1 stays numeric for a related reason: the resolver is
# dnsmasq on the media host and this table drops DNS, so a hostname there would
# fail to resolve and pass the fence without the firewall doing anything.
- name: Probe a permitted destination with the egress fence's own curl
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=2
      - "10"
      - curl
      - -4
      - --insecure
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --connect-timeout
      - "2"
      - --max-time
      - "5"
      - "{{ ntfy_url }}/v1/health"
  register: download_host_egress_control
  changed_when: false
  # Never fail here: the assert below owns the message, so "curl exited 127"
  # arrives as an explanation rather than a bare nonzero rc.
  failed_when: false
  # Read-only, and the assert below dereferences its rc — under --check a
  # skipped command would leave that undefined and take the assert with it.
  check_mode: false

- name: Require the egress probe to reach what the backstop permits
  ansible.builtin.assert:
    that:
      # The accept for this destination is only rendered when ntfy_url points at
      # the media host (see host-backstop.nft.j2). Pointed anywhere else it is
      # not a permitted destination and cannot serve as the control.
      - (ntfy_url | urlsplit('hostname')) == hostvars[media_host].ansible_host
      - download_host_egress_control.rc == 0
    fail_msg: >-
      The egress probe could not reach {{ ntfy_url }}/v1/health
      (rc={{ download_host_egress_control.rc | default('unknown') }}), which the
      host backstop explicitly permits so the leak canary can alert. Either that
      path is broken — in which case leak alerts are not leaving this host — or
      curl/timeout is missing and the fence below proves nothing about the
      firewall. Fix this before believing the next task.
    quiet: true

- name: Verify numeric HTTPS egress from the host remains fenced
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=2
      - "10"
      - curl
      - -4
      - --insecure
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --connect-timeout
      - "2"
      - --max-time
      - "5"
      - https://1.1.1.1/
  register: download_host_egress
  changed_when: false
  failed_when: download_host_egress.rc == 0

# Three call sites open a temporary hole in the backstop for DNS and 80/443 —
# service_vm packages.yml, service_vm scan.yml, svc_download images.yml — and
# each closes it from an `always:` block. That covers a task failing. It does not
# cover the process being killed: homelab-scan@.service carries
# TimeoutStartSec=3600, and when systemd hits it ansible-playbook takes SIGTERM
# and no always: block runs. The window then stays open with the state file as
# the only trace, and nothing looked at it.
#
# So `make verify` looks. The state file lives on /run (tmpfs), so a reboot
# clears it and this cannot report a stale window from a previous boot — the
# corollary being that a reboot also silently closes a hole nobody noticed.
- name: Check whether a maintenance egress window was left open
  ansible.builtin.stat:
    path: /run/homelab-maintenance-egress.open
  register: download_maintenance_egress_window
  check_mode: false

- name: Assert the maintenance egress window is closed
  ansible.builtin.assert:
    that:
      - not download_maintenance_egress_window.stat.exists
    fail_msg: >-
      /run/homelab-maintenance-egress.open exists: the download jail's nftables
      backstop is still carrying the temporary DNS and 80/443 accepts that
      maintenance opens. The init namespace has general internet egress right
      now, which is the exact condition the backstop exists to prevent. Close it
      with `/usr/local/sbin/homelab-maintenance-egress close` and find out which
      run was interrupted — a killed scan or package task is the usual cause.
    quiet: true

- name: Verify every catalog container is in the VPN namespace
  ansible.builtin.shell: |
    set -euo pipefail
    pid=$(podman inspect -f '{% raw %}{{.State.Pid}}{% endraw %}' {{ item.key | quote }})
    test "$pid" -gt 0
    test "$(stat -Lc %i /proc/$pid/ns/net)" = "$(stat -Lc %i /run/netns/vpn)"
  args:
    executable: /bin/bash
  loop: "{{ download_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

- name: Verify every catalog UI proxy socket is active
  ansible.builtin.command: "systemctl is-active {{ item.key }}-proxy.socket"
  loop: "{{ download_apps | dict2items | selectattr('value.proxy') | list }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

- name: Verify every catalog UI proxy answers
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ item.value.ui_port }}"
    status_code: [200, 301, 302, 303, 401, 403]
    timeout: 5
  loop: "{{ download_apps | dict2items | selectattr('value.proxy') | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: download_proxy_gate
  retries: 3
  delay: 5
  until: download_proxy_gate is not failed

- name: Verify Shelfmark's application health endpoint
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ download_apps.shelfmark.ui_port }}/api/health"
    status_code: 200
    timeout: 30
  register: download_shelfmark_health
  retries: 6
  delay: 10
  until: download_shelfmark_health.status == 200

- name: Verify Shelfmark can write its config and delivery destinations
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --user
      - appuser
      - shelfmark
      - sh
      - -c
      - >-
        config_probe=/config/.homelab-verify;
        books_probe=/books/.homelab-verify;
        audio_probe=/data/audiobooks/.homelab-verify;
        trap 'rm -f "$config_probe" "$books_probe" "$audio_probe"' EXIT;
        touch "$config_probe" "$books_probe" "$audio_probe"
  register: download_shelfmark_write_gate
  changed_when: false
  retries: 6
  delay: 10
  until: download_shelfmark_write_gate is not failed

- name: Verify Mullvad from inside a workload
  ansible.builtin.command: podman exec sabnzbd curl -4 -s --max-time 15 https://am.i.mullvad.net/connected
  register: download_mullvad_container
  changed_when: false
  failed_when: "'You are connected to Mullvad' not in download_mullvad_container.stdout"

- name: Verify Mullvad from inside Shelfmark
  ansible.builtin.command: podman exec shelfmark curl -4 -s --max-time 15 https://am.i.mullvad.net/connected
  register: download_shelfmark_mullvad
  changed_when: false
  failed_when: "'You are connected to Mullvad' not in download_shelfmark_mullvad.stdout"

- name: Run continuous leak canary immediately
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - >-
        set -a; source /etc/homelab-notify.env;
        exec /usr/local/sbin/leak-canary.sh
  register: download_canary
  changed_when: false
  no_log: true
  diff: false

- name: Find fresh nonempty catalog backup artifacts
  ansible.builtin.command:
    argv:
      - find
      - "/srv/backups/{{ inventory_hostname }}"
      - -maxdepth
      - "1"
      - -type
      - f
      - -size
      - +0c
      - -mtime
      - "-2"
      - -name
      - "{{ item }}-*.tar.gz"
      - -print
      - -quit
  loop: >-
    {{ download_apps | dict2items | map(attribute='value.backup_paths')
       | list | flatten | unique | list }}
  loop_control:
    label: "{{ item }}"
  register: download_backup_artifact_gates
  changed_when: false

- name: Assert every catalog backup artifact is fresh and nonempty
  ansible.builtin.assert:
    that:
      - >-
        download_backup_artifact_gates.results
        | selectattr('stdout', 'equalto', '') | list | length == 0
    fail_msg: >-
      A fresh nonempty download appdata backup is missing. Inspect
      backup-dl-appdata.service and the NFS backup mount.

- name: Validate every catalog backup archive
  ansible.builtin.command:
    argv: [tar, -tzf, "{{ item.stdout }}"]
  loop: "{{ download_backup_artifact_gates.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false

- name: Verify the Beszel agent is active
  ansible.builtin.command: systemctl is-active beszel-agent.service
  changed_when: false
  when: beszel_agent_enabled | bool

- name: Check whether Recyclarr is deployed
  # Independent of download_recyclarr_enabled (a files.yml runtime fact): the
  # standalone verify.yml playbook never runs files.yml, only this tasks_from
  # (same reason download_expected_quadlet_paths isn't reused here either).
  ansible.builtin.stat:
    path: /etc/containers/systemd/recyclarr.container
  register: download_recyclarr_quadlet_stat
  check_mode: false

- name: Verify Recyclarr is active
  ansible.builtin.command: systemctl is-active recyclarr.service
  changed_when: false
  when: download_recyclarr_quadlet_stat.stat.exists

- name: Verify node_exporter metrics
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: node-exporter

- name: Verify the system has no failed services
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: failed-units

- name: Mark download verification complete
  ansible.builtin.set_fact:
    svc_download_verified: true
