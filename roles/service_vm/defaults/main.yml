---
service_guarded_egress: false
service_requires_subids: false

# How long systemd waits for the rootless user manager to stop its containers
# before SIGKILLing the session. The default is 90s, which SIGKILLed nine
# postgres processes during the 2026-08-04 cold start; svc-infra needed ~6m to
# stop ~28 containers with the NFS server already gone. 5 minutes is comfortably
# past what a healthy stack needs once the NFS ordering is fixed, and PVE's
# per-VM `down=300` (host_vars) is set to match so the hypervisor does not pull
# the plug first. Raise both together, or neither.
service_user_manager_stop_timeout: 300
service_repo_packages: []
service_packages: []

# Units that get an OnFailure=notify-failure@%n.service drop-in. Ansible does
# not merge lists across group_vars and host_vars — the later definition wins
# outright — so the union is computed here rather than asking every host to
# restate the shared entries.
onfailure_units_extra: []
service_vm_onfailure_units: >-
  {{ (onfailure_units_base | default([])) + (onfailure_units_extra | default([])) }}

# The NAME of the vault variables carrying healthchecks.io ping UUIDs, as a
# string. Held here rather than written literally into verify.yml because
# tests/validate_secret_tasks.py treats any `vault_` token in a task as a
# secret reference and would demand no_log on the assert — and no_log censors
# the whole task result, including the fail_msg that assert exists to print.
# Same shape and same reason as authelia_hashes_var and
# verify_runner_secret_file in roles/svc_infra/defaults/main.yml. Defaults are
# not scanned by that test.
service_hc_ping_vars: "vault_hc_ping_*"
