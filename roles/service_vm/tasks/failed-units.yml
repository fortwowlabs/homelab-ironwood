---
- name: Check for failed system services
  ansible.builtin.command:
    argv:
      - systemctl
      - --failed
      - --no-legend
      - --plain
  register: service_vm_failed_units
  changed_when: false
  failed_when: service_vm_failed_units.stdout | trim | length > 0

- name: Check for failed rootless user services
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - systemctl
      - --user
      - --failed
      - --no-legend
      - --plain
  register: service_vm_failed_user_units
  changed_when: false
  failed_when: service_vm_failed_user_units.stdout | trim | length > 0
  when: "'media_vms' in group_names or 'infra_vms' in group_names"
