---
- name: Check for failed system services
  ansible.builtin.command:
    argv:
      - systemctl
      - --failed
      - --no-legend
      - --plain
  register: service_vm_failed_units
  changed_when: false
  # The rc test is not redundant. Defining failed_when REPLACES the module's
  # own success check, so without it any error that leaves stdout empty reads
  # as a clean host — the command not existing, a wedged dbus, a systemctl
  # that wrote its complaint to stderr. The check would pass at the exact
  # moment it should fire. The stdout test lives in the assert below, after
  # exempt units are separated out.
  failed_when: service_vm_failed_units.rc != 0

# service_vm_failed_units_exempt holds fnmatch globs on the unit name (the
# first field of each line). Each is regex-escaped, its `*` turned back into
# `.*`, and the set anchored as ^(a|b)(\s|$). With no globs the regex is
# empty-guarded: `^()` would match every line and exempt everything.
# tests/validate_failed_units_exempt.py refuses an exemption for any unit
# that has no alerting of its own.
- name: Separate exempt failed system services from real ones
  ansible.builtin.set_fact:
    service_vm_failed_units_exempt_re: >-
      {{ ('^(' + (service_vm_failed_units_exempt | map('regex_escape')
          | map('regex_replace', '\\\*', '.*') | join('|')) + ')(\s|$)')
         if service_vm_failed_units_exempt | length > 0 else '' }}
    service_vm_failed_units_lines: >-
      {{ service_vm_failed_units.stdout_lines | map('trim') | reject('equalto', '') | list }}

- name: Sort failed system services into exempt and real
  ansible.builtin.set_fact:
    service_vm_failed_units_exempted: >-
      {{ service_vm_failed_units_lines | select('match', service_vm_failed_units_exempt_re) | list
         if service_vm_failed_units_exempt_re | length > 0 else [] }}
    service_vm_failed_units_real: >-
      {{ service_vm_failed_units_lines | reject('match', service_vm_failed_units_exempt_re) | list
         if service_vm_failed_units_exempt_re | length > 0 else service_vm_failed_units_lines }}

- name: Report exempt failed system services
  ansible.builtin.debug:
    msg: >-
      Left out of this gate (they alert through their own OnFailure hook, not
      through verify): {{ service_vm_failed_units_exempted }}
  when: service_vm_failed_units_exempted | length > 0

- name: Assert no non-exempt system service has failed
  ansible.builtin.assert:
    that: service_vm_failed_units_real | length == 0
    fail_msg: "Failed system services: {{ service_vm_failed_units_real }}"
    quiet: true

- name: Check for failed rootless user services
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - systemctl
      - --user
      - --failed
      - --no-legend
      - --plain
  register: service_vm_failed_user_units
  changed_when: false
  # Same reasoning as the system check above, and it matters more here: when
  # the homelab user's manager is not running, this command exits nonzero with
  # "Failed to connect to bus" on stderr and nothing on stdout. That is the
  # single most likely six-month unattended failure on these two hosts — every
  # rootless container down — and the stdout-only test called it green.
  failed_when: >-
    service_vm_failed_user_units.rc != 0
    or (service_vm_failed_user_units.stdout | trim | length > 0)
  when: "'media_vms' in group_names or 'infra_vms' in group_names"
