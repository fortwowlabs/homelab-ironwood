---
# Default-credential canary. Report-only: it attempts a login and reports the
# outcome; it never changes a password, and could not — it does not know the
# real one.

- name: Install the credential canary
  ansible.builtin.template:
    src: credential-canary.sh.j2
    dest: /usr/local/sbin/homelab-credential-canary.sh
    owner: root
    group: root
    mode: "0755"

- name: Try each service's shipped default credentials
  ansible.builtin.command: /usr/local/sbin/homelab-credential-canary.sh
  register: service_vm_credential_raw
  changed_when: false
  failed_when: false
  # The probes carry published upstream defaults rather than real credentials,
  # so there is nothing here to leak — but the OUTPUT names which service is
  # accepting one, and that belongs in the report rather than in a deploy log
  # scrolling past on a shared screen.
  no_log: true
  diff: false

# The positive control, and the reason the empty case is a failure rather than
# a zero. The script's last three statements print the JSON envelope
# unconditionally, so an absent or unparseable document means the canary died
# before reaching them — a host with no probes still emits {"checks":[]}. Left
# as a silent `else []` this task would set _ran true over nothing, and the
# report would say the estate accepts no defaults on the strength of a script
# that never ran. Failing here trips the caller's rescue instead, which records
# the canary as not run and escalates.
- name: Require the canary to have produced a parseable result
  ansible.builtin.assert:
    that:
      - (service_vm_credential_raw.stdout | default('')) | trim | length > 0
      - (service_vm_credential_raw.stdout | from_json).checks is sequence
    fail_msg: >-
      The credential canary on {{ inventory_hostname }} produced no parseable
      JSON. That is a broken canary, not a service estate with no default
      credentials left in it.
    quiet: true

- name: Summarise the credential canary
  ansible.builtin.set_fact:
    service_vm_credentials: "{{ (service_vm_credential_raw.stdout | from_json).checks }}"
    service_vm_credentials_ran: true
