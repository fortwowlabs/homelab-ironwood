---
# Default-credential canary. Report-only: it attempts a login and reports the
# outcome; it never changes a password, and could not — it does not know the
# real one.

- name: Install the credential canary
  ansible.builtin.template:
    src: credential-canary.sh.j2
    dest: /usr/local/sbin/homelab-credential-canary.sh
    owner: root
    group: root
    mode: "0755"

- name: Try each service's shipped default credentials
  ansible.builtin.command: /usr/local/sbin/homelab-credential-canary.sh
  register: service_vm_credential_raw
  changed_when: false
  failed_when: false
  # The probes carry published upstream defaults rather than real credentials,
  # so there is nothing here to leak — but the OUTPUT names which service is
  # accepting one, and that belongs in the report rather than in a deploy log
  # scrolling past on a shared screen.
  no_log: true
  diff: false

- name: Summarise the credential canary
  ansible.builtin.set_fact:
    service_vm_credentials: >-
      {{ (service_vm_credential_raw.stdout | default('') | from_json).checks
         if (service_vm_credential_raw.stdout | default('')) | trim | length > 0
         else [] }}
    service_vm_credentials_ran: true
