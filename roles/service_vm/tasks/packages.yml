---
- name: Install guarded-egress helper before any package operation
  ansible.builtin.template:
    src: maintenance-egress.sh.j2
    dest: /usr/local/sbin/homelab-maintenance-egress
    owner: root
    group: root
    mode: "0750"
  when: service_guarded_egress | bool

- name: Gather installed package facts without refreshing repositories
  ansible.builtin.package_facts:
    manager: auto

- name: Calculate missing service packages
  ansible.builtin.set_fact:
    service_missing_repo_packages: >-
      {{ service_repo_packages | difference(ansible_facts.packages.keys() | list) }}
    service_missing_packages: >-
      {{ service_packages | difference(ansible_facts.packages.keys() | list) }}

- name: Install missing service packages
  when: (service_missing_repo_packages + service_missing_packages) | length > 0
  block:
    - name: Open guarded maintenance egress when the backstop is active
      ansible.builtin.command: /usr/local/sbin/homelab-maintenance-egress open
      register: service_egress_open
      changed_when: "'opened' in service_egress_open.stdout"
      when: service_guarded_egress | bool

    - name: Install missing repository packages first
      ansible.builtin.dnf:
        name: "{{ service_missing_repo_packages }}"
        state: present
      when: service_missing_repo_packages | length > 0

    - name: Install missing runtime packages
      ansible.builtin.dnf:
        name: "{{ service_missing_packages }}"
        state: present
      when: service_missing_packages | length > 0
  always:
    - name: Restore and verify strict backstop after package operations
      ansible.builtin.command: /usr/local/sbin/homelab-maintenance-egress close
      register: service_egress_close
      changed_when: "'closed' in service_egress_close.stdout"
      when: service_guarded_egress | bool

# --- Rocky repositories: CDN origin, not the mirrorlist -------------------
#
# THE ACTUAL CAUSE of the dnf-makecache 404s, addressed at the source rather
# than only retried around.
#
# Stock Rocky points baseos/appstream/extras at mirrors.rockylinux.org, which
# returns a plain list of mirror URLs and NOTHING ELSE. dnf fetches repomd.xml
# from whichever mirror it picks, then fetches the data files that repomd names
# by checksum — and if that mirror is mid-rsync, the named primary.xml.gz is
# already gone. 404, with no way to tell a rotating mirror from a broken one.
#
# EPEL on these same hosts never does this, and the reason is instructive: it
# uses `metalink=`, which carries the EXPECTED CHECKSUM of repomd.xml, so
# librepo can recognise a mirror serving something stale and move on. Rocky
# publishes no metalink, so that failover is simply unavailable.
#
# dl.rockylinux.org is the origin every mirror syncs FROM, so it cannot be out
# of sync with itself, and it is not a single machine: it resolved to
# 151.101.146.132 (Fastly) from svc-infra, answering in ~0.12s. It is also
# listed in the mirrorlist Rocky hands out, and the exact baseurl below ships
# COMMENTED OUT in rocky.repo as the supported alternative — this uncomments
# Rocky's own line and upgrades http to https. Not a workaround.
#
# THE TRADE, stated plainly: a single baseurl gives up mirror failover. That is
# accepted because the failure it removes (a mirror out of sync with the repomd
# it just served) is one this estate has actually hit, while the failure it
# adds (Fastly down globally) is rarer and would be visible everywhere at once.
# The retry wrapper below remains as the net for both.
#
# Durability checked, not assumed: both files are flagged `cn` — config +
# noreplace — in rocky-repos, so a package update keeps these edits and drops a
# .rpmnew beside them rather than reverting.
- name: Serve the Rocky repos from the CDN origin instead of a mirrorlist
  ansible.builtin.replace:
    path: "/etc/yum.repos.d/{{ item.file }}"
    # Anchored to end-of-line on `$rltype`, which is what distinguishes the
    # enabled repo from its -debug and -source siblings in the same file.
    regexp: >-
      ^mirrorlist=(https://mirrors\.rockylinux\.org/mirrorlist\?arch=\$basearch&repo={{ item.repo }}-\$releasever\$rltype)$
    replace: '#mirrorlist=\1'
  loop: "{{ rocky_cdn_repos }}"
  loop_control:
    label: "{{ item.section }}"

- name: Uncomment the Rocky CDN baseurl the repo file already ships
  ansible.builtin.replace:
    path: "/etc/yum.repos.d/{{ item.file }}"
    # The trailing `/os/` is what separates this from the debug and source
    # variants, whose paths end /debug/tree/ and /source/tree/.
    regexp: >-
      ^#baseurl=http://dl\.rockylinux\.org/\$contentdir/\$releasever/{{ item.dir }}/\$basearch/os/$
    replace: 'baseurl=https://dl.rockylinux.org/$contentdir/$releasever/{{ item.dir }}/$basearch/os/'
  loop: "{{ rocky_cdn_repos }}"
  loop_control:
    label: "{{ item.section }}"

# Rocky's dnf-makecache.timer runs hourly and fails whenever a mirror rotates a
# repodata file out from under an in-flight fetch — a 404 that clears itself on
# the next run, but not before leaving the unit `failed` for homelab-failedunits
# to report. ~3 alerts a month across svc-media and svc-infra, on the topic that
# is allowed to wake somebody. See docs/plans/ and the script's own header.
#
# KEPT even though the CDN change above removes the known cause. The wrapper
# costs nothing on a healthy run and still covers a Fastly blip, a DNS hiccup
# or any future repo added on a mirrorlist. Removing a net because the last
# known hole was patched is how the next hole goes unnoticed.
#
# Installed on ALL service VMs rather than conditionally. On svc-download it is
# inert — roles/svc_download/tasks/packages.yml masks the timer and that role's
# verify.yml asserts it stays masked — but a conditional here would be a second
# place to keep that fact correct, and this way the protection is already right
# if the mask is ever lifted.
- name: Install the dnf makecache retry wrapper
  ansible.builtin.template:
    src: dnf-makecache-retry.sh.j2
    dest: /usr/local/sbin/dnf-makecache-retry.sh
    owner: root
    group: root
    # 0750 root: only systemd starts this, and it runs as root.
    mode: "0750"

- name: Create the dnf makecache drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnf-makecache.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Retry a transient dnf makecache failure before failing the unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnf-makecache.service.d/10-retry.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/service_vm/tasks/packages.yml).
      #
      # The bare ExecStart= is required, not stylistic: it CLEARS the unit's
      # inherited ExecStart, and without it systemd runs both the original
      # command and the wrapper.
      #
      # TimeoutStartSec is not incidental either. The shipped unit is
      # Type=oneshot with no timeout set, and systemd disables the start
      # timeout entirely for oneshot by default — so a mirror that accepts the
      # connection and then stalls would leave this in `activating` forever.
      # `activating` is not `failed`, so neither homelab-failedunits nor any
      # OnFailure= would ever notice; the unit would simply stop refreshing
      # metadata with every indicator green. That is the same trap
      # roles/svc_infra/files/homelab-alert-canary.service documents. 900s
      # covers two dnf runs plus the retry delay with room to spare.
      [Service]
      ExecStart=
      ExecStart=/usr/local/sbin/dnf-makecache-retry.sh
      TimeoutStartSec=900
  register: service_vm_makecache_dropin

- name: Reload systemd for the dnf makecache drop-in
  ansible.builtin.systemd:
    daemon_reload: true
  when: service_vm_makecache_dropin is changed

- name: Render host notification credentials
  ansible.builtin.template:
    src: notify.env.j2
    dest: /etc/homelab-notify.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

# The ping UUIDs are bearer credentials: anyone holding one can keep a check
# green forever, which is worse than no check at all. Same 0600-root
# treatment as the ntfy token beside it.
#
# svc-download is excluded on purpose. Its nftables backstop permits egress
# only to Mullvad, the NAS, LAN ntfy and Beszel — there is no DNS and no
# outbound 443 — so it cannot reach hc-ping.com by construction. Its backups
# are checked from svc-infra over the shared NFS export instead.
- name: Render healthchecks.io ping credentials
  ansible.builtin.template:
    src: healthchecks.env.j2
    dest: /etc/homelab-healthchecks.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: not (service_guarded_egress | bool)

- name: Install the healthchecks.io ping helper
  ansible.builtin.template:
    src: hc-ping.sh.j2
    dest: /usr/local/sbin/hc-ping.sh
    owner: root
    group: root
    # 0755, not 0750: the nightly verification unit runs as the unprivileged
    # svcops account and must be able to ping. The script holds no secret —
    # the UUID arrives as an argument, and the file it comes from stays
    # 0600 root, injected by systemd's EnvironmentFile before the drop to
    # svcops.
    mode: "0755"
  when: not (service_guarded_egress | bool)
