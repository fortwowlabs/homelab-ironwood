---
# Report-only security scan of the guest OS. Installs NOTHING, restarts
# NOTHING — see tests/validate_scan_readonly.py, which fails the build if a
# scan path ever grows a `dnf upgrade`.
#
# What this measures: how far behind the deliberate no-auto-update policy has
# left this host. docs/unattended.md states the trade plainly ("six months away
# means six months of unpatched containers"), and that is a defensible choice —
# but until now there was no number attached to it anywhere. This produces the
# number, nightly, without changing the policy.

- name: Query pending security errata
  # `updateinfo summary` rather than `list`: the summary is one short block with
  # a count per severity, while `list` emits one line per affected package (22
  # notices expand to ~60 lines on svc-infra today) and would have to be
  # de-duplicated by advisory ID to mean anything.
  #
  # This needs repository metadata, so on svc-download it runs inside the
  # guarded egress window — its nftables backstop denies DNS and 443 outright,
  # and a query against stale cache would silently under-report.
  block:
    - name: Open guarded maintenance egress for the errata query
      ansible.builtin.command: /usr/local/sbin/homelab-maintenance-egress open
      register: service_vm_scan_egress_open
      changed_when: "'opened' in service_vm_scan_egress_open.stdout"
      when: service_guarded_egress | bool

    - name: Read pending security errata
      ansible.builtin.command:
        argv: [dnf, --quiet, updateinfo, summary, --security]
      register: service_vm_errata_raw
      changed_when: false
      # A failed query must NOT look like a clean host. rc is carried into the
      # fact below and turned into an explicit failure state, because "0
      # pending" and "could not ask" are the two readings this whole exercise
      # exists to keep apart.
      failed_when: false
  always:
    - name: Restore the strict backstop after the errata query
      ansible.builtin.command: /usr/local/sbin/homelab-maintenance-egress close
      register: service_vm_scan_egress_close
      changed_when: "'closed' in service_vm_scan_egress_close.stdout"
      when: service_guarded_egress | bool

# Severity words come from the DNF updateinfo vocabulary, not from Rocky: the
# same four appear on any dnf-based distribution. A severity dnf reports that is
# not in this list would be missed by the per-severity counts but still caught
# by `total`, which is parsed from its own line rather than summed from these.
- name: Summarise pending security errata
  ansible.builtin.set_fact:
    service_vm_errata:
      ok: "{{ (service_vm_errata_raw.rc | default(1)) == 0 }}"
      critical: "{{ counts.critical }}"
      important: "{{ counts.important }}"
      moderate: "{{ counts.moderate }}"
      low: "{{ counts.low }}"
      total: "{{ counts.total }}"
      detail: >-
        {{ 'query failed rc=' ~ (service_vm_errata_raw.rc | default('none'))
           if (service_vm_errata_raw.rc | default(1)) != 0
           else 'ok' }}
  vars:
    out: "{{ service_vm_errata_raw.stdout | default('') }}"
    counts:
      # The total line carries no severity word ("22 Security notice(s)"), so
      # this pattern cannot match the indented per-severity lines beneath it —
      # "2 Critical Security notice(s)" has Critical between the digits and the
      # word Security. Parsing it separately rather than summing the four below
      # is deliberate: a severity dnf grows later would be absent from the
      # breakdown but still present in the total, and the report prints both so
      # the discrepancy is visible rather than silently swallowed.
      total: "{{ (out | regex_findall('(\\d+)\\s+Security notice') | first | default('0')) | int }}"
      critical: "{{ (out | regex_findall('(\\d+)\\s+Critical\\s+Security notice') | first | default('0')) | int }}"
      important: "{{ (out | regex_findall('(\\d+)\\s+Important\\s+Security notice') | first | default('0')) | int }}"
      moderate: "{{ (out | regex_findall('(\\d+)\\s+Moderate\\s+Security notice') | first | default('0')) | int }}"
      low: "{{ (out | regex_findall('(\\d+)\\s+Low\\s+Security notice') | first | default('0')) | int }}"

# Default so the aggregation downstream never has to distinguish "absent
# because it is not benchmark day" from "absent because something broke".
#
# Whether it was DUE is recorded here rather than re-derived in scan.yml,
# because that is the distinction the aggregation needs and a second copy of
# this weekday condition over there would be a copy free to drift. The block
# below is gated on the fact, so the condition is written exactly once and the
# fact cannot disagree with what actually happened.
- name: Assume no benchmark ran on this host
  ansible.builtin.set_fact:
    service_vm_oscap: {}
    service_vm_oscap_ran: false
    service_vm_oscap_due: >-
      {{ (scan_oscap_force | default(false) | bool)
         or (ansible_date_time.weekday_number == (scan_oscap_weekday | string)) }}

# Isolated in its own rescue, NOT left to the caller's. scan.yml's per-host
# rescue marks the whole host unscanned and zeroes its errata — so when the
# benchmark's result-counting broke on 2026-07-30, a 620-second evaluation that
# had actually succeeded took the errata figures down with it and all three
# hosts reported NOT SCANNED. The two findings are independent and their
# failures must be too.
- name: Evaluate the OpenSCAP benchmarks
  when: service_vm_oscap_due | bool
  block:
    - name: Run the benchmark evaluation
      ansible.builtin.include_tasks: scan-benchmark.yml
  rescue:
    - name: Record that the benchmark failed without losing the errata scan
      ansible.builtin.set_fact:
        service_vm_oscap: {}
        service_vm_oscap_ran: false

# Both canaries default to "did not run" so the aggregation never has to tell
# "clean" apart from "absent".
- name: Assume neither canary ran on this host
  ansible.builtin.set_fact:
    service_vm_exposure: []
    service_vm_exposure_ran: false
    # Same reasoning as the benchmark's _due above. svc-download is a target
    # twice over and nobody's scanner, so its exposure scan is legitimately
    # absent every night — which must not read the same as svc-infra's dying.
    service_vm_exposure_due: >-
      {{ inventory_hostname in (scan_exposure_pairs | map(attribute='scanner') | list) }}
    service_vm_credentials: []
    service_vm_credentials_ran: false

- name: Diff what is actually exposed against what the catalogs explain
  when: service_vm_exposure_due | bool
  block:
    - name: Run the exposure scan
      ansible.builtin.include_tasks: scan-exposure.yml
  rescue:
    - name: Record that the exposure scan failed without losing the other findings
      ansible.builtin.set_fact:
        service_vm_exposure: []
        service_vm_exposure_ran: false

- name: Check for services still accepting their shipped defaults
  block:
    - name: Run the credential canary
      ansible.builtin.include_tasks: scan-credentials.yml
  rescue:
    - name: Record that the credential canary failed without losing the other findings
      ansible.builtin.set_fact:
        service_vm_credentials: []
        service_vm_credentials_ran: false

# The three rescues above are what stop one broken check from zeroing the other
# two — but each of them leaves behind an EMPTY LIST, and an empty list is
# exactly what a clean result looks like. Until this fact existed the *_ran
# flags were written by every branch above and read by nothing at all: the
# exposure scan could die on its own port-22 assert, service_vm_exposure would
# be [], scan_unexpected_ports would compute 0, and the run would publish a
# routine "all clear" for a port sweep that never happened.
#
# So every check that was DUE here and produced no result names itself, and
# scan.yml escalates on the list. Due rather than merely absent: svc-download
# scans nobody and the benchmark is weekly, and neither of those is a fault.
- name: Name any check that was due on this host and produced no result
  ansible.builtin.set_fact:
    service_vm_checks_not_run: >-
      {{ (exposure if ((service_vm_exposure_due | bool)
                       and not (service_vm_exposure_ran | bool)) else [])
         + (credentials if not (service_vm_credentials_ran | bool) else [])
         + (benchmark if ((service_vm_oscap_due | bool)
                          and not (service_vm_oscap_ran | bool)) else []) }}
  vars:
    # `check` is what the report templates filter on, `label` is what the alert
    # title says out loud. Both, because a one-line ntfy title that says only
    # "a check did not run" is a page nobody can act on.
    exposure:
      - check: exposure
        host: "{{ inventory_hostname }}"
        label: "exposure scan on {{ inventory_hostname }}"
    credentials:
      - check: credentials
        host: "{{ inventory_hostname }}"
        label: "credential canary on {{ inventory_hostname }}"
    benchmark:
      - check: benchmark
        host: "{{ inventory_hostname }}"
        label: "OpenSCAP benchmark on {{ inventory_hostname }}"

- name: Mark the host scan complete
  ansible.builtin.set_fact:
    service_vm_scanned: true
