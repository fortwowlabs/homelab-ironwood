---
- name: Verify all rootless infra services are active
  ansible.builtin.command: "systemctl --user -M homelab@ is-active {{ item }}.service"
  loop: "{{ infra_service_names }}"
  changed_when: false

- name: Verify namespaced infra appdata ownership
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - stat
      - -c
      - "%u:%g"
      - "{{ item.path }}"
  loop: "{{ infra_namespaced_appdata }}"
  loop_control:
    label: "{{ item.path }}"
  register: infra_namespaced_appdata_gates
  changed_when: false
  failed_when: >-
    infra_namespaced_appdata_gates.stdout | trim
    != (item.uid | string) ~ ':' ~ (item.gid | string)

- name: Find fresh nonempty infra backup artifacts
  ansible.builtin.command:
    argv:
      - find
      - "/srv/backups/{{ inventory_hostname }}"
      - -maxdepth
      - "1"
      - -type
      - f
      - -size
      - +0c
      - -mtime
      - "-2"
      - -name
      - "{{ item }}-*.tar.gz"
      - -print
      - -quit
  loop: >-
    {{
      (
        (infra_apps | dict2items | map(attribute='value.backup_paths') | list | flatten)
        + (infra_secret_apps | default({}) | dict2items | map(attribute='value.backup_paths') | list | flatten)
        + infra_extra_backup_paths
      ) | unique | list
    }}
  register: infra_backup_artifact_gates
  changed_when: false

- name: Assert every catalog infra backup artifact is fresh and nonempty
  ansible.builtin.assert:
    that:
      - >-
        infra_backup_artifact_gates.results
        | selectattr('stdout', 'equalto', '') | list | length == 0
    fail_msg: >-
      A fresh nonempty infra appdata backup is missing. Inspect
      backup-infra-appdata.service and the NFS backup mount.

- name: Validate infra tar archive structure
  ansible.builtin.command:
    argv: [tar, -tzf, "{{ item.stdout }}"]
  loop: "{{ infra_backup_artifact_gates.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: item.stdout | length > 0

- name: Find fresh nonempty infra database dumps
  ansible.builtin.command:
    argv:
      - find
      - "/srv/backups/{{ inventory_hostname }}/db"
      - -maxdepth
      - "1"
      - -type
      - f
      - -size
      - +0c
      - -mtime
      - "-2"
      - -name
      - "{{ item }}-*.sql.gz"
      - -print
      - -quit
  loop: "{{ infra_db_backups }}"
  register: infra_db_backup_gates
  changed_when: false
  # The db/ directory may not exist before the first backup runs; a missing
  # dir makes find exit non-zero with empty stdout, which the assert below
  # then reports as a missing dump.
  failed_when: false

- name: Assert every infra database dump is fresh and nonempty
  ansible.builtin.assert:
    that:
      - >-
        infra_db_backup_gates.results
        | selectattr('stdout', 'equalto', '') | list | length == 0
    fail_msg: >-
      A fresh nonempty infra database dump (pg_dumpall) is missing. Inspect
      backup-infra-appdata.service and the NFS backup mount.

- name: Validate infra database dump integrity
  ansible.builtin.command:
    argv: [gzip, -t, "{{ item.stdout }}"]
  loop: "{{ infra_db_backup_gates.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: item.stdout | length > 0

# "active" is a weak claim for an identity provider: Authelia stays running
# with a users file it could not parse, and once forward-auth lands a portal
# that is up but not serving takes eleven services down with it. Ask its own
# health endpoint instead, which reports on the loaded configuration.
#
# Deliberately NOT a login check: proving the password works means POSTing a
# credential, and verify runs routinely. The login was exercised by hand at
# deploy time (docs/plans/authelia-sso.md); this is the standing regression
# gate, not a replacement for that.
- name: Verify the Authelia portal is serving
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ infra_secret_apps.authelia.ui_port }}/api/health"
    status_code: 200
  register: infra_authelia_health
  retries: 5
  delay: 3
  until: infra_authelia_health.status | default(0) == 200

# The nightly runner is the thing that will be checking everything else once
# the workstation is off, so its own prerequisites are checked here — while
# somebody is still around to fix them.
- name: Verify the nightly verification timer is active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - "homelab-verify@{{ verify_runner_user }}.timer"
  loop:
    - is-active
    - is-enabled
  changed_when: false

# The backup freshness check is what reports to healthchecks.io, so a timer that
# stopped firing costs the estate its only outside-the-house view of whether
# backups are still happening. It had no gate at all.
- name: Verify the backup freshness timer is active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - homelab-backups-fresh.timer
  loop:
    - is-active
    - is-enabled
  changed_when: false

# And run the script, rather than trusting that its timer exists — the same
# reasoning applied to certwatch on svc-media. A timer being active says
# nothing about whether the thing it runs still works.
#
# HC_PING_BACKUPS is deliberately blanked (hc-ping.sh treats an empty UUID as
# "skip"). healthchecks.io detects a dead timer by the ABSENCE of pings, so if
# this run pinged too, a homelab-backups-fresh.timer that had stopped firing
# would still look alive from verify's pings alone — which would quietly convert
# the dead-man's switch back into a liveness check for `make verify`. The timer
# is gated above; this task is only asserting that the logic still works.
- name: Verify the backup freshness check passes
  ansible.builtin.command: /usr/local/sbin/backups-fresh.sh
  environment:
    HC_PING_BACKUPS: ""
  changed_when: false

- name: Check the runner's vault password file
  ansible.builtin.stat:
    path: "{{ verify_runner_secret_file }}"
  register: infra_runner_vault_pass

# This is the one secret this repo will not install for you, so it is also the
# one that can be forgotten. Failing here — loudly, on every verify — is the
# only way that mistake surfaces before the house is empty.
- name: Assert the runner can decrypt the vault
  ansible.builtin.assert:
    that:
      - infra_runner_vault_pass.stat.exists
      - infra_runner_vault_pass.stat.mode == '0600'
      - infra_runner_vault_pass.stat.pw_name == verify_runner_user
    fail_msg: >-
      {{ verify_runner_secret_file }} is missing or has the wrong
      ownership/permissions, so nightly verification cannot run. Install it
      as described in docs/operations.md ("The nightly verification runner").

# The healthchecks UUIDs are asserted in roles/service_vm/tasks/verify.yml
# against the rendered /etc/homelab-healthchecks.env, not here against the vault
# variables. Reason on the record, because the first attempt got it wrong: this
# play runs in two contexts, and only one of them has a vault. The nightly
# runner's checkout is a `git archive`, which cannot carry the gitignored
# vault.yml, so every vault_* var is undefined on svc-infra and a vault-based
# assert fails there every night while passing from the workstation.
#
# The rendered file is also the more honest subject: it is what hc-ping.sh
# actually reads, so checking it catches a vault edited but never deployed —
# which the vault-variable form would have reported as fine.

- name: Verify no container has drifted from its Quadlet unit
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: container-drift

- name: Verify node_exporter metrics
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: node-exporter

- name: Verify the system has no failed services
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: failed-units

# --- chat egress (F4/F2) --------------------------------------------------
# `make verify` did not look at chat egress at all until 2026-08-21: the
# hourly probe was the only runtime check, so a workstation-driven verify
# reported a green estate while enforcement could have been absent for an
# hour. These two are the cheap half of what the probe does — they cannot
# prove the tunnel is being used (that needs an actual fetch), but they catch
# the two states that are silent and green.

- name: Verify the chat egress policy is loaded and still matching
  ansible.builtin.command: nft list table inet chat_egress
  register: infra_chat_egress_verify
  changed_when: false
  # The quoted path is the whole point. nftables resolves the cgroup to an
  # INODE when the rule loads, and a rule whose cgroup was recreated renders
  # as a bare number instead — table listed, loader active, counter zero, and
  # nothing enforced. Comparing against chat_egress_cgroup_path (one
  # definition, in roles/svc_infra/defaults) is what tells those apart.
  failed_when: >-
    'chat_policy' not in infra_chat_egress_verify.stdout
    or '"' ~ chat_egress_cgroup_path ~ '"' not in infra_chat_egress_verify.stdout

- name: Read Open WebUI's stored web.search.trust_env
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - open-webui
      - python
      - -c
      - |
        import sqlite3
        c = sqlite3.connect("/app/backend/data/webui.db")
        r = c.execute(
            "select value from config where key = 'web.search.trust_env'"
        ).fetchone()
        print("absent" if r is None else str(r[0]).strip().lower())
  become: true
  become_user: homelab
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ svc_uid }}"
  args:
    # Required, not tidiness — same reason as roles/svc_infra/tasks/images.yml:
    # Ansible runs a command from a directory the connecting user owns and
    # `homelab` cannot enter, so without this podman never starts.
    chdir: /tmp
  register: infra_chat_trust_env
  changed_when: false

- name: Verify Open WebUI has not been switched off its proxy in the admin UI
  ansible.builtin.assert:
    that:
      - infra_chat_trust_env.stdout | trim in ['absent', 'true']
    fail_msg: >-
      Open WebUI's web.search.trust_env is
      {{ infra_chat_trust_env.stdout | trim }}. That is an admin-UI toggle
      stored in its database, and ENABLE_PERSISTENT_CONFIG is true, so the row
      wins over the catalog. With it false, Open WebUI's own web loader stops
      honouring http_proxy and its fetches are dropped by the chat_egress
      table instead of going through the tunnel — web search breaks and
      nothing else notices, because the hourly probe checks that a BYPASS is
      refused, never that the legitimate path still works.
    success_msg: >-
      web.search.trust_env is
      {{ 'unset, so the default (true) applies'
         if (infra_chat_trust_env.stdout | trim) == 'absent'
         else 'true' }}.

- name: Mark svc-infra verification complete
  ansible.builtin.set_fact:
    svc_infra_verified: true
