---
- name: Verify all rootless infra services are active
  ansible.builtin.command: "systemctl --user -M homelab@ is-active {{ item }}.service"
  loop: "{{ infra_service_names }}"
  changed_when: false

- name: Verify namespaced infra appdata ownership
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - stat
      - -c
      - "%u:%g"
      - "{{ item.path }}"
  loop: "{{ infra_namespaced_appdata }}"
  loop_control:
    label: "{{ item.path }}"
  register: infra_namespaced_appdata_gates
  changed_when: false
  failed_when: >-
    infra_namespaced_appdata_gates.stdout | trim
    != (item.uid | string) ~ ':' ~ (item.gid | string)

- name: Find fresh nonempty infra backup artifacts
  ansible.builtin.command:
    argv:
      - find
      - "/srv/backups/{{ inventory_hostname }}"
      - -maxdepth
      - "1"
      - -type
      - f
      - -size
      - +0c
      - -mtime
      - "-2"
      - -name
      - "{{ item }}-*.tar.gz"
      - -print
      - -quit
  loop: >-
    {{
      (
        (infra_apps | dict2items | map(attribute='value.backup_paths') | list | flatten)
        + (infra_secret_apps | default({}) | dict2items | map(attribute='value.backup_paths') | list | flatten)
        + infra_extra_backup_paths
      ) | unique | list
    }}
  register: infra_backup_artifact_gates
  changed_when: false

- name: Assert every catalog infra backup artifact is fresh and nonempty
  ansible.builtin.assert:
    that:
      - >-
        infra_backup_artifact_gates.results
        | selectattr('stdout', 'equalto', '') | list | length == 0
    fail_msg: >-
      A fresh nonempty infra appdata backup is missing. Inspect
      backup-infra-appdata.service and the NFS backup mount.

- name: Validate infra tar archive structure
  ansible.builtin.command:
    argv: [tar, -tzf, "{{ item.stdout }}"]
  loop: "{{ infra_backup_artifact_gates.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: item.stdout | length > 0

- name: Find fresh nonempty infra database dumps
  ansible.builtin.command:
    argv:
      - find
      - "/srv/backups/{{ inventory_hostname }}/db"
      - -maxdepth
      - "1"
      - -type
      - f
      - -size
      - +0c
      - -mtime
      - "-2"
      - -name
      - "{{ item }}-*.sql.gz"
      - -print
      - -quit
  loop: "{{ infra_db_backups }}"
  register: infra_db_backup_gates
  changed_when: false
  # The db/ directory may not exist before the first backup runs; a missing
  # dir makes find exit non-zero with empty stdout, which the assert below
  # then reports as a missing dump.
  failed_when: false

- name: Assert every infra database dump is fresh and nonempty
  ansible.builtin.assert:
    that:
      - >-
        infra_db_backup_gates.results
        | selectattr('stdout', 'equalto', '') | list | length == 0
    fail_msg: >-
      A fresh nonempty infra database dump (pg_dumpall) is missing. Inspect
      backup-infra-appdata.service and the NFS backup mount.

- name: Validate infra database dump integrity
  ansible.builtin.command:
    argv: [gzip, -t, "{{ item.stdout }}"]
  loop: "{{ infra_db_backup_gates.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  when: item.stdout | length > 0

# "active" is a weak claim for an identity provider: Authelia stays running
# with a users file it could not parse, and once forward-auth lands a portal
# that is up but not serving takes eleven services down with it. Ask its own
# health endpoint instead, which reports on the loaded configuration.
#
# Deliberately NOT a login check: proving the password works means POSTing a
# credential, and verify runs routinely. The login was exercised by hand at
# deploy time (docs/plans/authelia-sso.md); this is the standing regression
# gate, not a replacement for that.
- name: Verify the Authelia portal is serving
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ infra_secret_apps.authelia.ui_port }}/api/health"
    status_code: 200
  register: infra_authelia_health
  retries: 5
  delay: 3
  until: infra_authelia_health.status | default(0) == 200

# The nightly runner is the thing that will be checking everything else once
# the workstation is off, so its own prerequisites are checked here — while
# somebody is still around to fix them.
- name: Verify the nightly verification timer is active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - "homelab-verify@{{ verify_runner_user }}.timer"
  loop:
    - is-active
    - is-enabled
  changed_when: false

- name: Check the runner's vault password file
  ansible.builtin.stat:
    path: "{{ verify_runner_secret_file }}"
  register: infra_runner_vault_pass

# This is the one secret this repo will not install for you, so it is also the
# one that can be forgotten. Failing here — loudly, on every verify — is the
# only way that mistake surfaces before the house is empty.
- name: Assert the runner can decrypt the vault
  ansible.builtin.assert:
    that:
      - infra_runner_vault_pass.stat.exists
      - infra_runner_vault_pass.stat.mode == '0600'
      - infra_runner_vault_pass.stat.pw_name == verify_runner_user
    fail_msg: >-
      {{ verify_runner_secret_file }} is missing or has the wrong
      ownership/permissions, so nightly verification cannot run. Install it
      as described in docs/operations.md ("The nightly verification runner").

- name: Verify node_exporter metrics
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: node-exporter

- name: Verify the system has no failed services
  ansible.builtin.include_role:
    name: service_vm
    tasks_from: failed-units

- name: Mark svc-infra verification complete
  ansible.builtin.set_fact:
    svc_infra_verified: true
