---
# Image vulnerability scanning. Runs on svc-infra only, and covers the WHOLE
# estate from here: Trivy reads manifests and layers straight from the registry,
# so the images belonging to svc-media and svc-download are scanned without
# touching either host. That is what makes svc-download's nftables blackout a
# non-issue for this job rather than a special case in it.
#
# Report-only, like everything else under a scan path — enforced by
# tests/validate_scan_readonly.py, which forbids `podman pull` here precisely
# because scanning by reference never needs one.

- name: Write the list of images to scan
  # Also the evidence of WHAT was scanned. A count in the report is only
  # meaningful next to the list it came from, and this file is served beside
  # the report itself.
  ansible.builtin.copy:
    content: |
      {% for image in scan_images %}
      {{ image }}
      {% endfor %}
    dest: "{{ scan_report_dir }}/images.txt"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"

- name: Scan every pinned image for vulnerabilities
  # 323s for the full 47-image set, measured on this host. Runs as
  # the rootless container user, the only account with a working podman here —
  # via become_user rather than an inline `sudo`, matching the pattern in
  # verify-runner.yml (commands may drop to an unprivileged user; file
  # transfers may not, because that needs setfacl and these hosts have none).
  #
  # chdir is REQUIRED, not tidiness. Ansible runs a command from a directory the
  # connecting user owns, and `homelab` cannot chdir into it — so the script
  # exited before podman ever started and every one of the 47 images came back
  # failed. It looked exactly like a total registry outage. The report said
  # "0 scanned (50 FAILED)" rather than "0 vulnerabilities", which is the only
  # reason it was noticed at all.
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/homelab-scan-images.sh
      - "{{ scan_report_dir }}/images.txt"
    chdir: "{{ scan_report_dir }}"
  become: true
  become_user: homelab
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ svc_uid }}"
  register: infra_image_scan_raw
  changed_when: false
  # Never fatal. The script already tolerates a per-image failure; this covers
  # the whole invocation dying (podman gone, Trivy image unpullable) and turns
  # it into a reported state rather than an aborted run.
  failed_when: false

- name: Summarise the image scan
  # `ok` means IMAGES WERE MEASURED, and the count it is derived from is the
  # number that scanned, never the number that was attempted. The script is
  # deliberately not `set -e` and its last statement is a `printf`, so its exit
  # status is 0 essentially always — and it emits one entry per image whether or
  # not Trivy managed to read that image. So a total registry outage produced 47
  # entries, all ok=false, a non-empty list, and therefore `ok: true` with
  # scanned=0 and critical=0. scan.yml then wrote 0 as the baseline and the next
  # healthy run escalated "image criticals increased 0 -> 40", a finding that
  # never happened. That is the same false alarm the errata baseline already
  # learned from on 2026-07-30; see the long comment in scan.yml.
  ansible.builtin.set_fact:
    infra_image_scan: >-
      {{ {'ok': ran and (scanned | int) > 0,
          'images': images,
          'scanned': scanned | int,
          'failed': failed | int,
          'critical': images | selectattr('ok')
                      | map(attribute='critical') | map('int') | sum,
          'high': images | selectattr('ok')
                  | map(attribute='high') | map('int') | sum,
          'eosl': images | selectattr('ok')
                  | selectattr('eosl') | map(attribute='ref') | list,
          'detail': 'image scan did not run (rc='
                    ~ (infra_image_scan_raw.rc | default('none')) ~ ')' if not ran
                    else 'every one of ' ~ (images | length)
                         ~ ' images failed to scan' if (scanned | int) == 0
                    else 'ok, but ' ~ (failed | int) ~ ' of ' ~ (images | length)
                         ~ ' images failed to scan' if (failed | int) > 0
                    else 'ok'} }}
  vars:
    ran: "{{ (infra_image_scan_raw.rc | default(1)) == 0 }}"
    parsed: >-
      {{ (infra_image_scan_raw.stdout | default('') | from_json)
         if (infra_image_scan_raw.stdout | default('')) | trim | length > 0
         else {} }}
    images: "{{ parsed.images | default([]) }}"
    scanned: "{{ images | selectattr('ok') | list | length | int }}"
    failed: "{{ images | rejectattr('ok') | list | length | int }}"

- name: Mark the infra scan complete
  ansible.builtin.set_fact:
    svc_infra_scanned: true
