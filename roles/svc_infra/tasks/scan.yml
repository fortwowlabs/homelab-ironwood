---
# Image vulnerability scanning. Runs on svc-infra only, and covers the WHOLE
# estate from here: Trivy reads manifests and layers straight from the registry,
# so the images belonging to svc-media and svc-download are scanned without
# touching either host. That is what makes svc-download's nftables blackout a
# non-issue for this job rather than a special case in it.
#
# Report-only, like everything else under a scan path — enforced by
# tests/validate_scan_readonly.py, which forbids `podman pull` here precisely
# because scanning by reference never needs one.

- name: Write the list of images to scan
  # Also the evidence of WHAT was scanned. A count in the report is only
  # meaningful next to the list it came from, and this file is served beside
  # the report itself.
  ansible.builtin.copy:
    content: |
      {% for image in scan_images %}
      {{ image }}
      {% endfor %}
    dest: "{{ scan_report_dir }}/images.txt"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"

- name: Scan every pinned image for vulnerabilities
  # 323s for the full 47-image set, measured on this host. Runs as
  # the rootless container user, the only account with a working podman here —
  # via become_user rather than an inline `sudo`, matching the pattern in
  # verify-runner.yml (commands may drop to an unprivileged user; file
  # transfers may not, because that needs setfacl and these hosts have none).
  #
  # chdir is REQUIRED, not tidiness. Ansible runs a command from a directory the
  # connecting user owns, and `homelab` cannot chdir into it — so the script
  # exited before podman ever started and every one of the 47 images came back
  # failed. It looked exactly like a total registry outage. The report said
  # "0 scanned (50 FAILED)" rather than "0 vulnerabilities", which is the only
  # reason it was noticed at all.
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/homelab-scan-images.sh
      - "{{ scan_report_dir }}/images.txt"
    chdir: "{{ scan_report_dir }}"
  become: true
  become_user: homelab
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ svc_uid }}"
  register: infra_image_scan_raw
  changed_when: false
  # Never fatal. The script already tolerates a per-image failure; this covers
  # the whole invocation dying (podman gone, Trivy image unpullable) and turns
  # it into a reported state rather than an aborted run.
  failed_when: false

- name: Summarise the image scan
  # `ok` means IMAGES WERE MEASURED, and the count it is derived from is the
  # number that scanned, never the number that was attempted. The script is
  # deliberately not `set -e` and its last statement is a `printf`, so its exit
  # status is 0 essentially always — and it emits one entry per image whether or
  # not Trivy managed to read that image. So a total registry outage produced 47
  # entries, all ok=false, a non-empty list, and therefore `ok: true` with
  # scanned=0 and critical=0. scan.yml then wrote 0 as the baseline and the next
  # healthy run escalated "image criticals increased 0 -> 40", a finding that
  # never happened. That is the same false alarm the errata baseline already
  # learned from on 2026-07-30; see the long comment in scan.yml.
  ansible.builtin.set_fact:
    infra_image_scan: >-
      {{ {'ok': ran and (scanned | int) > 0,
          'images': images,
          'scanned': scanned | int,
          'failed': failed | int,
          'critical': images | selectattr('ok')
                      | map(attribute='critical') | map('int') | sum,
          'high': images | selectattr('ok')
                  | map(attribute='high') | map('int') | sum,
          'eosl': images | selectattr('ok')
                  | selectattr('eosl') | map(attribute='ref') | list,
          'detail': 'image scan did not run (rc='
                    ~ (infra_image_scan_raw.rc | default('none')) ~ ')' if not ran
                    else 'every one of ' ~ (images | length)
                         ~ ' images failed to scan' if (scanned | int) == 0
                    else 'ok, but ' ~ (failed | int) ~ ' of ' ~ (images | length)
                         ~ ' images failed to scan' if (failed | int) > 0
                    else 'ok'} }}
  vars:
    ran: "{{ (infra_image_scan_raw.rc | default(1)) == 0 }}"
    parsed: >-
      {{ (infra_image_scan_raw.stdout | default('') | from_json)
         if (infra_image_scan_raw.stdout | default('')) | trim | length > 0
         else {} }}
    images: "{{ parsed.images | default([]) }}"
    scanned: "{{ images | selectattr('ok') | list | length | int }}"
    failed: "{{ images | rejectattr('ok') | list | length | int }}"

# Publish the summary as Prometheus series. Deliberately reads the same
# infra_image_scan fact that feeds the ntfy message rather than re-parsing
# state.json, so a chart and an alert cannot disagree about the same night.
#
# --success is gated on infra_image_scan.ok, which that fact already defines as
# "ran AND scanned > 0" — the positive control is inherited rather than
# reinvented here. A run where every image failed to scan therefore bumps the
# run timestamp and not the success timestamp, which is exactly the "it ran and
# could not look" state the two series exist to separate.
#
# Per-image labels carry BOTH a digest-stripped `image` and a short `digest`.
# `image` alone was the first cut, and it silently dropped data on the first
# live run: apps.yml deliberately pins valkey (and postgres) at two DIFFERENT
# digests for two different purposes, so digest-stripping collapsed those into
# one label set with two different values. node_exporter picked one and
# discarded the other with node_textfile_scrape_error staying 0 — a wrong
# number with no error anywhere, which is exactly the failure this feature
# exists to prevent. `image` still drops the digest so the series a dashboard
# sums by does not churn on every `make image-bump`; `digest` (7 chars, not
# the whole thing) exists only to keep two distinct pins from colliding, and
# it is a dimension no chart groups on, so its own churn on a bump is harmless.
# A shared pin used at the same digest by several services still appears once.
- name: Publish the image scan as metrics
  ansible.builtin.command:
    # argv as a computed list rather than a literal one, because --success is
    # conditional: appending it inside the expression keeps the flag out of the
    # argument vector entirely on a run that measured nothing, instead of
    # passing it an empty string that argparse would treat as a positional.
    argv: >-
      {{ [infra_metric_write_bin,
          '--dir', infra_textfile_dir,
          '--file', 'scan',
          '--prefix', 'homelab_scan']
         + (['--success'] if infra_image_scan.ok else []) }}
    stdin: |
      homelab_scan_images_total {{ infra_image_scan.images | length }}
      homelab_scan_images_scanned {{ infra_image_scan.scanned }}
      homelab_scan_images_failed {{ infra_image_scan.failed }}
      homelab_scan_images_eosl {{ infra_image_scan.eosl | length }}
      homelab_scan_vulnerabilities{severity="critical"} {{ infra_image_scan.critical }}
      homelab_scan_vulnerabilities{severity="high"} {{ infra_image_scan.high }}
      {% for image in infra_image_scan.images | selectattr('ok') %}
      {% set repo = image.ref | regex_replace('@sha256:.*$', '') %}
      {# '\\1', not '\1': Jinja parses the replacement string as a literal
         before regex_replace ever sees it, and '\1' there is the one-char
         octal escape \x01 (SOH), not a backreference. That shipped once
         already — every digest came out as the same control character, so
         the two valkey pins still collided under an identical, wrong label,
         invisibly, with node_textfile_scrape_error still 0. #}
      {% set digest = image.ref | regex_replace('^.*@sha256:(.{7}).*$', '\\1') %}
      homelab_scan_image_vulnerabilities{image="{{ repo }}",digest="{{ digest }}",severity="critical"} {{ image.critical }}
      homelab_scan_image_vulnerabilities{image="{{ repo }}",digest="{{ digest }}",severity="high"} {{ image.high }}
      {% endfor %}
  register: infra_scan_metrics
  changed_when: false
  # Telemetry must not be able to break the check it describes. A failed publish
  # surfaces as the dashboard's freshness row going red, not as a failed scan.
  failed_when: false

- name: Warn if the scan metrics could not be published
  ansible.builtin.debug:
    msg: >-
      metric publish FAILED (rc={{ infra_scan_metrics.rc | default('none') }}):
      {{ infra_scan_metrics.stderr | default('') }} —
      the estate dashboard will show this emitter as stale
  when: (infra_scan_metrics.rc | default(0)) != 0

- name: Mark the infra scan complete
  ansible.builtin.set_fact:
    svc_infra_scanned: true
