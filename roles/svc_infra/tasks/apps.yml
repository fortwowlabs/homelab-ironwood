---
- name: Apply changed rootless service configuration
  ansible.builtin.meta: flush_handlers

# Unconditional, and deliberately not a handler. The handler above only reloads
# when a Quadlet render reports `changed`, which makes the converge unable to
# heal itself: if a deploy renders a NEW .container file and then dies before
# handlers flush — an unreachable host, an interrupted run — the next converge
# sees the file as unchanged, never reloads, and the generated unit therefore
# never comes into existence. Every subsequent run then fails on "Unit
# <name>.service not found" while the Quadlet sits on disk looking correct.
#
# Observed exactly that way on 2026-07-30: adding the scan-reports catalog entry
# reloaded firewalld, which dropped the deploy's own SSH connection mid-play,
# and svc-infra stayed wedged across three further converges until the reload
# was run by hand.
#
# A reload costs ~40ms and is idempotent, so paying it every run is far cheaper
# than a state only a human can notice and clear.
- name: Reload the rootless user manager so new Quadlets are generated
  ansible.builtin.command: systemctl --user -M homelab@ daemon-reload
  changed_when: false

- name: Read rootless infra service state
  ansible.builtin.command: "systemctl --user -M homelab@ is-active {{ item }}.service"
  loop: "{{ infra_service_names }}"
  register: infra_service_states
  failed_when: false
  changed_when: false
  check_mode: false

- name: Start inactive rootless infra services
  ansible.builtin.command: "systemctl --user -M homelab@ start {{ item.item }}.service"
  loop: "{{ infra_service_states.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
