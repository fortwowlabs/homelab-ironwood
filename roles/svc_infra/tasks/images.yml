---
# Pull every image this host runs BEFORE apps.yml flushes handlers and restarts
# anything. Ordering is the entire point of this file.
#
# Without it, changing a digest re-renders the Quadlet, the handler restarts the
# unit, and podman pulls inside the unit start — so a typo'd or unreachable
# digest takes the service DOWN and leaves it down, with the failure surfacing
# as a unit that will not start rather than as a deploy that refused to proceed.
# Pulling first turns that into an aborted deploy with the service still running
# happily on its old image.
#
# svc-download has done this since the beginning (roles/svc_download/tasks/
# images.yml). It needed to, because its nftables backstop denies the registry
# egress a start-time pull would attempt; the safety was a side effect. Here the
# safety is the whole reason.
#
# One honest limitation. This runs AFTER files.yml, not before it, because
# files.yml is where `loginctl enable-linger` establishes the rootless session
# at /run/user/<uid> that podman needs — pulling first would break a fresh host.
# So an aborted bump leaves the re-rendered Quadlet on disk pointing at a digest
# that was never pulled, while the OLD container keeps running. The service is
# fine and stays fine; but until the digest is reverted and re-deployed, a
# reboot or a manual restart of that unit would fail to start it. Revert and
# re-deploy rather than leaving it parked.

- name: Assemble the immutable images this host runs
  ansible.builtin.set_fact:
    # Hand-listed rather than derived from scan_images, which deliberately spans
    # the WHOLE estate: pre-pulling svc-media's Jellyfin here would waste disk on
    # a host that never starts it.
    infra_required_images: >-
      {{ ((infra_apps | default({})).values() | map(attribute='image') | list)
         + ((infra_secret_apps | default({})).values() | map(attribute='image') | list)
         + [paperless_images.webserver, paperless_images.redis]
         + [netbox_images.webserver, netbox_images.postgres, netbox_images.redis]
         + [immich_images.server, immich_images.postgres, immich_images.redis]
         + [nextcloud_images.webserver, nextcloud_images.postgres, nextcloud_images.redis]
         + [node_exporter_image]
         + ([beszel_agent_image] if beszel_agent_enabled | bool else [])
         | unique | sort }}
  changed_when: false

# NOTE the absence of immich_images.machine_learning. It is pinned for
# completeness but deliberately not deployed — svc-infra has no swap and the ML
# container's spiky ~2G appetite risks an OOM, so the server runs with
# IMMICH_MACHINE_LEARNING_ENABLED=false. Pulling a multi-gigabyte image nothing
# starts would cost disk for nothing. If it is ever enabled, add it here too.

- name: Check which images are already present
  ansible.builtin.command: "podman image exists {{ item }}"
  loop: "{{ infra_required_images }}"
  loop_control:
    label: "{{ item | regex_replace('@.*', '') }}"
  register: infra_image_checks
  become: true
  become_user: homelab
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ svc_uid }}"
  args:
    # Required, not tidiness. Ansible runs a command from a directory the
    # connecting user owns and `homelab` cannot enter, so without this podman
    # never starts and every image reports missing — the exact failure that made
    # the image scanner return zero findings in 4699c69.
    chdir: /tmp
  failed_when: false
  changed_when: false
  check_mode: false

- name: Pull missing images before anything restarts
  ansible.builtin.command: "podman pull {{ item.item }}"
  loop: "{{ infra_image_checks.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item | regex_replace('@.*', '') }}"
  become: true
  become_user: homelab
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ svc_uid }}"
  args:
    chdir: /tmp
  changed_when: true
  when: not ansible_check_mode

- name: Report images that would be pulled during a check run
  ansible.builtin.debug:
    msg: >-
      {{ infra_image_checks.results | selectattr('rc', 'ne', 0) | list | length }}
      image(s) would be pulled before any service restart.
  when:
    - ansible_check_mode
    - infra_image_checks.results | selectattr('rc', 'ne', 0) | list | length > 0

# --- reclaim superseded images ---------------------------------------------
# Nothing pruned anything until 2026-07-31, and svc-media was carrying 1.6G of
# images no container referenced. Every bump leaves its predecessor behind.
#
# `-a` removes images NO CONTAINER USES; an image in use is never touched
# regardless of age. The `until` filter then keeps recent ones, so the image you
# just replaced normally survives long enough to roll back to instantly.
#
# READ THIS BEFORE TIGHTENING THE FILTER. `until` matches image CREATION time,
# not how long the image has been unused — so a long-lived image replaced
# yesterday IS eligible today. That is deliberate and safe, because pruning
# never costs the ABILITY to roll back: reverting the digest and re-deploying
# re-pulls whatever is missing. It costs rollback TIME, not rollback.
# Expect the Trivy image to be reclaimed here periodically and re-pulled by the
# next scan. It is never a running container — the scan invokes it with
# `podman run --rm` — so `prune -a` always considers it unreferenced. The
# re-pull costs about three seconds and is not worth special-casing; this note
# exists so the churn is not mistaken for a fault.
- name: Reclaim images no container references
  ansible.builtin.command: >-
    podman image prune --all --force
    --filter until={{ image_prune_keep_hours }}h
  become: true
  become_user: homelab
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ svc_uid }}"
  args:
    chdir: /tmp
  register: svc_infra_image_prune
  # Reclaiming space is not a configuration change. Reporting `changed` on every
  # converge that happens to free a byte would make `changed=0` — the repo's
  # proof that deployed state matches the commit — meaningless.
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# podman image prune emits one deleted image ID per line and NO size summary,
# so the count is the only honest thing to report here — an earlier version
# printed `stdout_lines | last` and cheerfully announced a bare sha256 as though
# it were a quantity of disk.
- name: Report how many images were reclaimed
  ansible.builtin.debug:
    msg: >-
      Reclaimed {{ svc_infra_image_prune.stdout_lines | default([]) | length }} unreferenced
      image(s) older than {{ image_prune_keep_hours }}h.
  when:
    - not ansible_check_mode
    - svc_infra_image_prune.stdout | default('') | trim | length > 0
