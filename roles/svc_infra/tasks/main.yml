---
- name: Configure infra files
  ansible.builtin.import_tasks: files.yml
  tags: [files]

# Pull images BEFORE apps.yml flushes handlers and restarts anything: a bad
# digest must abort the deploy, not take a service down mid-restart.
- name: Pre-pull immutable images
  ansible.builtin.import_tasks: images.yml
  tags: [files, apps, images]

- name: Converge infra applications
  ansible.builtin.import_tasks: apps.yml
  tags: [apps]

- name: Configure infra backups
  ansible.builtin.import_tasks: backup.yml
  tags: [backup]

- name: Install the nightly verification runner
  ansible.builtin.import_tasks: verify-runner.yml
  tags: [verifyrunner]

- name: Install the weekly alert-topic delivery canary
  ansible.builtin.import_tasks: alert-canary.yml
  tags: [alertcanary]

# Last before verify.yml, and both halves of that placement matter. It is after
# apps.yml because the container must exist before its cgroup can be matched.
# It is after everything ELSE because its policy render validates with
# `nft -c`, which hard-rejects a cgroup path that does not exist — so an
# open-webui outage fails this import, and anything imported below it would
# never converge. Backups, the verify runner, the alert canary and the
# `git archive` sync that writes .deployed-rev all sit above it for that
# reason.
- name: Enforce chat egress through the VPN
  ansible.builtin.import_tasks: chat-egress.yml
  tags: [chategress]

- name: Verify infra services
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
  tags: [verify]
