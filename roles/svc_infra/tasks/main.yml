---
- name: Configure infra files
  ansible.builtin.import_tasks: files.yml
  tags: [files]

# Pull images BEFORE apps.yml flushes handlers and restarts anything: a bad
# digest must abort the deploy, not take a service down mid-restart.
- name: Pre-pull immutable images
  ansible.builtin.import_tasks: images.yml
  tags: [files, apps, images]

- name: Converge infra applications
  ansible.builtin.import_tasks: apps.yml
  tags: [apps]

- name: Configure infra backups
  ansible.builtin.import_tasks: backup.yml
  tags: [backup]

- name: Install the nightly verification runner
  ansible.builtin.import_tasks: verify-runner.yml
  tags: [verifyrunner]

- name: Install the weekly alert-topic delivery canary
  ansible.builtin.import_tasks: alert-canary.yml
  tags: [alertcanary]

- name: Verify infra services
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
  tags: [verify]
