---
- name: Enable lingering for the rootless service account
  ansible.builtin.command: loginctl enable-linger homelab
  changed_when: false

- name: Ensure the rootless Quadlet directory exists
  ansible.builtin.file:
    path: /opt/homelab/.config/containers/systemd
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

# Remove Quadlets orphaned by a service that was deleted from the catalog
# (infra_apps) or from the bespoke set since the last converge — otherwise its
# .container unit keeps running and silently drops out of infra_service_names
# and verify.yml. Mirrors svc_download's stale-unit reconciliation. Every
# expected list below is a single bare `{{ }}` expression (never
# {% set %}/{% for %}), so difference() operates on a real list rather than a
# string repr of one — the exact gotcha documented in svc_download/tasks/files.yml.
- name: Calculate the rootless infra unit files that should exist
  ansible.builtin.set_fact:
    # beszel-agent is force-included even when disabled so a previously
    # rendered agent is never treated as stale by a token/key being cleared —
    # its own `when: beszel_agent_enabled` render + WARN already handle that.
    infra_expected_container_paths: >-
      {{ (infra_service_names | union(['beszel-agent']))
         | map('regex_replace', '^(.*)$',
                '/opt/homelab/.config/containers/systemd/\1.container') | list }}
    infra_expected_network_paths: >-
      {{ ['paperless', 'netbox', 'immich', 'nextcloud']
         | map('regex_replace', '^(.*)$',
                '/opt/homelab/.config/containers/systemd/\1.network') | list }}
  changed_when: false

- name: Discover Ansible-managed rootless infra container Quadlets
  ansible.builtin.find:
    paths: /opt/homelab/.config/containers/systemd
    patterns: "*.container"
    file_type: file
    contains: 'Ansible managed'
  register: infra_managed_containers
  check_mode: false

- name: Discover rootless infra network Quadlets
  ansible.builtin.find:
    paths: /opt/homelab/.config/containers/systemd
    patterns: "*.network"
    file_type: file
  register: infra_managed_networks
  check_mode: false

- name: Calculate stale rootless infra unit paths
  ansible.builtin.set_fact:
    infra_stale_container_paths: >-
      {{ infra_managed_containers.files | map(attribute='path') | list
         | difference(infra_expected_container_paths) }}
    infra_stale_network_paths: >-
      {{ infra_managed_networks.files | map(attribute='path') | list
         | difference(infra_expected_network_paths) }}
  changed_when: false

- name: Stop stale rootless infra services
  ansible.builtin.command: >-
    systemctl --user -M homelab@ stop
    {{ item | basename | regex_replace('\.container$', '.service') }}
  loop: "{{ infra_stale_container_paths }}"
  changed_when: true

- name: Remove stale rootless infra unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ infra_stale_container_paths + infra_stale_network_paths }}"
  notify: infra configuration changed

# Single-container catalog apps declare their own appdata paths as Quadlet
# Volume= sources (e.g. "/opt/homelab/appdata/uptime-kuma/data:/app/data:Z");
# derive the directories to create from the catalog instead of hand-listing
# them here, so a new catalog entry doesn't also require a new task. Bespoke
# multi-container services (a database/cache sidecar) declare their own
# appdata directories in their own tasks, appended below this file over time
# — see roles/svc_media/tasks/files.yml for that pattern.
# The two catalogs are merged with combine() at several call sites below (and
# in backup.yml/verify.yml/defaults). combine() is last-wins, so a key present
# in both would silently shadow the infra_apps entry EVERYWHERE — its volumes,
# backup_paths and firewall ports would just vanish, with no error and no
# symptom until something is missing at runtime. Fail loudly instead.
- name: Assert the plain and secret infra catalogs share no service names
  ansible.builtin.assert:
    that:
      - infra_duplicate_app_names | length == 0
    fail_msg: >-
      infra_apps and infra_secret_apps both declare
      {{ infra_duplicate_app_names | join(', ') }} — a duplicate name silently
      shadows the infra_apps entry in every combine() consumer. Rename or
      remove one of them.
  vars:
    infra_duplicate_app_names: >-
      {{ infra_apps.keys() | list
         | intersect((infra_secret_apps | default({})).keys() | list) }}

- name: Determine appdata directories required by the infra catalog
  vars:
    # Both the plain and the secret catalog declare appdata as Volume=
    # sources; they create identical directories, only their Quadlet render
    # differs (the secret one is no_log/0600, below).
    infra_volume_sources: >-
      {{ (infra_apps | combine(infra_secret_apps | default({}))).values()
         | map(attribute='volumes') | list | flatten
         | map('regex_replace', '^([^:]+):.*$', '\1') | list }}
  ansible.builtin.set_fact:
    infra_appdata_dirs: >-
      {{ infra_volume_sources | select('match', '^/opt/homelab/appdata/') | unique | list }}
  changed_when: false

- name: Create catalog application data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop: "{{ infra_appdata_dirs }}"

- name: Render single-container infra Quadlets from the catalog
  ansible.builtin.template:
    src: infra-app.container.j2
    dest: "/opt/homelab/.config/containers/systemd/{{ item.key }}.container"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  loop: "{{ infra_apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: infra_quadlet_templates

# Secret-bearing single-container apps: same template as above, but the
# render is no_log/diff:false and the file is 0600, because an `env` value
# here is a real secret. Kept a separate loop (not folded into the task
# above) precisely so the ordinary catalog keeps its readable diff.
- name: Require every infra secret app's vault secrets
  ansible.builtin.assert:
    that:
      - "lookup('vars', item.1, default='') | string | length > 0"
      # A var still holding its all_vault.yml.example value
      # ("REPLACE_openssl_rand_hex_24") is non-empty, so the length check
      # alone would let it through and deploy the placeholder as the
      # service's actual, publicly-known password.
      - "not (lookup('vars', item.1, default='') | string is match('REPLACE_'))"
    fail_msg: >-
      {{ item.1 }} is empty or still set to its all_vault.yml.example
      REPLACE_* placeholder — set a real value in the encrypted inventory
      (needed by infra_secret_apps.{{ item.0.key }}).
  loop: >-
    {{ infra_secret_apps | default({}) | dict2items
       | subelements('value.require_vault', skip_missing=True) }}
  loop_control:
    label: "{{ item.0.key }}:{{ item.1 }}"
  no_log: true

- name: Render secret-bearing single-container infra Quadlets
  ansible.builtin.template:
    src: infra-app.container.j2
    dest: "/opt/homelab/.config/containers/systemd/{{ item.key }}.container"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: an Environment= line here embeds a vault secret.
    mode: "0600"
  loop: "{{ infra_secret_apps | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: infra_secret_quadlet_templates
  no_log: true
  diff: false

- name: Create Paperless-ngx appdata directories
  ansible.builtin.file:
    path: "/opt/homelab/appdata/paperless/{{ item }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop: [data, media, export, consume]

# No paperless-redis appdata directory: that broker is volume-less on purpose
# (see paperless-redis.container.j2 — a bind mount is what wedged it twice).
# The old directory is left on disk rather than deleted; it holds nothing but a
# stale dump.rdb owned by an unreachable subuid.

- name: Install the Paperless-ngx private network Quadlet
  ansible.builtin.copy:
    src: quadlets/paperless.network
    dest: /opt/homelab/.config/containers/systemd/paperless.network
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_paperless_network

- name: Render the Paperless-ngx redis Quadlet
  ansible.builtin.template:
    src: paperless-redis.container.j2
    dest: /opt/homelab/.config/containers/systemd/paperless-redis.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_paperless_redis_template

- name: Require the Paperless-ngx secrets
  ansible.builtin.assert:
    that:
      - (vault_paperless_secret_key | default('')) | length > 0
      - (vault_paperless_admin_password | default('')) | length > 0
      # Non-empty alone would let an all_vault.yml.example placeholder through
      # and make it the live superuser password.
      - not ((vault_paperless_secret_key | default('')) is match('REPLACE_'))
      - not ((vault_paperless_admin_password | default('')) is match('REPLACE_'))
    fail_msg: >-
      Configure vault_paperless_secret_key (openssl rand -hex 32) and
      vault_paperless_admin_password (openssl rand -hex 24) in the encrypted
      inventory — both must be set and neither may still be a REPLACE_*
      placeholder.
  no_log: true
  diff: false

- name: Render the Paperless-ngx Quadlet
  ansible.builtin.template:
    src: paperless.container.j2
    dest: /opt/homelab/.config/containers/systemd/paperless.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds PAPERLESS_SECRET_KEY on an Environment= line.
    mode: "0600"
  register: infra_paperless_template
  no_log: true
  diff: false

- name: Create NetBox appdata directories
  ansible.builtin.file:
    path: "/opt/homelab/appdata/netbox/{{ item }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop: [media, reports, scripts]

- name: Create the NetBox database appdata directory
  ansible.builtin.file:
    path: /opt/homelab/appdata/netbox-db
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

- name: Check namespaced infra appdata directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ infra_namespaced_appdata }}"
  loop_control:
    label: "{{ item.path }}"
  register: infra_namespaced_appdata_directories

- name: Create missing namespaced appdata as the rootless service account
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  loop: "{{ infra_namespaced_appdata_directories.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not item.stat.exists

- name: Read namespaced infra appdata ownership
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - stat
      - -c
      - "%u:%g"
      - "{{ item.path }}"
  loop: "{{ infra_namespaced_appdata }}"
  loop_control:
    label: "{{ item.path }}"
  register: infra_namespaced_appdata_owners
  changed_when: false

- name: Give container users ownership of namespaced infra appdata
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - chown
      - -R
      - "{{ item.item.uid }}:{{ item.item.gid }}"
      - "{{ item.item.path }}"
  loop: "{{ infra_namespaced_appdata_owners.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: >-
    item.stdout | trim
    != (item.item.uid | string) ~ ':' ~ (item.item.gid | string)
  register: infra_namespaced_appdata_chowns
  changed_when: true

- name: Install the NetBox private network Quadlet
  ansible.builtin.copy:
    src: quadlets/netbox.network
    dest: /opt/homelab/.config/containers/systemd/netbox.network
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_netbox_network

- name: Require NetBox secrets
  ansible.builtin.assert:
    that:
      - (vault_netbox_db_password | default('')) | length > 0
      - (vault_netbox_secret_key | default('')) | length >= 50
      - (vault_netbox_redis_password | default('')) | length > 0
      - (vault_netbox_superuser_password | default('')) | length > 0
    fail_msg: >-
      Configure vault_netbox_db_password, vault_netbox_secret_key (NetBox
      requires 50+ characters), vault_netbox_redis_password, and
      vault_netbox_superuser_password in the encrypted inventory.
  no_log: true
  diff: false

- name: Render the NetBox database Quadlet
  ansible.builtin.template:
    src: netbox-db.container.j2
    dest: /opt/homelab/.config/containers/systemd/netbox-db.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds POSTGRES_PASSWORD on an Environment= line.
    mode: "0600"
  register: infra_netbox_db_template
  no_log: true
  diff: false

- name: Render the NetBox redis Quadlet
  ansible.builtin.template:
    src: netbox-redis.container.j2
    dest: /opt/homelab/.config/containers/systemd/netbox-redis.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds the redis requirepass on the Exec= line.
    mode: "0600"
  register: infra_netbox_redis_template
  no_log: true
  diff: false

- name: Render the NetBox Quadlet
  ansible.builtin.template:
    src: netbox.container.j2
    dest: /opt/homelab/.config/containers/systemd/netbox.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds DB/REDIS/SECRET_KEY/SUPERUSER secrets on
    # Environment= lines.
    mode: "0600"
  register: infra_netbox_template
  no_log: true
  diff: false

- name: Check the Immich photo library directory on the NFS export
  ansible.builtin.command: test -d /srv/media/photos
  register: infra_immich_photos_dir
  failed_when: false
  changed_when: false
  check_mode: false

# NFS root-squash: create the library dir as the service UID, not root (same
# idiom as svc_media/tasks/nfs.yml). Immich (container-root == host homelab)
# then owns it and can write uploads/thumbs there.
- name: Create the Immich photo library directory as the service UID
  ansible.builtin.command: >-
    setpriv --reuid={{ svc_uid }} --regid={{ svc_gid }} --clear-groups --
    mkdir -p /srv/media/photos
  when: infra_immich_photos_dir.rc != 0
  changed_when: true

- name: Install the Immich private network Quadlet
  ansible.builtin.copy:
    src: quadlets/immich.network
    dest: /opt/homelab/.config/containers/systemd/immich.network
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_immich_network

- name: Require the Immich database password
  ansible.builtin.assert:
    that:
      - (vault_immich_db_password | default('')) | length > 0
    fail_msg: >-
      Configure vault_immich_db_password (openssl rand -hex 24) in the
      encrypted inventory.
  no_log: true
  diff: false

- name: Render the Immich database Quadlet
  ansible.builtin.template:
    src: immich-db.container.j2
    dest: /opt/homelab/.config/containers/systemd/immich-db.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds POSTGRES_PASSWORD on an Environment= line.
    mode: "0600"
  register: infra_immich_db_template
  no_log: true
  diff: false

- name: Render the Immich redis Quadlet
  ansible.builtin.template:
    src: immich-redis.container.j2
    dest: /opt/homelab/.config/containers/systemd/immich-redis.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_immich_redis_template

- name: Render the Immich server Quadlet
  ansible.builtin.template:
    src: immich-server.container.j2
    dest: /opt/homelab/.config/containers/systemd/immich-server.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds DB_PASSWORD on an Environment= line.
    mode: "0600"
  register: infra_immich_server_template
  no_log: true
  diff: false

# NOTE the deliberate absence of owner/group here, unlike every other appdata
# directory in this role. These two are owned by the container's www-data (a
# subuid), applied by the `podman unshare chown` task below. Enforcing
# owner: homelab here as well would fight that chown — each converge would
# reset it, the chown would set it back, and the play would report `changed`
# forever while restarting Nextcloud every run.
# mode is deliberately unmanaged too: Nextcloud tightens its data directory to
# 0770 on install and re-asserting 0755 here would loosen it back every
# converge — another permanent `changed` flip-flop, and a small security
# regression each time. Existence is all this task needs to guarantee.
- name: Create the Nextcloud app and user-files directories
  ansible.builtin.file:
    path: "/opt/homelab/appdata/{{ item }}"
    state: directory
  loop: [nextcloud, nextcloud-data]

# nextcloud-data holds user uploads and is deliberately NOT under the tarred
# `nextcloud` backup path, so the nightly tar stays limited to the small
# app/config tree. It is local rather than on the NFS export because the
# image chowns its data dir to www-data, which cannot work against a
# root-squashed export under rootless podman — see the long explanation in
# nextcloud.container.j2.
- name: Create the Nextcloud database directory
  ansible.builtin.file:
    path: /opt/homelab/appdata/nextcloud-db
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  # No nextcloud-redis directory: that cache is volume-less on purpose, see
  # nextcloud-redis.container.j2.

# Nextcloud's Apache master starts as root but forks its PHP workers as
# www-data (uid 33 INSIDE the container), and those workers are what write
# files. Under rootless podman container-uid 33 maps to a host SUBUID, never
# to the homelab user that owns these bind mounts — so the workers get EACCES
# and Nextcloud serves 503 with "Your data directory is not writable". The
# image's own `rsync --chown www-data:root` does not fix the mount points
# themselves.
#
# `podman unshare` runs the chown INSIDE the user namespace, so "33" resolves
# to whatever host subuid podman actually maps it to — correct without
# hardcoding a subuid that would differ per host or drift if /etc/subuid
# changes. Gated on a stat so the recursive chown does not re-run (and does
# not walk a large data dir) on every converge.
- name: Read the namespaced owner of the Nextcloud bind mounts
  ansible.builtin.command:
    # chdir: runuser keeps the caller's cwd, and Ansible runs from the
    # connecting user's home, which the homelab account cannot enter
    # ("cannot chdir to /home/straderb: Permission denied").
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - stat
      - -c
      - "%u:%g"
      - "/opt/homelab/appdata/{{ item }}"
  loop: [nextcloud, nextcloud-data]
  register: infra_nextcloud_mount_owner
  changed_when: false

- name: Give the Nextcloud container user ownership of its bind mounts
  ansible.builtin.command:
    chdir: /
    argv:
      - runuser
      - -u
      - homelab
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ svc_uid }}"
      - podman
      - unshare
      - chown
      - -R
      - "33:33"
      - "/opt/homelab/appdata/{{ item.item }}"
  loop: "{{ infra_nextcloud_mount_owner.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim != "33:33"
  changed_when: true
  notify: infra configuration changed

- name: Install the Nextcloud private network Quadlet
  ansible.builtin.copy:
    src: quadlets/nextcloud.network
    dest: /opt/homelab/.config/containers/systemd/nextcloud.network
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_nextcloud_network

- name: Require Nextcloud secrets
  ansible.builtin.assert:
    that:
      - (vault_nextcloud_db_password | default('')) | length > 0
      - (vault_nextcloud_admin_password | default('')) | length > 0
      # Non-empty is not enough: a var still holding its
      # all_vault.yml.example REPLACE_* placeholder would otherwise sail
      # through and become the live DB/admin password. Same guard the
      # infra_secret_apps require_vault assert applies.
      - not ((vault_nextcloud_db_password | default('')) is match('REPLACE_'))
      - not ((vault_nextcloud_admin_password | default('')) is match('REPLACE_'))
    fail_msg: >-
      Configure vault_nextcloud_db_password and vault_nextcloud_admin_password
      (openssl rand -hex 24) in the encrypted inventory — they must be set and
      must not still be the REPLACE_* example placeholders.
  no_log: true
  diff: false

- name: Render the Nextcloud database Quadlet
  ansible.builtin.template:
    src: nextcloud-db.container.j2
    dest: /opt/homelab/.config/containers/systemd/nextcloud-db.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds POSTGRES_PASSWORD on an Environment= line.
    mode: "0600"
  register: infra_nextcloud_db_template
  no_log: true
  diff: false

- name: Render the Nextcloud redis Quadlet
  ansible.builtin.template:
    src: nextcloud-redis.container.j2
    dest: /opt/homelab/.config/containers/systemd/nextcloud-redis.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_nextcloud_redis_template

- name: Render the Nextcloud Quadlet
  ansible.builtin.template:
    src: nextcloud.container.j2
    dest: /opt/homelab/.config/containers/systemd/nextcloud.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds POSTGRES_PASSWORD/NEXTCLOUD_ADMIN_PASSWORD on
    # Environment= lines.
    mode: "0600"
  register: infra_nextcloud_template
  no_log: true
  diff: false

- name: Ensure the Beszel agent appdata directory exists
  ansible.builtin.file:
    path: /opt/homelab/appdata/beszel-agent
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"
  when: beszel_agent_enabled | bool

- name: Render the Beszel agent Quadlet
  ansible.builtin.template:
    src: beszel-agent.container.j2
    dest: /opt/homelab/.config/containers/systemd/beszel-agent.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    # 0600: this quadlet embeds the Beszel TOKEN/KEY on Environment= lines.
    mode: "0600"
  register: infra_beszel_agent_template
  when: beszel_agent_enabled | bool
  no_log: true
  diff: false

- name: WARN that the Beszel agent is not yet configured
  ansible.builtin.debug:
    msg: >-
      *** WARNING: the Beszel token and key are empty — the
      Beszel agent on {{ inventory_hostname }} is NOT deployed. Visit
      https://beszel.{{ service_domain }}, create a universal token under
      Settings > Tokens, fill both vault vars, and re-run the deploy. See
      docs/services.md "Beszel monitoring setup". ***
  when: not (beszel_agent_enabled | bool)

# --- Monitoring stack: node_exporter (bespoke, like beszel-agent) + the
# supplementary config renders for the Prometheus/Grafana catalog entries.
- name: Render the node_exporter Quadlet
  ansible.builtin.template:
    src: node-exporter.container.j2
    dest: /opt/homelab/.config/containers/systemd/node-exporter.container
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_node_exporter_template

- name: Render the Prometheus scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/homelab/appdata/prometheus/etc/prometheus.yml
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_prometheus_config

- name: Ensure the Grafana datasource provisioning directory exists
  ansible.builtin.file:
    path: /opt/homelab/appdata/grafana/provisioning/datasources
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

- name: Render the Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /opt/homelab/appdata/grafana/provisioning/datasources/prometheus.yml
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_grafana_datasource

- name: Create the Grafana dashboard provisioning directory
  ansible.builtin.file:
    path: /opt/homelab/appdata/grafana/provisioning/dashboards
    state: directory
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0755"

- name: Render the Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: /opt/homelab/appdata/grafana/provisioning/dashboards/provider.yml
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  register: infra_grafana_dashboard_provider

# Dashboards are plain JSON, copied not templated: Grafana's dashboard JSON has
# no room for comments and the datasource is bound by the stable uid set in
# grafana-datasource.yml.j2, so there is nothing host-specific to interpolate.
- name: Install the Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/homelab/appdata/grafana/provisioning/dashboards/{{ item | basename }}"
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  with_fileglob: "grafana-dashboards/*.json"
  register: infra_grafana_dashboards

# Home Assistant refuses proxied requests with a bare "400: Bad Request" until
# it is told which proxy to trust — so https://home-assistant.<domain> is dead
# on arrival even though DNS, TLS and Caddy are all correct. This was a manual
# follow-up from the first service batch; automate it instead.
#
# blockinfile, NOT template: configuration.yaml is Home Assistant's own file.
# HA itself, its File Editor add-on and its UI all write to it, so rendering
# the whole file from this repo would silently destroy the user's automations
# on the next converge. The marker keeps this repo's edit surgical and
# idempotent.
- name: Read Home Assistant's configuration if it has been onboarded
  ansible.builtin.slurp:
    src: /opt/homelab/appdata/home-assistant/configuration.yaml
  register: infra_ha_config
  failed_when: false

# `http:` is a top-level YAML key, so adding ours when the user already has one
# would produce a duplicate key and Home Assistant would refuse to start. Detect
# an http: block that is NOT the one this repo manages, and stand down if found
# rather than breaking their instance.
- name: Determine whether Home Assistant's proxy config is safe to manage
  ansible.builtin.set_fact:
    infra_ha_content: "{{ (infra_ha_config.content | default('') | b64decode) }}"

- name: Note a hand-written Home Assistant http block
  ansible.builtin.debug:
    msg: >-
      configuration.yaml already defines a top-level `http:` key that this repo
      did not write — leaving it alone. Add
      `trusted_proxies: [{{ hostvars[media_host].ansible_host }}]` to it by hand,
      or remove it to let this role manage the block.
  when:
    - infra_ha_config.content is defined
    - infra_ha_content is search('(?m)^http:')
    - not (infra_ha_content is search('ANSIBLE MANAGED — reverse proxy'))

# Gated on the file existing: on a brand-new instance Home Assistant writes
# configuration.yaml itself during first start, and injecting a partial config
# before that would leave it unable to boot.
- name: Trust the Caddy proxy in Home Assistant's configuration
  ansible.builtin.blockinfile:
    path: /opt/homelab/appdata/home-assistant/configuration.yaml
    marker: "# {mark} ANSIBLE MANAGED — reverse proxy (roles/svc_infra)"
    block: |
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          - {{ hostvars[media_host].ansible_host }}
    owner: "{{ svc_uid }}"
    group: "{{ svc_gid }}"
    mode: "0644"
  when:
    - infra_ha_config.content is defined
    - (not (infra_ha_content is search('(?m)^http:')))
      or infra_ha_content is search('ANSIBLE MANAGED — reverse proxy')
  register: infra_ha_proxy_config

- name: Start firewalld before opening catalog service ports
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: (infra_apps | combine(infra_secret_apps | default({}))) | length > 0

# Every catalog app (plain and secret) publishes on svc-infra's LAN IP (see
# infra-app.container.j2) so Caddy on {{ media_host }} can reach it — open
# ui_port (always tcp) to the LAN here, matching svc_media's equivalent task.
# Loop over just the port numbers, NOT the catalog entries: a secret app's
# entry carries its resolved PASSWORD in item.value.env, which Ansible would
# surface on a task failure or under -vvv; a bare port list can't leak it.
- name: Open LAN-scoped infra catalog service ports
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port={{ item }} protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled
  loop: >-
    {{ (infra_apps | combine(infra_secret_apps | default({}))).values()
       | map(attribute='ui_port') | list }}
  loop_control:
    label: "{{ item }}"

# extra_ports (e.g. Syncthing's sync/discovery ports) aren't reached through
# Caddy, just opened directly — a separate task since each entry already
# carries its own protocol, unlike ui_port above. These sub-entries are plain
# {port, protocol} dicts (no secret), so folding both catalogs in is safe.
- name: Open LAN-scoped infra catalog extra ports
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port={{ item.port }} protocol={{ item.protocol }} accept
    permanent: true
    immediate: true
    state: enabled
  loop: >-
    {{ (infra_apps | combine(infra_secret_apps | default({}))).values()
       | map(attribute='extra_ports', default=[])
       | list | flatten | unique | list }}
  loop_control:
    label: "{{ item.port }}/{{ item.protocol }}"

- name: Open Paperless-ngx to the LAN
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port=8000 protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

- name: Open NetBox to the LAN
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port=8080 protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

- name: Open Immich to the LAN
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port=2283 protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

- name: Open Nextcloud to the LAN
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ lan_cidr }} port
      port=8081 protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

# node_exporter is a scrape target, not a user-facing UI: open :9100 ONLY to
# Prometheus's own host (svc-infra), a single source address, not lan_cidr.
- name: Open node_exporter to Prometheus only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ hostvars[infra_host].ansible_host }}/32
      port port=9100 protocol=tcp accept
    permanent: true
    immediate: true
    state: enabled

- name: Calculate infra services whose rendered configuration changed
  ansible.builtin.set_fact:
    infra_services_to_restart: >-
      {{
        (
          infra_quadlet_templates.results
          | selectattr('changed')
          | map(attribute='item.key')
          | list
        )
        + (
          infra_secret_quadlet_templates.results | default([])
          | selectattr('changed')
          | map(attribute='item.key')
          | list
        )
        + (['beszel-agent'] if (infra_beszel_agent_template.changed | default(false)) else [])
        + (['node-exporter'] if (infra_node_exporter_template.changed | default(false)) else [])
        + (['prometheus'] if (infra_prometheus_config.changed | default(false)) else [])
        + (['grafana'] if (infra_grafana_datasource.changed | default(false)
                           or infra_grafana_dashboard_provider.changed | default(false)
                           or infra_grafana_dashboards.changed | default(false)) else [])
        + (['paperless-redis', 'paperless'] if (infra_paperless_network.changed | default(false)) else [])
        + (['paperless-redis'] if (infra_paperless_redis_template.changed | default(false)) else [])
        + (['paperless'] if (infra_paperless_template.changed | default(false)) else [])
        + (['netbox-db', 'netbox-redis', 'netbox'] if (infra_netbox_network.changed | default(false)) else [])
        + (['netbox-db'] if (infra_netbox_db_template.changed | default(false)) else [])
        + (['netbox-redis'] if (infra_netbox_redis_template.changed | default(false)) else [])
        + (['netbox'] if (infra_netbox_template.changed | default(false)) else [])
        + (['immich-db', 'immich-redis', 'immich-server'] if (infra_immich_network.changed | default(false)) else [])
        + (['immich-db'] if (infra_immich_db_template.changed | default(false)) else [])
        + (['immich-redis'] if (infra_immich_redis_template.changed | default(false)) else [])
        + (['immich-server'] if (infra_immich_server_template.changed | default(false)) else [])
        + (['nextcloud-db', 'nextcloud-redis', 'nextcloud'] if (infra_nextcloud_network.changed | default(false)) else [])
        + (['nextcloud-db'] if (infra_nextcloud_db_template.changed | default(false)) else [])
        + (['nextcloud-redis'] if (infra_nextcloud_redis_template.changed | default(false)) else [])
        + (['nextcloud'] if (infra_nextcloud_template.changed | default(false)) else [])
        + (['home-assistant'] if (infra_ha_proxy_config.changed | default(false)) else [])
        + (
          infra_namespaced_appdata_chowns.results | default([])
          | selectattr('changed')
          | map(attribute='item.item.restart_services')
          | list
          | flatten
        )
      }}
  changed_when: infra_services_to_restart | length > 0
  notify: infra configuration changed
