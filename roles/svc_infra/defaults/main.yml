---
# Bespoke multi-container services (a database/cache sidecar) aren't in the
# single-container infra_apps catalog (inventory/group_vars/all/infra-apps.yml)
# — each such service's branch appends a `+ ([...] if condition else [])`
# clause here so apps.yml/verify.yml/backup.yml still cover it uniformly,
# without needing to know which category a service belongs to. See
# roles/svc_media/tasks/files.yml + apps.yml for the equivalent hand-maintained
# pattern (media_quadlet_catalog there mixes catalog and bespoke entries).
infra_extra_service_names: >-
  {{ (['beszel-agent'] if beszel_agent_enabled | bool else [])
     + ['node-exporter']
     + ['paperless-redis', 'paperless']
     + ['netbox-db', 'netbox-redis', 'netbox']
     + ['immich-db', 'immich-redis', 'immich-server']
     + ['nextcloud-db', 'nextcloud-redis', 'nextcloud'] }}

# Appdata-tar backup coverage for bespoke (non-catalog) services — appended
# the same way as infra_extra_service_names above. Excluded on purpose:
# beszel-agent/paperless-redis/netbox-redis/nextcloud-redis (no real state),
# and the Postgres data dirs (netbox-db/immich-db/nextcloud-db) — those are
# subuid-owned so the homelab tar can't read them, and a raw datadir tar isn't
# a consistent DB backup anyway. The databases are instead captured by
# application-consistent pg_dumpall (see infra_db_backups below). The netbox/
# appdata that IS tarred here is just uploaded media/reports/scripts
# (homelab-owned via the User=0 quadlet); the Immich photo library lives on
# the NFS media export (/srv/media/photos, backed up at the NAS layer, not in
# this tar). The nextcloud/ appdata that IS tarred here is just the small app
# code/config tree; Nextcloud's USER FILES sit in a separate local
# nextcloud-data/ directory that is deliberately absent from this list, so the
# tar never grows to include arbitrary uploads — note that leaves those files
# unbacked-up, see nextcloud.container.j2 for why they are not on NFS and how
# to move bulk data to the NAS via External Storage. immich-redis/
# nextcloud-redis are disposable caches.
infra_extra_backup_paths: [paperless, netbox, nextcloud]

# Bespoke Postgres databases captured by an application-consistent pg_dumpall
# via `podman exec` in the nightly backup (mirrors backup-media.sh's romm-db
# mariadb-dump). Each name is the container name AND the .sql.gz artifact base
# name; the dump reads POSTGRES_USER/POSTGRES_DB from the container's own env,
# so nothing here needs the db/user spelled out. pg_dumpall --clean --if-exists
# captures roles+globals and restores over an existing cluster; it is also the
# form Immich's backup docs specify for its vectorchord-patched cluster.
infra_db_backups: [netbox-db, immich-db, nextcloud-db]

# These bind mounts are written directly by non-root processes inside
# rootless containers. Their IDs are namespaced and must not be reset to the
# host homelab account on every converge.
infra_namespaced_appdata:
  - path: /opt/homelab/appdata/netbox-redis
    uid: 999
    gid: 1000
    restart_services: [netbox-redis, netbox]
  - path: /opt/homelab/appdata/immich-db
    uid: 999
    gid: 999
    restart_services: [immich-db, immich-server]

# Every infra service, whether catalog-driven or bespoke, funnels through
# this one name list so apps.yml/verify.yml don't need to know which category
# a service belongs to. A plain default (not set_fact) so it's available
# however the role is entered — including standalone `verify.yml`, which only
# runs tasks_from: verify and never executes files.yml.
infra_service_names: >-
  {{ (infra_apps.keys() | list)
     + ((infra_secret_apps | default({})).keys() | list)
     + infra_extra_service_names }}

# The Authelia accounts. Each entry's `name` is both the login and the local
# part of its email address (authelia-users.yml.j2). Passwords are NOT here:
# vault_authelia_password_hashes maps name -> argon2id PHC string, and
# files.yml asserts every name below has an entry there before rendering.
#
# The split is deliberate. Who exists, what they are called and what they can
# reach are not secrets and belong in a reviewable diff — that is the whole
# reason this estate runs Authelia's file backend instead of LDAP (see
# authelia-configuration.yml.j2). Only the hashes live in the vault.
#
# `groups` drives authorization through access_control.rules in
# authelia-configuration.yml.j2, which denies by default. Adding a user here
# grants them NOTHING until a rule names their group; tests/validate_sso.py
# fails the build if a group used here has no rule, or if no rule grants
# `admins` (that one would lock everybody out of everything).
#
# `admin` is the estate's original account. It stays permanently (decided
# 2026-07-30) — it is not a placeholder pending brandon's cutover, so do not
# remove it once brandon has a real password. Both admin and brandon get real,
# distinct hashes in vault_authelia_password_hashes; deliberately, neither gets
# an entry in vault_authelia_password_plaintexts the way valerie/michael/erin/
# guest do — nothing here requires that dict to be complete.
authelia_users:
  - { name: admin,   displayname: Admin,   groups: [admins] }
  - { name: brandon, displayname: Brandon, groups: [admins] }
  - { name: valerie, displayname: Valerie, groups: [family] }
  - { name: michael, displayname: Michael, groups: [family] }
  - { name: erin,    displayname: Erin,    groups: [family] }
  # Not disabled, but deny-by-default means this reaches nothing today. Set
  # `disabled: true` on the entry to park it without deleting the account.
  - { name: guest,   displayname: Guest,   groups: [guests] }

# The name of the vault variable holding the password hashes, as a string.
# Held here rather than written literally into files.yml because
# tests/validate_secret_tasks.py treats any `vault_` token in a task as a
# secret reference and would demand no_log on the assert whose entire purpose
# is to print a legible message. Same reason, same shape, as
# verify_runner_secret_file below. This file is not scanned by that test.
authelia_hashes_var: vault_authelia_password_hashes

# --- nightly verification runner ------------------------------------------
# `make verify` moves off the workstation and onto this VM so it keeps
# running while nobody is home. See roles/svc_infra/tasks/verify-runner.yml.
verify_runner_user: svcops
verify_runner_root: /opt/homelab-iac
# Staging path on the CONTROL node (the workstation), not on the VM.
verify_runner_archive: /tmp/homelab-iac-runner.tar
# The vault password file the runner decrypts with. Held as a variable so the
# literal filename does not appear in task or template sources: it reads as a
# secret to tests/validate_secret_tasks.py, which would then demand no_log on
# the assert whose whole purpose is to print a loud message.
verify_runner_secret_file: "{{ verify_runner_root }}/.vault_pass"

# The nightly security scan reuses this same runner — same checkout, same
# svcops account, same venv, same SSH keys; only the units, the wrapper and the
# playbook are its own. Its paths live in inventory/group_vars/all/main.yml
# rather than here, because scan.yml's reporting play does not apply this role
# and so would never see role defaults.

# --- chat egress -----------------------------------------------------------
# ONE definition of open-webui cgroup path. The nft policy, the apply script
# and the confirm assertion in chat-egress.yml all read it from here, because
# three hand-written copies of this string is exactly the drift that
# tests/validate_chat_egress.py exists to catch. The components are asserted
# against chat_egress_cgroup_level by that gate: the level IS the component
# count, and a level one too small matches app.slice, i.e. every rootless
# container on the host rather than just chat.
chat_egress_cgroup_path: >-
  user.slice/user-{{ svc_uid }}.slice/user@{{ svc_uid }}.service/app.slice/{{ chat_egress_unit }}
# How long the boot loader waits for that cgroup to exist before giving up.
# nft refuses to load a ruleset naming a cgroup that is not there, and
# multi-user.target is reached ~1.5-2s before the rootless user manager has
# created it. 120s is slack for a slow boot, not a measured requirement.
chat_egress_wait_seconds: 120
