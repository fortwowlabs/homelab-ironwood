---
- name: Verify the PVE monitoring timers are active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item.1 }}"
      - "{{ item.0 }}"
  loop: >-
    {{ ['homelab-diskguard.timer', 'homelab-nfsguard.timer', 'homelab-pve-health.timer']
       | product(['is-active', 'is-enabled']) | list }}
  loop_control:
    label: "{{ item.1 }} {{ item.0 }}"
  changed_when: false

# --- the storage guard's positive control --------------------------------
# `--check` runs the guard's real probe path and prints its verdict without
# alerting or writing state. Asserting it says `ok` while TrueNAS is up is a
# genuine positive control: a typo'd port, a wrong VMID, a `qm` that moved or a
# broken /dev/tcp connect all come back `inconclusive` or `down` and fail here,
# rather than leaving a guard that has quietly stopped being able to notice an
# outage.
#
# This is the property CLAUDE.md says the credential canary lacks — "a check
# with no positive control is a check nobody can tell is broken". It works here
# only because the healthy state is observable on demand: storage is normally
# up, so `ok` is something that MUST be true if the probe really ran.
#
# It is not a test of the alert path. It proves the guard can measure, not that
# ntfy delivers; delivery is exercised by the same notify-failure@ mechanism
# every other unit on this host uses.
- name: Run the storage guard's probe without alerting
  ansible.builtin.command: /usr/local/sbin/pve-nfsguard.sh --check
  register: pve_nfsguard_check
  changed_when: false

- name: Assert the storage guard can see NFS being served
  ansible.builtin.assert:
    that:
      - (pve_nfsguard_check.stdout | default('') | trim) == 'ok'
    fail_msg: >-
      pve-nfsguard.sh --check reported
      '{{ pve_nfsguard_check.stdout | default('(no output)') | trim }}'
      rather than 'ok'
      ({{ pve_nfsguard_check.stderr | default('') | trim }}).
      Either storage really is down, or the guard has lost the ability to
      measure it — in which case an outage would now pass unreported, which is
      what happened on 2026-08-04.
    success_msg: >-
      Storage guard probes NFS successfully (verdict ok).
    quiet: true

# is-enabled as well as is-active: a daemon that is running but disabled passes
# every liveness check and then vanishes at the next reboot, which for a
# hypervisor that is expected to run unattended for months is the whole failure.
- name: Verify the event-delivery daemons are running and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item.1 }}"
      - "{{ item.0 }}"
  loop: "{{ ['zfs-zed', 'smartmontools'] | product(['is-active', 'is-enabled']) | list }}"
  loop_control:
    label: "{{ item.1 }} {{ item.0 }}"
  changed_when: false

# Reading zed.rc back is the point: a stock PVE upgrade rewrites files under
# /etc/zfs/zed.d, and a reverted ZED_EMAIL_PROG would silently send pool
# alerts to unread local mail again — the exact state this role replaced.
- name: Read the zed configuration
  ansible.builtin.slurp:
    src: /etc/zfs/zed.d/zed.rc
  register: pve_zed_config

- name: Assert zed still points at the ntfy hook
  ansible.builtin.assert:
    that:
      - "'ZED_EMAIL_PROG=\"/usr/local/sbin/zed-ntfy.sh\"' in (pve_zed_config.content | b64decode)"
    fail_msg: >-
      zed is no longer configured to use the ntfy hook; ZFS pool events would
      go to unread local root mail.

- name: Read the smartd configuration
  ansible.builtin.slurp:
    src: /etc/smartd.conf
  register: pve_smartd_config

- name: Assert smartd still points at the ntfy hook
  ansible.builtin.assert:
    that:
      - "'/usr/local/sbin/smartd-ntfy.sh' in (pve_smartd_config.content | b64decode)"
    fail_msg: >-
      smartd is no longer configured to use the ntfy hook; disk warnings would
      go to unread local root mail.

# Run the health check rather than trusting that its timer exists — this is
# the assertion that pools are actually healthy and scrubs are still running.
- name: Verify the PVE host reports healthy
  ansible.builtin.command: /usr/local/sbin/pve-health.sh
  changed_when: false

# Same check and same reasoning as roles/service_vm/tasks/verify.yml: assert the
# rendered file rather than the vault variable, because it is what pve-health.sh
# actually pings with and it is present regardless of whether the vault is.
# This host renders only HC_PING_PVE, but the regex is key-agnostic so it stays
# correct if another is ever added.
- name: Read the healthchecks.io ping configuration
  ansible.builtin.slurp:
    src: /etc/homelab-healthchecks.env
  register: pve_mon_hc_env
  no_log: true

# Same split as roles/service_vm/tasks/verify.yml: the slurp keeps no_log
# because its result is the file itself, this assert drops it because its
# result is one boolean from a regex match plus the fail_msg — and no_log
# censors the whole task result, so it was suppressing the very message this
# task exists to print. pve_hc_ping_var (roles/pve_mon/defaults) holds the var
# NAME so no literal `vault_` token appears here; that token is what
# tests/validate_secret_tasks.py keys on to demand no_log.
- name: Assert every healthchecks.io ping UUID is configured
  ansible.builtin.assert:
    that:
      - not ((pve_mon_hc_env.content | b64decode) is search("(?m)^HC_PING_[A-Z_]+=(''|\"\"|)$"))
    fail_msg: >-
      /etc/homelab-healthchecks.env on {{ inventory_hostname }} has an empty
      HC_PING_* value, so the hypervisor's healthchecks.io check will never be
      pinged — and this host is the one whose death takes every VM with it, so
      its silence is the signal that matters most. Set {{ pve_hc_ping_var }}
      and run `make pve`; editing the vault alone changes nothing on the host.
  diff: false

# --- Boot ordering -----------------------------------------------------------
#
# The storage server must start BEFORE the VMs that mount it and stop AFTER
# them. In Proxmox that is one property: shutdown is the reverse of start
# order, so `order=1` on TrueNAS buys both directions.
#
# This is asserted against the live hypervisor rather than against the repo
# because the repo does not own it — TrueNAS is a hand-managed guest — and
# because the previous mechanism was a COMMENT in svc-media.yml reading
# "TrueNAS is order=1 (set once, out of band)". That comment was false. The VM
# had no `startup` line at all, so Proxmox started it after every ordered VM
# and stopped it first, and nothing anywhere noticed for months.
#
# The cost, measured on 2026-08-04: five of nine download services dead on
# boot (their NFS mount timed out 26 seconds before it would have succeeded),
# and nine SIGKILLed postgres processes on shutdown (the clients wedged in
# uninterruptible NFS I/O once the server vanished under them).
#
# A restored-or-rebuilt PVE loses this silently, which is exactly why it is a
# gate and not a runbook step.
- name: Read the storage VM's Proxmox startup configuration
  ansible.builtin.command: qm config {{ truenas_vmid }}
  register: pve_truenas_config
  changed_when: false
  check_mode: false

- name: Assert the storage VM boots before, and stops after, its clients
  ansible.builtin.assert:
    that:
      # Two separate conditions so the failure message distinguishes them.
      # "could not look" is a distinct outcome from "looked and it was wrong":
      # an empty/failed qm read must not pass as a satisfied order.
      - pve_truenas_config.stdout | length > 0
      # `(,|$)` rather than a `\b` word boundary on purpose: Jinja parses the
      # string as a Python literal first, so '\border=' becomes a BACKSPACE
      # followed by "order=" and the pattern can never match. That produced a
      # gate which failed against a correctly configured host — caught only
      # because the fail_msg quotes the line it just rejected.
      # `order=1(,|$)` also refuses to match `order=10,`.
      - pve_truenas_config.stdout
        is search('(?m)^startup:.*order=' ~ truenas_expected_startup_order ~ '(,|$)')
    fail_msg: >-
      VM {{ truenas_vmid }} (TrueNAS, the NFS server for every service VM) does
      not report
      `startup: order={{ truenas_expected_startup_order }}` on {{ inventory_hostname }}.
      Proxmox starts VMs with no startup order AFTER all ordered VMs and stops
      them FIRST, so the storage server would boot last and die first. Fix with:
        qm set {{ truenas_vmid }} -startup order={{ truenas_expected_startup_order }},up=120,down=180
      Observed startup line:
      "{{ pve_truenas_config.stdout_lines | default([]) | select('match', '^startup:') | list | join(' ') | default('(none present)', true) }}"
      See docs/plans/cold-start-resilience.md.
    success_msg: >-
      TrueNAS (VM {{ truenas_vmid }}) is order={{ truenas_expected_startup_order }};
      it boots before its NFS clients and stops after them.
    quiet: true

- name: Mark PVE monitoring verification complete
  ansible.builtin.set_fact:
    pve_mon_verified: true
