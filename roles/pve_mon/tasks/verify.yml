---
- name: Verify the PVE monitoring timers are active and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item.1 }}"
      - "{{ item.0 }}"
  loop: "{{ ['homelab-diskguard.timer', 'homelab-pve-health.timer'] | product(['is-active', 'is-enabled']) | list }}"
  loop_control:
    label: "{{ item.1 }} {{ item.0 }}"
  changed_when: false

# is-enabled as well as is-active: a daemon that is running but disabled passes
# every liveness check and then vanishes at the next reboot, which for a
# hypervisor that is expected to run unattended for months is the whole failure.
- name: Verify the event-delivery daemons are running and enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item.1 }}"
      - "{{ item.0 }}"
  loop: "{{ ['zfs-zed', 'smartmontools'] | product(['is-active', 'is-enabled']) | list }}"
  loop_control:
    label: "{{ item.1 }} {{ item.0 }}"
  changed_when: false

# Reading zed.rc back is the point: a stock PVE upgrade rewrites files under
# /etc/zfs/zed.d, and a reverted ZED_EMAIL_PROG would silently send pool
# alerts to unread local mail again — the exact state this role replaced.
- name: Read the zed configuration
  ansible.builtin.slurp:
    src: /etc/zfs/zed.d/zed.rc
  register: pve_zed_config

- name: Assert zed still points at the ntfy hook
  ansible.builtin.assert:
    that:
      - "'ZED_EMAIL_PROG=\"/usr/local/sbin/zed-ntfy.sh\"' in (pve_zed_config.content | b64decode)"
    fail_msg: >-
      zed is no longer configured to use the ntfy hook; ZFS pool events would
      go to unread local root mail.

- name: Read the smartd configuration
  ansible.builtin.slurp:
    src: /etc/smartd.conf
  register: pve_smartd_config

- name: Assert smartd still points at the ntfy hook
  ansible.builtin.assert:
    that:
      - "'/usr/local/sbin/smartd-ntfy.sh' in (pve_smartd_config.content | b64decode)"
    fail_msg: >-
      smartd is no longer configured to use the ntfy hook; disk warnings would
      go to unread local root mail.

# Run the health check rather than trusting that its timer exists — this is
# the assertion that pools are actually healthy and scrubs are still running.
- name: Verify the PVE host reports healthy
  ansible.builtin.command: /usr/local/sbin/pve-health.sh
  changed_when: false

# Same check and same reasoning as roles/service_vm/tasks/verify.yml: assert the
# rendered file rather than the vault variable, because it is what pve-health.sh
# actually pings with and it is present regardless of whether the vault is.
# This host renders only HC_PING_PVE, but the regex is key-agnostic so it stays
# correct if another is ever added.
- name: Read the healthchecks.io ping configuration
  ansible.builtin.slurp:
    src: /etc/homelab-healthchecks.env
  register: pve_mon_hc_env
  no_log: true

- name: Assert every healthchecks.io ping UUID is configured
  ansible.builtin.assert:
    that:
      - not ((pve_mon_hc_env.content | b64decode) is search("(?m)^HC_PING_[A-Z_]+=(''|\"\"|)$"))
    fail_msg: >-
      /etc/homelab-healthchecks.env on {{ inventory_hostname }} has an empty
      HC_PING_* value, so the hypervisor's healthchecks.io check will never be
      pinged — and this host is the one whose death takes every VM with it, so
      its silence is the signal that matters most. Set vault_hc_ping_pve and
      run `make pve`; editing the vault alone changes nothing on the host.
  no_log: true
  diff: false

- name: Mark PVE monitoring verification complete
  ansible.builtin.set_fact:
    pve_mon_verified: true
