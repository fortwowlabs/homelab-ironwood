# gitleaks configuration — a second opinion beside the four hand-rolled secret
# gates in tests/.
#
# Why both. validate_secrets.py and scan_history_secrets.py carry a SIGNATURES
# tuple maintained by hand: private keys, AWS, GitHub, Slack, JWT. That list is
# good for what it names and blind to everything else, and nothing prompts
# anyone to extend it. gitleaks ships ~170 upstream rules and is updated by
# people watching credential formats full-time. The hand-rolled gates stay:
# they encode repo-specific knowledge (the vault_ naming convention, the
# placeholder forms used in all_vault.yml.example) that a generic scanner has
# no way to know.
#
# Scope: the working tree only. Git history is already covered by
# tests/scan_history_secrets.py, which walks every reachable blob.

[extend]
useDefault = true

[[allowlists]]
description = """
Vendored and generated trees. These are gitignored and untracked — installed by
`make deps` and removed by `make clean` — so they are not this repo's code and
cannot reach a commit. community.proxmox ships example API tokens and a test
private key in its own docs and unit tests, which is where all three of the
findings on this tree came from on 2026-07-30.
"""
paths = [
  '''^collections/''',
  '''^\.venv/''',
  '''^\.ansible/''',
  '''__pycache__/''',
  # Git worktrees. `gitleaks dir` walks the filesystem, not the index, so a
  # worktree checked out INSIDE the repo root gets scanned as a second copy of
  # this tree — and every path-scoped allowlist below is anchored at `^`, so
  # none of them match the copy. The result is a findings count equal to the
  # number of worktrees times the number of legitimately credential-shaped
  # files, all of them duplicates of content already scanned at its real path.
  #
  # That is not hypothetical or rare: CLAUDE.md's change workflow says parallel
  # work "gets a worktree", and the tooling puts them here. Three worktrees
  # turned a passing `make validate` into three findings on 2026-08-03, all of
  # them the credential canary allowlisted twenty lines below.
  #
  # Excluding the copy loses nothing. The real path is still scanned, every
  # commit still passes through the history scan in tests/scan_history_secrets.py,
  # and a worktree cannot reach a commit without its content existing at a
  # tracked path first.
  '''^\.claude/worktrees/''',
  '''/\.claude/worktrees/''',
]

[[allowlists]]
description = """
The vault template. all_vault.yml.example exists to document every vault_ key
with an empty or obviously-fake value; that is the file's whole purpose, and
tests/validate_secrets.py already enforces the placeholder forms with
PLACEHOLDER_RE. A generic entropy rule reading these as live credentials is the
expected false positive.
"""
paths = [
  '''^inventory/group_vars/all_vault\.yml\.example$''',
]

[[allowlists]]
description = """
The default-credential canary. This file exists precisely to contain
credential-shaped strings — admin/admin, admin/admin123,
changeme@example.com/MyPassword — and every one of them is a PUBLISHED UPSTREAM
DEFAULT lifted from the project's own documentation, not a secret belonging to
this estate. gitleaks' curl-auth-user rule firing here is the rule working
correctly on content that is deliberately public.

Scoped to this one path rather than disabling the rule, so a real `curl -u`
credential appearing anywhere else still fails the build. If this file ever
needs a genuine password it is the wrong design: the canary must keep working
on the nightly runner, whose checkout has no vault.
"""
paths = [
  '''^roles/service_vm/templates/credential-canary\.sh\.j2$''',
]
