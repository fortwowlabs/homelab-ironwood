---
name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Defense in depth: every Ansible parser in this job sees loopback-only
      # fixtures even if a tool omits its explicit --inventory argument.
      ANSIBLE_INVENTORY: tests/fixtures/inventory.yml
      ANSIBLE_LOCAL_TEMP: ${{ github.workspace }}/.ansible/tmp
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@v4
        with:
          # Full history is required by tests/scan_history_secrets.py.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ShellCheck
        run: sudo apt-get install --yes shellcheck

      # Not in Ubuntu's archive, so it comes from the upstream release —
      # pinned by version and verified by checksum, the same treatment the
      # Rocky cloud image gets in inventory/group_vars/all/main.yml. An
      # unpinned `latest` download would let a compromised release change what
      # the secret gate does, which is the one tool where that matters most.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install pinned dependencies
        run: make deps-dev

      - name: Run fixture-only validation
        run: make validate
