---
name: Validate

# This repository ff-merges locally and pushes straight to `main`, so a
# `pull_request` trigger alone meant CI had never run — not once, zero workflow
# runs, zero PRs. Every gate that claimed to be enforced was in fact enforced
# only by whoever remembered to type `make validate`.
#
# `push` to main is what makes it real. It runs AFTER the merge rather than
# before, so it cannot block a bad change from landing — local `make validate`
# is still the gate that fires first and most often. What it adds is a second
# opinion from a machine that is not the author's workstation, and one thing
# the workstation physically cannot do: `systemd-analyze verify` against the
# unit files. tests/validate_systemd_units.py downgrades itself to static
# checks on macOS, so until now no systemd had ever parsed a unit in this repo.
#
# The `pull_request` trigger stays for the day this repo starts using them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Defense in depth: every Ansible parser in this job sees loopback-only
      # fixtures even if a tool omits its explicit --inventory argument.
      ANSIBLE_INVENTORY: tests/fixtures/inventory.yml
      ANSIBLE_LOCAL_TEMP: ${{ github.workspace }}/.ansible/tmp
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@v4
        with:
          # Full history is required by tests/scan_history_secrets.py.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ShellCheck
        run: sudo apt-get install --yes shellcheck

      # systemd-analyze is what this job can do that the macOS workstation
      # cannot. tests/validate_systemd_units.py detects it via shutil.which and
      # switches from static text checks to actually parsing the units; without
      # it, the run here would be identical to the local one and buy nothing.
      - name: Install systemd-analyze
        run: sudo apt-get install --yes systemd

      # Not in Ubuntu's archive, so it comes from the upstream release —
      # pinned by version and verified by checksum, the same treatment the
      # Rocky cloud image gets in inventory/group_vars/all/main.yml. An
      # unpinned `latest` download would let a compromised release change what
      # the secret gate does, which is the one tool where that matters most.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        # Unpacked in a TEMP DIRECTORY, not the workspace. Doing this in the
        # checkout leaves a ~10 MB `gitleaks` binary and its tarball sitting in
        # the repo root, where `git ls-files --others --exclude-standard` sees
        # them as untracked files nothing ignores. tests/validate_secrets.py
        # scans extensionless files (TEXT_SUFFIXES includes "") and refuses
        # anything over 5 MB rather than reading it, so the job failed with
        # "gitleaks: text file exceeds the scanner's 5 MB safety limit" — the
        # tool the secret gate depends on breaking the secret gate.
        #
        # It could only ever fail here: the workstation installs gitleaks with
        # brew, so `make validate` locally never sees this and cannot.
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          archive="${workdir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$workdir" gitleaks
          sudo install -m 0755 "${workdir}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Install pinned dependencies
        run: make deps-dev

      - name: Run fixture-only validation
        run: make validate
